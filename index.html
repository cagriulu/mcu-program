<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>MCU — Antrenman Programı</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#000;--fg:#fff;
  --rim:rgba(255,255,255,0.15);
  --rim2:rgba(255,255,255,0.07);
  --muted:rgba(255,255,255,0.4);
  --muted2:rgba(255,255,255,0.25);
  --safe-top:env(safe-area-inset-top,44px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html[data-theme="light"]{
  --bg:#fff;--fg:#000;
  --rim:rgba(0,0,0,0.15);
  --rim2:rgba(0,0,0,0.06);
  --muted:rgba(0,0,0,0.4);
  --muted2:rgba(0,0,0,0.2);
}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'Inter Tight',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");opacity:.05;pointer-events:none;z-index:9999;}
.app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto;}
.sb{height:var(--safe-top);flex-shrink:0;}
.header{flex-shrink:0;border-bottom:1px solid var(--rim);}
.header-identity{display:flex;align-items:stretch;justify-content:space-between;padding:0;border-bottom:1px solid var(--rim);}
.header-logo{padding:14px 16px;display:flex;flex-direction:column;gap:3px;}
.logo-name{font-size:20px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;line-height:1;color:var(--fg);}
.logo-name span{font-weight:400;opacity:.45;}
.logo-sub{font-size:7px;font-weight:500;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);}
.header-controls{display:flex;align-items:center;gap:0;border-left:1px solid var(--rim);}
.header-year{padding:0 14px;font-size:9px;font-weight:400;letter-spacing:.1em;color:var(--muted);border-right:1px solid var(--rim);}
.theme-toggle{cursor:pointer;padding:0 14px;height:100%;display:flex;align-items:center;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:none;background:none;font-family:'Inter Tight',sans-serif;transition:color .15s;}
.theme-toggle:hover{color:var(--fg);}
.header-session{padding:20px 16px 0;display:flex;flex-direction:column;gap:0;}
.session-label{font-size:7.5px;font-weight:500;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;opacity:.5;}
.session-title{font-size:58px;font-weight:800;letter-spacing:-.03em;line-height:.88;text-transform:uppercase;color:var(--fg);margin-bottom:14px;}
.session-title em{font-style:normal;font-weight:400;letter-spacing:.0em;color:var(--fg);opacity:.35;}
.session-target{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--rim);}
.target-dot{width:3px;height:3px;border-radius:50%;background:var(--fg);opacity:.25;flex-shrink:0;}
.target-text{font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--fg);opacity:.45;}
.nav{flex-shrink:0;display:flex;overflow-x:auto;border-bottom:1px solid var(--rim);scrollbar-width:none;background:var(--bg);}
.nav::-webkit-scrollbar{display:none;}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 6px;gap:3px;cursor:pointer;position:relative;border-right:1px solid var(--rim);transition:background .12s;}
.nav-tab:last-child{border-right:none;}
.nav-tab-num{font-size:7px;font-weight:400;letter-spacing:.06em;color:var(--muted);opacity:.35;line-height:1;font-family:'Inter Tight',sans-serif;}
.nav-tab-lbl{font-size:7.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1;white-space:nowrap;font-family:'Inter Tight',sans-serif;}
.nav-tab.on{background:var(--fg);}
.nav-tab.on .nav-tab-num{color:var(--bg);opacity:.35;}
.nav-tab.on .nav-tab-lbl{color:var(--bg);}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.scroll::-webkit-scrollbar{display:none;}
.day-view{padding:0 16px 100px;}
.block{margin-top:20px;}
.block-hdr{display:grid;grid-template-columns:1fr auto auto auto;background:var(--fg);padding:0 8px;}
.bh-title{padding:7px 0;font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--bg);}
.bh-col{padding:7px 0 7px 12px;font-size:8px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--bg);opacity:.5;text-align:right;min-width:42px;}
.ex-row{display:grid;grid-template-columns:1fr auto auto auto;padding:10px 0;border-bottom:1px solid var(--rim2);align-items:start;}
.ex-row:last-child{border-bottom:none;}
.ex-num{font-size:8px;font-weight:400;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;opacity:.5;}
.ex-name{font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.2;}
.warmup-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.wp{font-size:7.5px;font-weight:500;letter-spacing:.08em;padding:2px 7px;border:1px solid var(--rim);color:var(--muted2);text-transform:uppercase;}
.ex-val{font-size:12px;font-weight:700;text-align:right;padding-left:12px;min-width:42px;padding-top:14px;}
.ex-val.muted{color:var(--muted);font-weight:400;}
.block-sep{display:none;}
.mcu-logo{position:fixed;bottom:calc(var(--safe-bot) + 16px);left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:100;}
.mcu-main{font-size:20px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--fg);line-height:1;opacity:.12;}
.mcu-year{font-size:8px;font-weight:400;letter-spacing:.28em;text-transform:uppercase;color:var(--fg);opacity:.08;margin-top:2px;}

/* TARİF BARI */
.recipe-bar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--rim);cursor:pointer;transition:background .12s;}
.recipe-bar:hover{background:var(--rim2);}
.recipe-bar.on{background:var(--fg);}
.recipe-bar.on .rb-label{color:var(--bg);}
.recipe-bar.on .rb-count{color:var(--bg);opacity:.45;}
.rb-label{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
.rb-count{font-size:8px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.5;}

/* TARİFLER */
.recipe-view{padding:0 16px 100px;}
.recipe-filter-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:16px 0 12px;}
.recipe-filter-row::-webkit-scrollbar{display:none;}
.rf-btn{flex-shrink:0;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border:1px solid var(--rim);background:transparent;color:var(--muted);font-family:'Inter Tight',sans-serif;cursor:pointer;transition:all .12s;}
.rf-btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg);}
.recipe-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.r-card{background:var(--bg);border:1px solid var(--rim);padding:12px;cursor:pointer;transition:border-color .12s;}
.r-card:hover{border-color:var(--muted);}
.r-card-emoji{font-size:20px;margin-bottom:8px;}
.r-card-name{font-size:12px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin-bottom:8px;color:var(--fg);}
.r-card-pills{display:flex;flex-wrap:wrap;gap:4px;}
.r-pill{font-size:7px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--rim);color:var(--muted);}
.r-pill.protein{border-color:var(--fg);color:var(--fg);}
.recipe-detail{padding:0 16px 100px;}
.rd-back{display:flex;align-items:center;gap:8px;padding:16px 0 20px;cursor:pointer;border-bottom:1px solid var(--rim);margin-bottom:20px;}
.rd-back-arrow{font-size:14px;font-weight:300;color:var(--muted);}
.rd-back-lbl{font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
.rd-emoji{font-size:40px;margin-bottom:12px;}
.rd-name{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1;margin-bottom:12px;color:var(--fg);}
.rd-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--rim);}
.rd-pill{font-size:7.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--rim);color:var(--muted);}
.rd-pill.protein{border-color:var(--fg);color:var(--fg);}
.rd-section{font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;background:var(--fg);color:var(--bg);padding:5px 8px;margin-bottom:12px;}
.rd-ing-list{list-style:none;padding:0;margin:0 0 20px;}
.rd-ing-list li{font-size:13px;font-weight:400;color:var(--muted);padding:8px 0;border-bottom:1px solid var(--rim2);display:flex;align-items:center;gap:8px;}
.rd-ing-list li::before{content:'';width:3px;height:3px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.rd-steps-list{list-style:none;padding:0;margin:0 0 20px;}
.rd-step{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--rim2);}
.rd-step:last-child{border-bottom:none;}
.rd-step-num{font-size:9px;font-weight:800;color:var(--bg);background:var(--fg);width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.rd-step-text{font-size:13px;font-weight:400;color:var(--muted);line-height:1.6;}

/* TAKVİM */
.takvim-view{padding:0 16px 100px;}
.tk-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;margin-bottom:4px;}
.tk-sum-card{background:var(--rim2);padding:.6rem .5rem;text-align:center;}
.tk-sum-val{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--fg);line-height:1;}
.tk-sum-lbl{font-size:7px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px;line-height:1.3;}
.tk-row{border-top:1px solid var(--rim);padding:16px 0;display:grid;grid-template-columns:72px 1fr;gap:0;}
.tk-rest{opacity:.45;}
.tk-left{padding-right:12px;border-right:1px solid var(--rim2);}
.tk-gun{font-size:7px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.tk-num{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--fg);opacity:.15;line-height:1;}
.tk-right{padding-left:14px;}
.tk-session-hdr{margin-bottom:10px;}
.tk-session-name{font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--fg);margin-bottom:6px;}
.tk-badges{display:flex;gap:5px;flex-wrap:wrap;}
.tk-badge{font-size:7px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--rim);color:var(--muted);}
.tk-badge-yuk{border-color:var(--fg);color:var(--fg);}
.tk-bars{margin-bottom:12px;}
.tk-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.tk-bar-kas{font-size:10px;color:var(--muted);min-width:70px;}
.tk-bar-track{flex:1;height:5px;background:var(--rim2);overflow:hidden;}
.tk-bar-fill{height:100%;background:var(--fg);opacity:.7;}
.tk-bar-val{font-size:10px;font-weight:500;color:var(--fg);min-width:16px;text-align:right;}
.tk-section-lbl{font-size:7px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--bg);background:var(--fg);display:inline-block;padding:2px 6px;margin-bottom:6px;opacity:.7;}
.tk-pills{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;}
.tk-pill{font-size:9px;color:var(--muted);border:1px solid var(--rim2);padding:2px 7px;}
.tk-pill-c{border-color:var(--rim);color:var(--fg);font-weight:500;}
.tk-note{font-size:10px;color:var(--muted);line-height:1.6;padding-top:8px;border-top:1px solid var(--rim2);opacity:.7;}
.tk-rest-lbl{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.tk-rest-note{font-size:10px;color:var(--muted);line-height:1.6;opacity:.7;}

/* BOKS */
.boks-view{padding:0 16px 100px;}
.boks-ay-tabs{display:flex;gap:0;margin-top:16px;margin-bottom:14px;border:1px solid var(--rim);}
.boks-ay-tab{flex:1;padding:8px 4px;font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center;cursor:pointer;background:transparent;border:none;border-right:1px solid var(--rim);color:var(--muted);font-family:'Inter Tight',sans-serif;line-height:1.4;transition:all .12s;}
.boks-ay-tab:last-child{border-right:none;}
.boks-ay-tab.on{background:var(--fg);color:var(--bg);}
.boks-ay-meta{background:var(--rim2);padding:.8rem 1rem;margin-bottom:12px;}
.boks-ay-baslik{font-size:13px;font-weight:700;color:var(--fg);margin-bottom:4px;}
.boks-ay-desc{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:8px;}
.boks-ay-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.boks-stat{background:var(--bg);padding:.5rem .7rem;border:1px solid var(--rim);}
.boks-stat-val{font-size:16px;font-weight:800;color:var(--fg);}
.boks-stat-lbl{font-size:8px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.boks-hafta{border:1px solid var(--rim);margin-bottom:8px;}
.boks-hafta-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;}
.boks-hafta-sol{display:flex;align-items:center;gap:10px;}
.boks-hafta-num{font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:52px;}
.boks-hafta-baslik{font-size:13px;font-weight:700;color:var(--fg);}
.boks-hafta-arrow{font-size:14px;color:var(--muted);transition:transform .2s;}
.boks-hafta-arrow.open{transform:rotate(180deg);}
.boks-ilerleme{padding:0 12px 8px;}
.boks-il-lbl{font-size:8px;font-weight:500;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:3px;}
.boks-il-track{height:3px;background:var(--rim);overflow:hidden;}
.boks-il-fill{height:100%;background:var(--fg);}
.boks-hafta-body{display:none;border-top:1px solid var(--rim);}
.boks-hafta-body.open{display:block;}
.boks-yeni-teknikler{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;border-bottom:1px solid var(--rim2);}
.boks-yt-pill{font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;background:var(--fg);color:var(--bg);}
.boks-seans{padding:10px 12px;}
.boks-seans-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.boks-seans-lbl{font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.boks-seans-sure{font-size:8px;color:var(--muted);border:1px solid var(--rim);padding:2px 6px;}
.boks-bolum{margin-bottom:10px;}
.boks-bolum-ad{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--fg);color:var(--bg);display:inline-block;padding:2px 7px;margin-bottom:6px;}
.boks-adim{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--rim2);}
.boks-adim:last-child{border-bottom:none;}
.boks-adim-num{font-size:9px;font-weight:700;color:var(--muted);min-width:16px;padding-top:1px;}
.boks-adim-ad{font-size:12px;font-weight:700;color:var(--fg);margin-bottom:2px;}
.boks-adim-det{font-size:11px;color:var(--muted);line-height:1.5;}

/* ANA NAVİGASYON */
.main-nav{flex-shrink:0;display:flex;border-bottom:1px solid var(--rim);background:var(--bg);}
.main-nav-btn{flex:1;padding:11px 0;font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;background:transparent;border:none;border-right:1px solid var(--rim);color:var(--muted);font-family:'Inter Tight',sans-serif;cursor:pointer;transition:all .12s;}
.main-nav-btn:last-child{border-right:none;}
.main-nav-btn.on{background:var(--fg);color:var(--bg);}

/* ARAÇLAR MENÜSÜ */
.araclar-menu{flex-shrink:0;border-bottom:1px solid var(--rim);}
.araclar-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;}
.araclar-card{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-right:1px solid var(--rim);border-bottom:1px solid var(--rim);cursor:pointer;transition:background .12s;background:var(--bg);}
.araclar-card:nth-child(even){border-right:none;}
.araclar-card:nth-last-child(-n+2){border-bottom:none;}
.araclar-card:active,.araclar-card:hover{background:var(--rim2);}
.araclar-card.active-card{background:var(--fg);}
.araclar-card.active-card .ac-label{color:var(--bg);}
.araclar-card.active-card .ac-desc{color:var(--bg);opacity:.5;}
.ac-label{font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--fg);line-height:1;}
.ac-desc{font-size:9px;color:var(--muted);line-height:1.4;margin-top:1px;}

.wod-bar,.recipe-bar,.organize-bar{display:none;}/* eski bar'ları gizle */

/* ORGANİZATÖR BAR */
.organize-bar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--rim);cursor:pointer;transition:background .12s;background:var(--fg);}
.organize-bar:hover{opacity:.9;}
.organize-bar.on{background:var(--fg);}
.org-bar-inner{display:flex;flex-direction:column;gap:2px;}
.org-bar-label{font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--bg);}
.org-bar-sub{font-size:8px;font-weight:400;letter-spacing:.1em;color:var(--bg);opacity:.5;}
.org-bar-arrow{font-size:14px;color:var(--bg);opacity:.5;}

/* ORGANİZATÖR VIEW */
.organize-view{padding:0 16px 100px;}
.org-day-tabs{display:flex;gap:0;border:1px solid var(--rim);margin-top:16px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;}
.org-day-tabs::-webkit-scrollbar{display:none;}
.org-day-tab{flex:1;padding:8px 4px;font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center;cursor:pointer;background:transparent;border:none;border-right:1px solid var(--rim);color:var(--muted);font-family:'Inter Tight',sans-serif;transition:all .12s;white-space:nowrap;}
.org-day-tab:last-child{border-right:none;}
.org-day-tab.on{background:var(--fg);color:var(--bg);}
.org-day-focus{font-size:8px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;opacity:.6;}
.org-sum-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.org-sum-card{background:var(--rim2);padding:.6rem .8rem;}
.org-sum-val{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--fg);}
.org-sum-lbl{font-size:8px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.org-sure-card{background:var(--fg);padding:.7rem 1rem;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.org-sure-lbl{font-size:8px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);opacity:.6;}
.org-sure-val{font-size:18px;font-weight:900;letter-spacing:-.02em;color:var(--bg);}
.org-muscle-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;}
.org-muscle-pill{font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--rim);color:var(--muted);}
.org-btn{width:100%;padding:12px;background:transparent;color:var(--fg);border:1px solid var(--rim);font-family:'Inter Tight',sans-serif;font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;margin-bottom:12px;transition:all .12s;}

.wod-meta-lbl{font-size:7px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.wod-meta-val{font-size:12px;font-weight:700;color:var(--fg);}
.wod-card-hikaye{font-size:11px;color:var(--muted);line-height:1.7;border-top:1px solid var(--rim2);padding-top:10px;}
.wod-loading{padding:40px 0;text-align:center;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
.wod-liste{display:flex;flex-direction:column;gap:6px;}
.wod-liste-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--rim);cursor:pointer;transition:background .1s;}
.wod-liste-item:active{background:var(--rim2);}
.wod-liste-sol{display:flex;align-items:center;gap:10px;}
.wod-liste-num{font-size:8px;font-weight:400;color:var(--muted);min-width:24px;}
.wod-liste-ad{font-size:13px;font-weight:700;color:var(--fg);}
.wod-liste-tur{font-size:8px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.wod-liste-ok{font-size:12px;color:var(--muted);}
.wod-back{display:flex;align-items:center;gap:8px;padding:14px 0;cursor:pointer;border-bottom:1px solid var(--rim);margin-bottom:14px;}
.wod-back-arrow{font-size:14px;font-weight:300;color:var(--muted);}
.wod-back-lbl{font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}

function renderAraclarMenu(){
  const menu=document.getElementById('araclar-menu');
  let html='<div class="araclar-grid">';
  ARACLAR_ITEMS.forEach(item=>{
    const isActive=mode===item.id;
    html+=`<div class="araclar-card${isActive?' active-card':''}" onclick="${item.fn}()">
      <div class="ac-label">${item.label}</div>
      <div class="ac-desc">${item.desc}</div>
    </div>`;
  });
  html+='</div>';
  menu.innerHTML=html;

function mainNavSwitch(tab){
  const isProgram=tab==='program';
  document.getElementById('mnav-program').classList.toggle('on',isProgram);
  document.getElementById('mnav-araclar').classList.toggle('on',!isProgram);
  document.getElementById('nav').style.display=isProgram?'flex':'none';
  document.getElementById('araclar-menu').style.display=isProgram?'none':'block';
  if(isProgram){
    if(!PROGRAM_MODES.includes(mode)) setHibrit();
    else renderNav();
  } else {
    renderAraclarMenu();
    if(!ARACLAR_MODES.includes(mode)){
      // araçlar açıldığında sadece menüyü göster, içeriği boşalt
    }
  }
}

function renderNav(){
  const isHibrit=mode==='hibrit';
  const isPPL=mode==='ppl'||mode==='program';
  let tabs='';
  if(isHibrit){
    HIBRIT_DAYS.forEach((d,i)=>{
      tabs+=`<div class="nav-tab${i===hibritActiveDay?' on':''}" onclick="hibritSetDay(${i})">
        <div class="nav-tab-num">0${i+1}</div>
        <div class="nav-tab-lbl">${d.label.replace('GÜN ','G')}</div>
      </div>`;
    });
  } else if(isPPL){
    DAYS.forEach((d,i)=>{
      tabs+=`<div class="nav-tab${i===cur?' on':''}" onclick="setDay(${i})">
        <div class="nav-tab-num">0${i+1}</div>
        <div class="nav-tab-lbl">${d.label}</div>
      </div>`;
    });
  }
  document.getElementById('nav').innerHTML=tabs;
  document.getElementById('nav').style.display=(isHibrit||isPPL)?'flex':'none';
  document.getElementById('araclar-menu').style.display=(!isHibrit&&!isPPL)?'block':'none';
  // ana nav aktiflik
  document.getElementById('mnav-program').classList.toggle('on',isHibrit||isPPL);
  document.getElementById('mnav-araclar').classList.toggle('on',!isHibrit&&!isPPL);
  if(!isHibrit&&!isPPL) renderAraclarMenu();
}

  });

let boksAktifAy=0;
let boksAcikHaftalar={};

function setBoks(){
  mode='boks';
  document.getElementById('hdr-title').textContent='BOKS';
  document.getElementById('hdr-target').textContent='3 AY · 12 HAFTA · TEMEL TEKNİK';
  hideAll();
  document.getElementById('boks-view').style.display='block';
  renderBoks();
  renderNav();
  document.getElementById('main-scroll').scrollTop=0;
}

function renderBoks(){
  const ay=BOKS_PLAN[boksAktifAy];
  let html='<div class="boks-ay-tabs">';
  BOKS_PLAN.forEach((a,i)=>{
    html+=`<button class="boks-ay-tab${i===boksAktifAy?' on':''}" onclick="setBoksAy(${i})">${a.ay}<br><span style="font-size:7px;opacity:.7">${a.subtitle}</span></button>`;
  });
  html+='</div>';
  html+=`<div class="boks-ay-meta"><div class="boks-ay-baslik">${ay.ay} — ${ay.subtitle}</div><div class="boks-ay-desc">${ay.desc}</div><div class="boks-ay-stats"><div class="boks-stat"><div class="boks-stat-val">${ay.seansSayisi}</div><div class="boks-stat-lbl">Planlanan seans</div></div><div class="boks-stat"><div class="boks-stat-val">${ay.teknikSayisi}</div><div class="boks-stat-lbl">Yeni teknik</div></div></div></div>`;
  ay.haftalar.forEach((h,hi)=>{
    const key=boksAktifAy+'_'+hi;
    const acik=boksAcikHaftalar[key];
    const pillsHtml=h.yeniTeknikler.map(t=>`<span class="boks-yt-pill">${t}</span>`).join('');
    let bodyHtml='<div class="boks-yeni-teknikler">'+pillsHtml+'</div>';
    h.seanslar.forEach(s=>{
      bodyHtml+=`<div class="boks-seans"><div class="boks-seans-hdr"><span class="boks-seans-lbl">${s.baslik}</span><span class="boks-seans-sure">${s.sure}</span></div>`;
      s.bolumler.forEach(b=>{
        bodyHtml+=`<div class="boks-bolum"><div class="boks-bolum-ad">${b.ad}</div>`;
        b.adimlar.forEach((a,ai)=>{
          bodyHtml+=`<div class="boks-adim"><span class="boks-adim-num">${ai+1}.</span><div><div class="boks-adim-ad">${a.ad}</div><div class="boks-adim-det">${a.det}</div></div></div>`;
        });
        bodyHtml+=`</div>`;
      });
      bodyHtml+=`</div>`;
    });
    html+=`<div class="boks-hafta"><div class="boks-hafta-hdr" onclick="toggleBoksHafta('${key}')"><div class="boks-hafta-sol"><span class="boks-hafta-num">${h.num}</span><span class="boks-hafta-baslik">${h.baslik}</span></div><span class="boks-hafta-arrow${acik?' open':''}">↓</span></div><div class="boks-ilerleme"><div class="boks-il-lbl"><span>3 aylık ilerleme</span><span>${h.ilerleme}%</span></div><div class="boks-il-track"><div class="boks-il-fill" style="width:${h.ilerleme}%"></div></div></div><div class="boks-hafta-body${acik?' open':''}">${bodyHtml}</div></div>`;
  });
  document.getElementById('boks-view').innerHTML=html;
}

function setBoksAy(i){boksAktifAy=i;renderBoks();}
function toggleBoksHafta(key){boksAcikHaftalar[key]=!boksAcikHaftalar[key];renderBoks();}

let wodMode='ana',wodAktif=null;

function setWod(){
  mode='wod';
  document.getElementById('hdr-title').textContent='CROSSFIT WOD';
  document.getElementById('hdr-target').textContent='200+ İKONİK WOD · YAPAY ZEKA ÜRETİMİ';
  hideAll();
  document.getElementById('wod-view').style.display='block';
  wodMode='ana';wodAktif=null;
  renderWodAna();
  renderNav();
  document.getElementById('main-scroll').scrollTop=0;
}

function renderWodAna(){
  const kategoriler=['Tümü','Benchmark Girl','Hero WOD','Classic','CrossFit Open','CrossFit Games','Conditioning','Skill WOD','Functional','Strength','Gymnastics'];
  let html='<div class="wod-tabs" id="wod-kat-tabs">';
  kategoriler.forEach((k,i)=>{
    html+=`<button class="wod-tab${i===0?' on':''}" onclick="filterWod('${k}',this)">${k==='Tümü'?'TÜMÜ':k.toUpperCase()}</button>`;
  });
  html+='</div>';
  html+=`<button class="wod-random-btn" onclick="randomWod()">⚡ RANDOM WOD</button>`;
  html+='<div class="wod-liste" id="wod-liste">';
  WODS.forEach(w=>{
    html+=`<div class="wod-liste-item" onclick="showWod(${w.id})"><div class="wod-liste-sol"><span class="wod-liste-num">#${String(w.id).padStart(3,'0')}</span><div><div class="wod-liste-ad">${w.isim}</div><div class="wod-liste-tur">${w.tur} · ${w.format} · ${w.zorluk}</div></div></div><span class="wod-liste-ok">→</span></div>`;
  });
  html+='</div>';
  document.getElementById('wod-view').innerHTML=html;
}

function filterWod(kat,btn){
  document.querySelectorAll('.wod-tab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  const filtered=kat==='Tümü'?WODS:WODS.filter(w=>w.tur===kat);
  const liste=document.getElementById('wod-liste');
  liste.innerHTML=filtered.map(w=>
    `<div class="wod-liste-item" onclick="showWod(${w.id})"><div class="wod-liste-sol"><span class="wod-liste-num">#${String(w.id).padStart(3,'0')}</span><div><div class="wod-liste-ad">${w.isim}</div><div class="wod-liste-tur">${w.tur} · ${w.format} · ${w.zorluk}</div></div></div><span class="wod-liste-ok">→</span></div>`
  ).join('');
}

function randomWod(){
  const w=WODS[Math.floor(Math.random()*WODS.length)];
  showWod(w.id);
}

function showWod(id){
  wodAktif=id;
  const w=WODS.find(x=>x.id===id);
  document.getElementById('wod-view').innerHTML=
    `<div class="wod-back" onclick="setWod()"><span class="wod-back-arrow">←</span><span class="wod-back-lbl">WOD Listesine Dön</span></div>`+
    `<div class="wod-card">`+
    `<div class="wod-card-hdr"><div class="wod-card-type">${w.tur}</div><div class="wod-card-name">${w.isim}</div><div class="wod-card-kategori">#${String(w.id).padStart(3,'0')} · ${w.zorluk}</div></div>`+
    `<div class="wod-card-body">`+
    `<div class="wod-card-format">${w.format}</div>`+
    `<div class="wod-card-content">${w.icerik}</div>`+
    `<div class="wod-card-meta"><div class="wod-meta-item"><div class="wod-meta-lbl">Tahmini Süre</div><div class="wod-meta-val">${w.sure}</div></div><div class="wod-meta-item"><div class="wod-meta-lbl">Zorluk</div><div class="wod-meta-val">${w.zorluk}</div></div></div>`+
    `<div class="wod-card-hikaye">${w.hikaye}</div>`+
    `</div></div>`+
    `<button class="wod-random-btn" style="margin-top:14px;" onclick="randomWod()">⚡ BAŞKA RANDOM WOD</button>`;
  document.getElementById('main-scroll').scrollTop=0;
}

let orgActiveDay=0;
let orgCurrentBlocks=[];

function orgToRoman(n){return['I','II','III','IV','V','VI','VII','VIII'][n-1]||n;}

function orgGetMuscles(blocks){
  const c={};
  blocks.forEach(b=>b.exs.forEach(e=>{(e.muscles||[]).forEach(m=>{c[m]=(c[m]||0)+1;});}));
  return c;
}

function orgRenderBlocks(){
  const blocks=orgCurrentBlocks;
  let totalSets=0,totalEx=0;
  blocks.forEach(b=>b.exs.forEach(e=>{totalEx++;totalSets+=parseInt(e.sets)||0;}));
  const mc=orgGetMuscles(blocks);
  const d=ORG_DAYS[orgActiveDay];
  document.getElementById('org-sum-row').innerHTML=
    '<div class="org-sum-card"><div class="org-sum-val">'+totalEx+'</div><div class="org-sum-lbl">Hareket</div></div>'+
    '<div class="org-sum-card"><div class="org-sum-val">'+totalSets+'</div><div class="org-sum-lbl">Toplam set</div></div>';
  document.getElementById('org-sure-card').innerHTML=
    '<span class="org-sure-lbl">Tahmini Sure</span><span class="org-sure-val">'+d.sureMin+'-'+d.sureMax+' dk</span>';
  document.getElementById('org-muscle-row').innerHTML=
    Object.entries(mc).sort((a,b)=>b[1]-a[1]).map(([m,c])=>'<span class="org-muscle-pill">'+c+' '+m+'</span>').join('');
  const cont=document.getElementById('org-blocks');
  cont.innerHTML='';
  blocks.forEach((block,bi)=>{
    const card=document.createElement('div');
    card.className='org-block';
    card.innerHTML='<div class="org-block-hdr"><span class="org-block-lbl">'+block.name+'</span><span class="org-block-sub">'+block.sub+'</span></div>';
    block.exs.forEach((ex,ei)=>{
      const row=document.createElement('div');
      row.className='org-ex-row';
      row.innerHTML=
        '<div class="org-ex-num">'+orgToRoman(ei+1)+'</div>'+
        '<div class="org-ex-info">'+
          '<div class="org-ex-name">'+ex.name+'</div>'+
          (ex.note?'<div class="org-ex-note">'+ex.note+'</div>':'')+
          '<span class="org-ex-badge '+(ex.fixed?'badge-sabit':'badge-atletik')+'">'+(ex.fixed?'Sabit':'Atletik')+'</span>'+
        '</div>'+
        '<div class="org-ex-meta">'+
          '<div class="org-ex-sets">'+ex.sets+' set</div>'+
          '<div class="org-ex-reps">'+ex.reps+'</div>'+
          '<div class="org-ex-rir">'+ex.rir+'</div>'+
        '</div>'+
        '<button class="org-swap-btn" onclick="orgSwap('+bi+','+ei+')" title="Hareketi degistir"'+(ex.fixed?' disabled':'')+'>&#8635;</button>';
      card.appendChild(row);
    });
    cont.appendChild(card);
  });
}

function orgSwap(bi,ei){
  const ex=orgCurrentBlocks[bi].exs[ei];
  if(ex.fixed||!ex.pool) return;
  const pool=OATH[ex.pool];
  if(!pool) return;
  const others=pool.filter(e=>e.name!==ex.name);
  if(!others.length) return;
  orgCurrentBlocks[bi].exs[ei]={...orgRand(others),fixed:false,pool:ex.pool};
  orgRenderBlocks();
}

function orgOrganize(){
  orgCurrentBlocks=ORG_PROGRAMS[orgActiveDay]();
  orgRenderBlocks();
}

function orgSetDay(i){
  orgActiveDay=i;

  } else {
    const lifts=OLY_LIFTS.filter(l=>l.phase.includes(olyPhase));
    const phaseDesc=olyPhase===0?'Olimpik kaldırışa giriş aşaması. Yerden kaldırış yok, hafif ağırlık, mükemmel form. Bu aşamada ağırlık değil teknik önceliklidir.':'Temel hareketler oturdu. Ağırlık artmaya başlar, snatch devreye girer. Form hâlâ öncelikli ama intensite yükseliyor.';
    html+=`<div class="oly-phase-desc">${phaseDesc}</div>`;
    html+=`<div class="oly-warning"><div class="oly-warn-icon">⚠</div><div class="oly-warn-text"><strong>Altın kural:</strong> Olimpik kaldırışlarda ağırlık artırma hızı kassal gücünden değil, <strong>teknik güvenilirliğinden</strong> belirlenir. Hatalı formda ağır kaldırış = sakatlık garantisi.</div></div>`;
    lifts.forEach(lift=>{
      const open=!!olyOpenLifts[lift.key];
      html+=`<div class="oly-lift-card"><div class="oly-lift-hdr" onclick="olyToggleLift('${lift.key}')"><div class="oly-lift-hdr-left"><div class="oly-lift-name">${lift.name}</div><div class="oly-lift-sub">${lift.sub}</div></div><div class="oly-lift-arrow${open?' open':''}" id="oly-lift-arrow-${lift.key}">↓</div></div><div class="oly-lift-body${open?' open':''}" id="oly-lift-body-${lift.key}">`;
      html+=`<div class="oly-progression"><div class="oly-prog-lbl">ÖĞRENME AŞAMALARI</div>`;
      lift.steps.forEach((s,si)=>{
        html+=`<div class="oly-step"><div class="oly-step-num">${si+1}</div><div class="oly-step-content"><div class="oly-step-name">${s.name}</div><div class="oly-step-desc">${s.desc}</div><div class="oly-step-tip">💡 ${s.tip}</div></div></div>`;
      });
      html+=`</div><div class="oly-cues"><div class="oly-prog-lbl">FORM CUES</div><div class="oly-cue-list">`;
      lift.cues.forEach(c=>{html+=`<div class="oly-cue"><div class="oly-cue-dot"></div><div class="oly-cue-text">${c.text}</div></div>`;});
      html+=`</div></div><div class="oly-errors"><div class="oly-prog-lbl">YAYGIN HATALAR</div>`;
      lift.errors.forEach(e=>{html+=`<div class="oly-error-item"><div class="oly-error-icon">${e.icon}</div><div class="oly-error-text">${e.text}</div></div>`;});
      html+=`</div></div></div>`;
    });
  }
  cont.innerHTML=html;
}

function renderOlyView(){
  const v=document.getElementById('oly-view');
  let html=`<div class="oly-phase-tabs" id="oly-phase-tabs">`;
  OLY_PHASES.forEach((p,i)=>{
    html+=`<button class="oly-phase-tab${i===olyPhase?' on':''}" onclick="olySetPhase(${i})">${p.label}<br><span style="font-size:6.5px;opacity:.5;font-weight:400;">${p.tag}</span></button>`;
  });
  html+=`</div>`;
  html+=`<div class="oly-hero"><div class="oly-hero-title">OLİMPİK KALDIRIŞ</div><div class="oly-hero-sub">Sıfırdan · Aşamalı · PPL Korunuyor</div><div class="oly-hero-tags"><span class="oly-hero-tag highlight">PPL Korunuyor</span><span class="oly-hero-tag">Clean & Jerk</span><span class="oly-hero-tag">Power Snatch</span><span class="oly-hero-tag">12 Hafta</span></div></div>`;
  html+=`<div id="oly-content"></div>`;
  v.innerHTML=html;
  renderOlyContent();
}

  hideAll();
  document.getElementById('oly-view').style.display='block';

  renderNav();
  document.getElementById('main-scroll').scrollTop=0;
}

let hibritActiveDay=0;
let hibritWodIndices=[null,null,null,null,null];
let hibritWodHistory=[[],[],[],[],[]];

function hibritGetNextWod(dayIdx){
  const pool=HIBRIT_DAYS[dayIdx].wodPool;
  const history=hibritWodHistory[dayIdx];
  let available=pool.map((_,i)=>i).filter(i=>!history.includes(i));
  if(available.length===0){hibritWodHistory[dayIdx]=[];available=pool.map((_,i)=>i);}
  const pick=available[Math.floor(Math.random()*available.length)];
  hibritWodHistory[dayIdx].push(pick);
  return pick;
}

function hibritRollWod(dayIdx){
  const btn=document.getElementById('hibrit-wod-btn-'+dayIdx);
  if(btn){btn.classList.add('spinning');setTimeout(()=>btn&&btn.classList.remove('spinning'),400);}
  hibritWodIndices[dayIdx]=hibritGetNextWod(dayIdx);
  renderHibritWod(dayIdx);
}

function renderHibritWod(dayIdx){
  const day=HIBRIT_DAYS[dayIdx];
  const wod=day.wodPool[hibritWodIndices[dayIdx]];
  const cont=document.getElementById('hibrit-wod-content-'+dayIdx);
  if(!cont||!wod)return;
  cont.innerHTML=
    '<div class="hibrit-wod-name">'+wod.name+'</div>'+
    '<div class="hibrit-wod-type">'+wod.type+'</div>'+
    '<div class="hibrit-wod-content">'+wod.content+'</div>'+
    '<div class="hibrit-wod-meta">'+
      '<div class="hibrit-wod-meta-item"><div class="hibrit-wod-meta-lbl">Süre</div><div class="hibrit-wod-meta-val">'+wod.sure+'</div></div>'+
      '<div class="hibrit-wod-meta-item"><div class="hibrit-wod-meta-lbl">Yoğunluk</div><div class="hibrit-wod-meta-val">'+wod.yogunluk+'</div></div>'+
    '</div>'+
    '<div class="hibrit-wod-note">'+wod.note+'</div>';
}

function hibritSetDay(i){
  hibritActiveDay=i;
  document.querySelectorAll('.hibrit-day-tab').forEach((t,j)=>t.classList.toggle('on',j===i));
  const d=HIBRIT_DAYS[i];
  document.getElementById('hdr-title').textContent=d.title;
  document.getElementById('hdr-target').textContent='HİBRİT PPL-X · '+d.gun+' · '+d.tags[0].toUpperCase();
  renderNav();
  renderHibritDay();
}

function renderHibritDay(){
  const day=HIBRIT_DAYS[hibritActiveDay];
  const di=hibritActiveDay;
  const cont=document.getElementById('hibrit-day-content');
  if(!cont)return;
  let html='<div class="hibrit-hero"><div class="hibrit-hero-left">'+
    '<div class="hibrit-hero-title">'+day.title+'</div>'+
    '<div class="hibrit-hero-sub">'+day.gun+'</div>'+
    '<div class="hibrit-hero-tags">'+day.tags.map((t,i)=>'<span class="hibrit-hero-tag'+(i===0?' hl':'')+'">'+t+'</span>').join('')+'</div>'+
    '</div></div>';

  day.blocks.forEach(b=>{
    html+='<div class="hibrit-block"><div class="hibrit-block-hdr"><div class="hibrit-block-lbl">'+b.name+'</div><div class="hibrit-block-sub">'+b.sub+'</div></div>';
    b.exs.forEach(ex=>{
      if(ex.sets&&ex.sets!==''){
        html+='<div class="hibrit-ex-row"><div><div class="hibrit-ex-num">'+ex.num+'</div><div class="hibrit-ex-name">'+ex.name+'</div>'+(ex.note?'<div class="hibrit-ex-note">'+ex.note+'</div>':'')+'</div><div class="hibrit-ex-val">'+ex.sets+'</div><div class="hibrit-ex-val">'+ex.reps+'</div><div class="hibrit-ex-val muted">'+ex.note+'</div></div>';
      } else {
        html+='<div style="padding:5px 12px 5px 24px;border-bottom:1px solid var(--rim2);"><div class="hibrit-ex-name" style="font-size:12px;opacity:.55;">'+ex.num+' '+ex.name+'</div></div>';
      }
    });
    html+='</div>';
  });

  html+='<div class="hibrit-wod-block">'+
    '<div class="hibrit-wod-hdr">'+
      '<div class="hibrit-wod-hdr-left">'+
        '<div class="hibrit-wod-hdr-lbl">BLOK C — RANDOM WOD</div>'+
        '<div class="hibrit-wod-hdr-sub">Bugünün kaslarına uygun · '+day.wodPool.length+' farklı WOD</div>'+
      '</div>'+
      '<button class="hibrit-wod-btn" id="hibrit-wod-btn-'+di+'" onclick="hibritRollWod('+di+')">'+
        '<span class="hibrit-wod-btn-icon">⟳</span> YENİLE'+
      '</button>'+
    '</div>'+
    '<div class="hibrit-wod-body" id="hibrit-wod-content-'+di+'"></div>'+
  '</div>';

  cont.innerHTML=html;
  if(hibritWodIndices[di]===null){
    hibritWodIndices[di]=hibritGetNextWod(di);
  }
  renderHibritWod(di);
}

function renderHibritView(){
  const v=document.getElementById('hibrit-view');
  v.innerHTML='<div id="hibrit-day-content"></div>';
  renderHibritDay();
}

function setHibrit(){
  mode='hibrit';
  const d=HIBRIT_DAYS[hibritActiveDay];
  document.getElementById('hdr-title').textContent=d.title;
  document.getElementById('hdr-target').textContent='HİBRİT PPL-X · '+d.gun+' · '+d.tags[0].toUpperCase();
  hideAll();
  document.getElementById('hibrit-view').style.display='block';
  renderHibritView();
  renderNav();
  document.getElementById('main-scroll').scrollTop=0;
}

// BAŞLANGIC: Hibrit program
setHibrit();
</script>
<script>
/* ─── PROGRAM ANALİZİ ─── */
var analizTab=0;
var PPL_ANALIZ={
  kasHacmi:{
    'Göğüs':{ppl:9,hibrit:10},'Omuz':{ppl:8,hibrit:9},'Triseps':{ppl:9,hibrit:7},
    'Sırt':{ppl:10,hibrit:10},'Biseps':{ppl:9,hibrit:7},'Bacak (Quad)':{ppl:8,hibrit:10},
    'Hamstring':{ppl:6,hibrit:9},'Core':{ppl:9,hibrit:9},'Kondisyon':{ppl:0,hibrit:8}
  },
  genel:{
    ppl:{toplamSet:53,compoundSet:20,izoSet:33,ortSure:70,hipertrofi:85,guc:65,atletizm:5,kondisyon:5},
    hibrit:{toplamSet:52,compoundSet:30,izoSet:22,ortSure:65,hipertrofi:78,guc:72,atletizm:60,kondisyon:70}
  },
  optimal:{
    'Göğüs':{mev:10,mrv:22,ppl:9,hibrit:10},'Omuz':{mev:8,mrv:20,ppl:8,hibrit:9},
    'Triseps':{mev:8,mrv:18,ppl:9,hibrit:7},'Sırt':{mev:10,mrv:25,ppl:10,hibrit:10},
    'Biseps':{mev:8,mrv:18,ppl:9,hibrit:7},'Bacak':{mev:12,mrv:26,ppl:8,hibrit:10},
    'Hamstring':{mev:6,mrv:16,ppl:6,hibrit:9},'Core':{mev:8,mrv:20,ppl:9,hibrit:9}
  }
};

function analizBadge(v,mev,mrv){
  if(v<mev)return '<span class="optimal-badge badge-dusuk">DÜŞÜK</span>';
  if(v>mrv)return '<span class="optimal-badge badge-yuksek">FAZLA</span>';
  return '<span class="optimal-badge badge-optimal">OPTİMAL</span>';
}

function renderAnalizContent(){
  var cont=document.getElementById('analiz-content');
  if(!cont)return;
  var g=PPL_ANALIZ.genel;
  var html='';

  if(analizTab===0){
    html+='<div class="analiz-section"><div class="analiz-title">GENEL KARŞILAŞTIRMA</div><div class="analiz-desc">İki programın yapısal analizi — toplam hacim, yoğunluk ve zaman verimliliği.</div>';
    var metrics=[
      {label:'Toplam Set',ppl:g.ppl.toplamSet,hibrit:g.hibrit.toplamSet,max:60,birim:''},
      {label:'Compound Set',ppl:g.ppl.compoundSet,hibrit:g.hibrit.compoundSet,max:35,birim:''},
      {label:'İzolasyon Set',ppl:g.ppl.izoSet,hibrit:g.hibrit.izoSet,max:40,birim:''},
      {label:'Ort. Süre',ppl:g.ppl.ortSure,hibrit:g.hibrit.ortSure,max:90,birim:' dk'}
    ];
    html+='<div class="bar-legend"><div class="bar-legend-item"><div class="bar-legend-dot ppl"></div>PPL</div><div class="bar-legend-item"><div class="bar-legend-dot hibrit"></div>HİBRİT</div></div><div class="bar-chart">';
    metrics.forEach(function(m){
      html+='<div class="bar-group-title">'+m.label+'</div>';
      html+='<div class="bar-row"><div class="bar-label">PPL</div><div class="bar-track"><div class="bar-fill ppl" style="width:'+Math.round(m.ppl/m.max*100)+'%"></div></div><div class="bar-val">'+m.ppl+m.birim+'</div></div>';
      html+='<div class="bar-row" style="margin-bottom:10px;"><div class="bar-label">HİBRİT</div><div class="bar-track"><div class="bar-fill hibrit" style="width:'+Math.round(m.hibrit/m.max*100)+'%"></div></div><div class="bar-val">'+m.hibrit+m.birim+'</div></div>';
    });
    html+='</div>';
    var skors=[
      {label:'Hipertrofi',ppl:g.ppl.hipertrofi,hibrit:g.hibrit.hipertrofi},
      {label:'Güç',ppl:g.ppl.guc,hibrit:g.hibrit.guc},
      {label:'Atletizm',ppl:g.ppl.atletizm,hibrit:g.hibrit.atletizm},
      {label:'Kondisyon',ppl:g.ppl.kondisyon,hibrit:g.hibrit.kondisyon}
    ];
    html+='<div class="analiz-title" style="margin-top:4px;">PROGRAM SKORLARI</div>';
    skors.forEach(function(s){
      var pw=s.ppl>=s.hibrit;
      html+='<div class="skor-grid">';
      html+='<div class="skor-card'+(pw?' winner':'')+'"><div class="skor-program">PPL</div><div class="skor-label">'+s.label+'</div><div class="skor-val">'+s.ppl+'<span class="skor-max">/100</span></div><div class="skor-bar-wrap"><div class="skor-bar-fill" style="width:'+s.ppl+'%"></div></div>'+(pw?'<div class="skor-winner-badge">ÜSTÜN</div>':'')+'</div>';
      html+='<div class="skor-card'+(!pw?' winner':'')+'"><div class="skor-program">HİBRİT PPL-X</div><div class="skor-label">'+s.label+'</div><div class="skor-val">'+s.hibrit+'<span class="skor-max">/100</span></div><div class="skor-bar-wrap"><div class="skor-bar-fill" style="width:'+s.hibrit+'%"></div></div>'+(!pw?'<div class="skor-winner-badge">ÜSTÜN</div>':'')+'</div>';
      html+='</div>';
    });
    html+='</div>';

  } else if(analizTab===1){
    html+='<div class="analiz-section"><div class="analiz-title">HAFTALIK KAS GRUBU HACMİ</div><div class="analiz-desc">Her kas grubunun haftada aldığı toplam çalışma seti. MEV–MRV arası optimum bölgedir.</div>';
    html+='<div class="bar-legend"><div class="bar-legend-item"><div class="bar-legend-dot ppl"></div>PPL</div><div class="bar-legend-item"><div class="bar-legend-dot hibrit"></div>HİBRİT</div></div><div class="bar-chart">';
    Object.keys(PPL_ANALIZ.kasHacmi).forEach(function(kas){
      var v=PPL_ANALIZ.kasHacmi[kas];
      var max=Math.max(v.ppl,v.hibrit,10);
      html+='<div class="bar-group-title">'+kas+'</div>';
      html+='<div class="bar-row"><div class="bar-label">PPL</div><div class="bar-track"><div class="bar-fill ppl" style="width:'+Math.round(v.ppl/max*100)+'%"></div></div><div class="bar-val">'+v.ppl+'</div></div>';
      html+='<div class="bar-row" style="margin-bottom:10px;"><div class="bar-label">HİBRİT</div><div class="bar-track"><div class="bar-fill hibrit" style="width:'+Math.round(v.hibrit/max*100)+'%"></div></div><div class="bar-val">'+v.hibrit+'</div></div>';
    });
    html+='</div></div>';

  } else if(analizTab===2){
    html+='<div class="analiz-section"><div class="analiz-title">SPORCU PROFİL RADARLAR</div><div class="analiz-desc">Her programın 5 boyutlu sporcu profili. Dış çember = 100 puan.</div>';
    var axes=['Hipertrofi','Güç','Atletizm','Kondisyon','Toparlanma'];
    var pVals=[85,65,5,5,60];
    var hVals=[78,72,60,70,55];
    var cx=150,cy=145,r=100,n=5;
    function rad(i){return 2*Math.PI*i/n-Math.PI/2;}
    function pt(i,val){return {x:cx+r*(val/100)*Math.cos(rad(i)),y:cy+r*(val/100)*Math.sin(rad(i))};}
    function ptFull(i,frac){return {x:cx+r*frac*Math.cos(rad(i)),y:cy+r*frac*Math.sin(rad(i))};}
    var gridSvg='';
    [0.25,0.5,0.75,1].forEach(function(f){
      var pts=axes.map(function(_,i){var p=ptFull(i,f);return p.x+','+p.y;}).join(' ');
      gridSvg+='<polygon points="'+pts+'" fill="none" stroke="var(--rim)" stroke-width="1"/>';
    });
    var axSvg=axes.map(function(_,i){var p=ptFull(i,1);return '<line x1="'+cx+'" y1="'+cy+'" x2="'+p.x+'" y2="'+p.y+'" stroke="var(--rim)" stroke-width="1"/>';}).join('');
    var lblSvg=axes.map(function(a,i){var p=ptFull(i,1.22);return '<text x="'+p.x+'" y="'+p.y+'" text-anchor="middle" dominant-baseline="middle" font-size="8.5" font-family="Inter Tight,sans-serif" font-weight="700" letter-spacing="0.1em" fill="var(--muted)">'+a.toUpperCase()+'</text>';}).join('');
    var pPts=pVals.map(function(v,i){var p=pt(i,v);return p.x+','+p.y;}).join(' ');
    var hPts=hVals.map(function(v,i){var p=pt(i,v);return p.x+','+p.y;}).join(' ');
    html+='<div class="radar-wrap"><svg width="300" height="295" viewBox="0 0 300 295" style="overflow:visible">'+gridSvg+axSvg+lblSvg+'<polygon points="'+pPts+'" fill="var(--muted)" fill-opacity=".15" stroke="var(--muted)" stroke-width="1.5" stroke-opacity=".6"/><polygon points="'+hPts+'" fill="var(--fg)" fill-opacity=".12" stroke="var(--fg)" stroke-width="2"/></svg></div>';
    html+='<div class="bar-legend" style="justify-content:center;margin-bottom:14px;"><div class="bar-legend-item"><div class="bar-legend-dot ppl"></div>PPL</div><div class="bar-legend-item"><div class="bar-legend-dot hibrit"></div>HİBRİT PPL-X</div></div>';
    var radar=[{l:'Hipertrofi',p:85,h:78},{l:'Güç',p:65,h:72},{l:'Atletizm',p:5,h:60},{l:'Kondisyon',p:5,h:70},{l:'Toparlanma',p:60,h:55}];
    html+='<div class="bar-chart">';
    radar.forEach(function(d){
      html+='<div class="bar-group-title">'+d.l+'</div>';
      html+='<div class="bar-row"><div class="bar-label">PPL</div><div class="bar-track"><div class="bar-fill ppl" style="width:'+d.p+'%"></div></div><div class="bar-val">'+d.p+'</div></div>';
      html+='<div class="bar-row" style="margin-bottom:10px;"><div class="bar-label">HİBRİT</div><div class="bar-track"><div class="bar-fill hibrit" style="width:'+d.h+'%"></div></div><div class="bar-val">'+d.h+'</div></div>';
    });
    html+='</div></div>';

  } else if(analizTab===3){
    html+='<div class="analiz-section"><div class="analiz-title">OPTİMAL HACİM ANALİZİ</div><div class="analiz-desc">MEV = minimum etkili hacim. MRV = maksimum toparlanabilir hacim. Her iki eşik arasında kalmak hipertrofi için idealdir (Israetel, 2019).</div>';
    html+='<div class="optimal-tablo"><div class="optimal-hdr"><div class="optimal-hdr-cell">Kas Grubu</div><div class="optimal-hdr-cell">PPL</div><div class="optimal-hdr-cell">HİBRİT</div><div class="optimal-hdr-cell">DURUM</div></div>';
    Object.keys(PPL_ANALIZ.optimal).forEach(function(kas){
      var d=PPL_ANALIZ.optimal[kas];
      var hb=analizBadge(d.hibrit,d.mev,d.mrv);
      html+='<div class="optimal-row"><div><div class="optimal-kas">'+kas+'</div><div style="font-size:8px;color:var(--muted);margin-top:2px;">MEV '+d.mev+' · MRV '+d.mrv+'</div></div><div class="optimal-cell">'+d.ppl+' set</div><div class="optimal-cell">'+d.hibrit+' set</div><div style="text-align:center;">'+hb+'</div></div>';
    });
    html+='</div>';
    html+='<div class="sonuc-box"><div class="sonuc-box-title">ANALİZ SONUCU</div><div class="sonuc-item"><div class="sonuc-icon">✓</div><div class="sonuc-text"><strong>Bacak & hamstring MEV\'in üzerine çıktı</strong> — PPL\'de her ikisi de minimum eşikte kalıyordu.</div></div><div class="sonuc-item"><div class="sonuc-icon">✓</div><div class="sonuc-text"><strong>Her iki program da MRV altında</strong> — overtraining riski yok.</div></div><div class="sonuc-item"><div class="sonuc-icon">!</div><div class="sonuc-text"><strong>Triseps & biseps hibrit\'te MEV sınırına yakın</strong> — gerekirse BLOK B\'ye 1 izolasyon seti eklenebilir.</div></div></div></div>';

  } else {
    html+='<div class="analiz-section"><div class="analiz-title">NE YAPMALIYIM?</div><div class="analiz-desc">Verilerden çıkan sonuçlar ve senin profiline özel değerlendirme.</div>';
    html+='<div class="sonuc-box"><div class="sonuc-box-title">HİPERTROFİ KAYBI RİSKİ</div><div class="sonuc-item"><div class="sonuc-icon">✓</div><div class="sonuc-text"><strong>Net hipertrofi kaybı beklenmez.</strong> Toplam set sayısı neredeyse aynı (53 → 52).</div></div><div class="sonuc-item"><div class="sonuc-icon">✓</div><div class="sonuc-text"><strong>Compound oranı %38\'den %58\'e yükseldi</strong> — compound hem hipertrofi hem güç üretir.</div></div><div class="sonuc-item"><div class="sonuc-icon">!</div><div class="sonuc-text"><strong>Biseps & triseps izolasyonu azaldı.</strong> Fark edersen BLOK B\'ye 1 set ekle.</div></div></div>';
    html+='<div class="sonuc-box"><div class="sonuc-box-title">GÜÇLÜ YÖNLER</div><div class="sonuc-item"><div class="sonuc-icon">★</div><div class="sonuc-text"><strong>Conventional Deadlift primer konuma geldi</strong> — 4×3-5, RIR 1.</div></div><div class="sonuc-item"><div class="sonuc-icon">★</div><div class="sonuc-text"><strong>Atletizm skoru 5\'ten 60\'a çıktı</strong> — Mat Fraser hedefine en kritik adım.</div></div><div class="sonuc-item"><div class="sonuc-icon">★</div><div class="sonuc-text"><strong>Kondisyon 0\'dan 70\'e çıktı</strong> — kalp-akciğer kapasitesi ve yağ yakımı artacak.</div></div></div>';
    html+='<div class="sonuc-box"><div class="sonuc-box-title">12 HAFTA SONRA BEKLENTİLER</div><div class="sonuc-item"><div class="sonuc-icon">→</div><div class="sonuc-text"><strong>Kas kütlesi:</strong> Korunur, büyük ihtimalle artar.</div></div><div class="sonuc-item"><div class="sonuc-icon">→</div><div class="sonuc-text"><strong>Deadlift / Squat 1RM:</strong> Artış beklenir.</div></div><div class="sonuc-item"><div class="sonuc-icon">→</div><div class="sonuc-text"><strong>Cindy skoru:</strong> 8-10 rounddan 15+ rounda çıkabilir.</div></div><div class="sonuc-item"><div class="sonuc-icon">→</div><div class="sonuc-text"><strong>Görünüm:</strong> Daha sıkı, daha atletik — Mat Fraser estetiğine yaklaşma başlar.</div></div></div></div>';
  }
  cont.innerHTML=html;
}

function analizSetTab(i){
  analizTab=i;
  document.querySelectorAll('.analiz-tab').forEach(function(t,j){t.classList.toggle('on',j===i);});
  renderAnalizContent();
  document.getElementById('main-scroll').scrollTop=0;
}

function renderAnalizView(){
  var v=document.getElementById('analiz-view');
  var tabs=['GENEL','KAS HACMİ','PROFIL RADAR','OPTİMAL HACİM','SONUÇ'];
  var html='<div class="analiz-tabs">';
  tabs.forEach(function(t,i){html+='<button class="analiz-tab'+(i===analizTab?' on':'')+'" onclick="analizSetTab('+i+')">'+t+'</button>';});
  html+='</div><div id="analiz-content"></div>';
  v.innerHTML=html;
  renderAnalizContent();
}

function setAnaliz(){
  mode='analiz';
  document.getElementById('hdr-title').textContent='ANALİZ';
  document.getElementById('hdr-target').textContent='PPL vs HİBRİT PPL-X · GRAFİKLİ KARŞILAŞTIRMA';
  hideAll();
  document.getElementById('analiz-view').style.display='block';
  renderAnalizView();
  renderNav();
  document.getElementById('main-scroll').scrollTop=0;
}
</script>
