<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>hypertrophy.program // M. Çağrı Ulu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --fg:#e6e6e6;
    --white:#ffffff;
    --gray:#8c8c8c;
    --dim:#5a5a5a;
    --faint:#333333;
    --line:#1e1e1e;
    --line2:#141414;
    --done:#454545;
    --mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:var(--mono);
    font-size:14px;
    line-height:1.7;
    letter-spacing:.2px;
    padding:0 0 5rem;
    min-height:100vh;
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
  }
  /* CRT overlays */
  .scan,.vig{position:fixed;inset:0;pointer-events:none;z-index:50}
  .scan{background:repeating-linear-gradient(rgba(255,255,255,.022) 0 1px, transparent 1px 3px);mix-blend-mode:screen;opacity:.6}
  .vig{background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%)}
  .glow{text-shadow:0 0 1px rgba(255,255,255,.25)}

  .wrap{max-width:780px;margin:0 auto;padding:0 16px}

  /* window chrome */
  .chrome{position:sticky;top:0;z-index:40;background:#000;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:12px;color:var(--gray)}
  .dots{display:flex;gap:7px}
  .dots i{width:10px;height:10px;border-radius:50%;border:1px solid var(--dim);display:inline-block}
  .chrome .path{color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .chrome .path b{color:var(--fg);font-weight:500}
  .clock{color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}

  section{padding:22px 0;border-bottom:1px solid var(--line2)}
  .cmd{color:var(--gray)}
  .cmd .p{color:var(--white);font-weight:500}
  .out{color:var(--dim)}
  .ok{color:var(--fg)}
  .hl{color:var(--white);font-weight:500}
  .cmt{color:var(--dim)}
  .cmt::before{content:"# ";color:var(--faint)}

  /* boot */
  .boot p{white-space:pre-wrap}
  .banner{border:1px solid var(--line);border-radius:2px;padding:14px 16px;margin-top:14px;background:linear-gradient(#050505,#000)}
  .banner .big{color:var(--white);font-weight:700;font-size:clamp(16px,5.4vw,24px);letter-spacing:2px;line-height:1.25;text-shadow:0 0 2px rgba(255,255,255,.3)}
  .banner .sub{color:var(--gray);font-size:12.5px;margin-top:4px}
  .meta{margin-top:16px;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:13px}
  .meta dt{color:var(--dim)}
  .meta dt::before{content:"› ";color:var(--faint)}
  .meta dd{color:var(--fg)}
  .meta dd b{color:var(--white);font-weight:500}

  /* day */
  .day{scroll-margin-top:60px}
  .dayhead{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;padding:4px 0;color:var(--white)}
  .dayhead:focus-visible{outline:1px dotted var(--gray);outline-offset:3px}
  .caret{color:var(--dim);transition:transform .18s ease;display:inline-block;width:12px}
  .day.collapsed .caret{transform:rotate(-90deg)}
  .dayhead .fn{color:var(--white);font-weight:500}
  .dayhead .fn .kw{color:var(--gray);font-weight:400}
  .dayhead .tag{color:var(--dim);font-size:12px;margin-left:auto;text-align:right}
  .prog{font-size:12px;color:var(--gray);margin:6px 0 10px;font-variant-numeric:tabular-nums}
  .prog .bar{color:var(--fg);letter-spacing:1px}
  .list{overflow:hidden}
  .day.collapsed .list{display:none}

  .ex{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;padding:7px 4px;border-radius:2px;cursor:pointer;
    border-left:1px solid transparent}
  .ex:hover{background:#0a0a0a;border-left-color:var(--faint)}
  .ex:focus-visible{outline:1px dotted var(--gray);outline-offset:-1px}
  .ex .ln{color:var(--faint);width:26px;flex:0 0 26px;text-align:right;font-size:12.5px;user-select:none}
  .ex .box{color:var(--gray);width:26px;flex:0 0 26px;white-space:nowrap}
  .ex .nm{color:var(--fg);flex:1 1 200px;min-width:150px}
  .ex .mt{color:var(--gray);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .ex .mt .rir{color:var(--dim)}
  .ex .warm{flex-basis:100%;padding-left:52px;color:var(--faint);font-size:12px}
  .ex .warm::before{content:"# ";}
  .ex.done .nm{color:var(--done);text-decoration:line-through;text-decoration-color:var(--faint)}
  .ex.done .mt{color:var(--done)}
  .ex.done .box{color:var(--fg)}

  /* volume table */
  .vol{display:grid;grid-template-columns:1fr auto auto;gap:2px 12px;font-size:13px;margin-top:12px}
  .vol .h{color:var(--dim);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:2px}
  .vol .k{color:var(--fg)}
  .vol .v{color:var(--white);text-align:right;font-variant-numeric:tabular-nums}
  .vol .s{color:var(--gray);text-align:right}
  .vol .warnv{color:var(--gray)}

  .notes p{color:var(--gray);padding:3px 0 3px 20px;text-indent:-20px}
  .notes p::before{content:"# ";color:var(--faint)}
  .notes p b{color:var(--fg);font-weight:500}

  /* footer / prompt */
  .foot{padding:24px 0 0}
  .foot .prompt{color:var(--white)}
  .foot .prompt .p{color:var(--gray)}
  .cur{display:inline-block;width:9px;height:16px;background:var(--white);vertical-align:-3px;margin-left:2px;
    animation:blink 1.05s step-end infinite;box-shadow:0 0 4px rgba(255,255,255,.5)}
  @keyframes blink{50%{opacity:0}}
  .actions{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px}
  .btn{background:#000;color:var(--gray);border:1px solid var(--line);border-radius:2px;font-family:var(--mono);
    font-size:12.5px;padding:8px 12px;cursor:pointer;letter-spacing:.3px}
  .btn:hover{border-color:var(--dim);color:var(--fg)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:1px dotted var(--gray);outline-offset:2px}
  .btn .p{color:var(--dim)}

  .reveal{opacity:0;transform:translateY(6px);animation:rise .5s ease forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    .reveal{animation:none;opacity:1;transform:none}
    .cur{animation:none}
    .scan{display:none}
  }
  @media (max-width:520px){
    body{font-size:13px}
    .ex .nm{flex-basis:100%;min-width:0}
    .ex .mt{padding-left:52px}
    .dayhead .tag{display:none}
  }
</style>
</head>
<body>
<div class="scan" aria-hidden="true"></div>
<div class="vig" aria-hidden="true"></div>

<header class="chrome">
  <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
  <span class="path">cagri@hypertrophy: <b>~/program/ppl-ul.sh</b></span>
  <span class="clock" id="clock">--:--:--</span>
</header>

<main class="wrap" id="app"></main>

<script>
const PROGRAM = {
  meta:{
    athlete:"M. Çağrı Ulu", split:"PUSH · PULL · LEGS · UPPER · LOWER",
    days:5, freq:"2x / kas", level:"orta seviye (1–3 yıl)",
    goal:"hipertrofi [birincil] · güç + yağ yakımı [ikincil]",
    equip:"makine ağırlıklı", rating:"9.5 / 10", version:"v1.0"
  },
  days:[
    {id:"push", name:"push_day", tag:"göğüs · omuz · triceps", ex:[
      {n:"Smith Incline Press", s:"2 × 4–6", r:"1–2", w:"+2 ısınma"},
      {n:"Machine Chest Press", s:"2 × 6–8", r:"1–2"},
      {n:"Dips", s:"2 × 6–10", r:"1–2"},
      {n:"Pec Deck", s:"2 × 8–10", r:"1"},
      {n:"Smith Shoulder Press", s:"2 × 5–6", r:"1–2", w:"+2 ısınma"},
      {n:"Cable Lateral Raise", s:"3 × 8–10", r:"0–1"},
      {n:"Triceps Pushdown", s:"2 × 6–8", r:"0–1"},
      {n:"Overhead Cable Ext", s:"2 × 8–10", r:"0–1"}
    ]},
    {id:"pull", name:"pull_day", tag:"sırt · biceps · önkol", ex:[
      {n:"Deadlift", s:"2 × 4–5", r:"1–2", w:"+3 ısınma · favori"},
      {n:"Lat Pulldown", s:"3 × 6–8", r:"1–2"},
      {n:"Chest-Supported Row", s:"3 × 6–8", r:"1–2"},
      {n:"Reverse Pec Deck", s:"2 × 10–12", r:"0–1"},
      {n:"DB Shrug", s:"2 × 8–10", r:"0–1"},
      {n:"Incline DB Curl", s:"2 × 6–8", r:"1"},
      {n:"Cable Curl", s:"2 × 6–8", r:"1"},
      {n:"Cable Hammer Curl", s:"2 × 6–8", r:"1"},
      {n:"Reverse Barbell Curl", s:"2 × 8–10", r:"1"}
    ]},
    {id:"legs", name:"legs_day", tag:"quad · glute · hamstring", ex:[
      {n:"Barbell Back Squat", s:"2 × 4–6", r:"1–2", w:"+3 ısınma"},
      {n:"Leg Press", s:"2 × 6–8", r:"1–2"},
      {n:"Leg Extension", s:"2 × 8–10", r:"0–1"},
      {n:"Lying Leg Curl", s:"3 × 8–10", r:"0–1"},
      {n:"Machine Hip Thrust", s:"2 × 6–8", r:"1"},
      {n:"Standing Calf Raise", s:"3 × 8–10", r:"0–1"}
    ]},
    {id:"upper", name:"upper_day", tag:"göğüs · sırt · omuz · kol", ex:[
      {n:"Machine Chest Press", s:"2 × 6–8", r:"1–2"},
      {n:"Pec Deck", s:"2 × 8–10", r:"1"},
      {n:"Neutral Lat Pulldown", s:"3 × 6–8", r:"1–2"},
      {n:"Seated Cable Row", s:"2 × 6–8", r:"1–2"},
      {n:"Cable Lateral Raise", s:"3 × 8–10", r:"0–1"},
      {n:"DB Shrug", s:"2 × 8–10", r:"0–1"},
      {n:"Triceps Pushdown", s:"2 × 6–8", r:"0–1"},
      {n:"Cable Curl", s:"2 × 6–8", r:"1"}
    ]},
    {id:"lower", name:"lower_day", tag:"quad · glute · baldır", ex:[
      {n:"Hack Squat", s:"3 × 6–8", r:"1–2", w:"+2 ısınma"},
      {n:"DB Walking Lunges", s:"2 × 8–12", r:"1–2"},
      {n:"Lying Leg Curl", s:"3 × 8–10", r:"0–1"},
      {n:"Machine Hip Thrust", s:"2 × 6–8", r:"1"},
      {n:"Seated Calf Raise", s:"3 × 10–12", r:"0–1"}
    ]}
  ],
  volume:[
    ["göğüs",12,"2x"],["yan omuz",6,"2x"],["arka omuz",2,"1x*"],["triceps",6,"2x"],
    ["sırt (genişlik)",6,"2x"],["sırt (kalınlık)",7,"2x"],["biceps",6,"2x"],["brachialis",2,"2x"],
    ["trapez",4,"2x"],["quadriceps",11,"2x"],["hamstring",6,"2x"],["glute",6,"2x"],["baldır",6,"2x"]
  ],
  notes:[
    ["Isınma setleri hacme sayılmaz","— parantezli ağır bileşiklerden önce yap, izolasyonlarda gerek yok."],
    ["Progresyon","aralığın altından başla, her hafta tekrar ekle; üst sınıra ulaşınca ağırlığı artır, alta düş (çift progresyon)."],
    ["Mekanik gerilim","gerilmiş pozisyona kontrollü in, eksantriği 2–3 sn yap — gerilim burada birikir."],
    ["Deload","her 6–8 haftada 1 hafta ana setleri ~%40 azalt, 3–4 RIR'de kal."],
    ["* arka omuz 2 set / 1x","hafif düşük; istersen Upper gününe 2 set Reverse Pec Deck ekle → 10/10."]
  ]
};

const KEY='cu_hypertrophy_v1';
let done={};
try{done=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){done={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}

function bar(f,t){const seg=10,fill=t?Math.round(f/t*seg):0;return '['+'▓'.repeat(fill)+'░'.repeat(seg-fill)+'] '+f+'/'+t;}

function render(){
  const m=PROGRAM.meta;
  let h='';

  h+='<section class="boot reveal" style="animation-delay:.02s">';
  h+='<p class="cmd"><span class="p">$</span> ./load_program.sh --athlete "'+m.athlete+'"</p>';
  h+='<p class="out">&gt; parsing config ............... <span class="ok">ok</span></p>';
  h+='<p class="out">&gt; split: <span class="hl">'+m.split+'</span></p>';
  h+='<p class="out">&gt; days: <span class="hl">'+m.days+'</span>   frequency: <span class="hl">'+m.freq+'</span></p>';
  h+='<p class="out">&gt; rating: <span class="hl">'+m.rating+'</span>   status: <span class="hl">LOCKED</span></p>';
  h+='<div class="banner"><div class="big glow">HYPERTROPHY.PROGRAM</div><div class="sub">'+m.athlete+' &nbsp;//&nbsp; PPL·UL &nbsp;//&nbsp; '+m.version+'</div></div>';
  h+='<dl class="meta">';
  h+='<dt>hedef</dt><dd>'+m.goal+'</dd>';
  h+='<dt>seviye</dt><dd>'+m.level+'</dd>';
  h+='<dt>ekipman</dt><dd>'+m.equip+'</dd>';
  h+='</dl></section>';

  PROGRAM.days.forEach((d,di)=>{
    h+='<section class="day reveal" id="'+d.id+'" style="animation-delay:'+(.06+di*.03)+'s">';
    h+='<div class="dayhead" role="button" tabindex="0" data-day="'+di+'">';
    h+='<span class="caret">▾</span>';
    h+='<span class="fn"><span class="kw">function</span> day_0'+(di+1)+'_'+d.name+'()</span>';
    h+='<span class="tag">'+d.tag+'</span></div>';
    h+='<div class="prog" data-prog="'+di+'"></div>';
    h+='<div class="list">';
    d.ex.forEach((e,ei)=>{
      const k=di+':'+ei, isd=!!done[k];
      h+='<div class="ex'+(isd?' done':'')+'" role="button" tabindex="0" data-k="'+k+'">';
      h+='<span class="ln">'+String(ei+1).padStart(2,'0')+'</span>';
      h+='<span class="box">'+(isd?'[x]':'[ ]')+'</span>';
      h+='<span class="nm">'+e.n+'</span>';
      h+='<span class="mt">'+e.s+' &nbsp; <span class="rir">rir:'+e.r+'</span></span>';
      if(e.w) h+='<span class="warm">'+e.w+'</span>';
      h+='</div>';
    });
    h+='</div></section>';
  });

  h+='<section class="reveal" style="animation-delay:.24s">';
  h+='<p class="cmd"><span class="p">$</span> ./weekly_volume.sh <span class="out">--per-muscle</span></p>';
  h+='<div class="vol"><div class="h">kas</div><div class="h v">set</div><div class="h s">frekans</div>';
  PROGRAM.volume.forEach(v=>{
    const low=v[1]<6;
    h+='<div class="k">'+v[0]+'</div><div class="v'+(low?' warnv':'')+'">'+v[1]+'</div><div class="s">'+v[2]+'</div>';
  });
  h+='</div><p class="cmt" style="margin-top:10px">hedef bölge: 10–18 ana set / kas · hepsi optimal aralıkta</p></section>';

  h+='<section class="notes reveal" style="animation-delay:.28s">';
  h+='<p class="cmd" style="text-indent:0;padding-left:0"><span class="p">$</span> cat NOTES.md</p>';
  PROGRAM.notes.forEach(n=>{ h+='<p><b>'+n[0]+'</b> '+n[1]+'</p>'; });
  h+='</section>';

  h+='<section class="foot reveal" style="animation-delay:.3s;border:none">';
  h+='<div class="actions">';
  h+='<button class="btn" id="reset"><span class="p">$</span> reset --all</button>';
  h+='<button class="btn" id="fold"><span class="p">$</span> toggle --collapse</button>';
  h+='</div>';
  h+='<p class="prompt" style="margin-top:20px"><span class="p">cagri@hypertrophy</span>:~$<span class="cur"></span></p>';
  h+='</section>';

  document.getElementById('app').innerHTML=h;
  PROGRAM.days.forEach((d,di)=>updateProg(di));
  bind();
}

function updateProg(di){
  const el=document.querySelector('[data-prog="'+di+'"]');
  if(!el)return;
  const total=PROGRAM.days[di].ex.length;
  let f=0; for(let ei=0;ei<total;ei++) if(done[di+':'+ei]) f++;
  el.innerHTML='<span class="bar">'+bar(f,total)+'</span>'+(f===total?'  <span class="hl">✓ done</span>':'');
}

function toggle(k){
  const [di]=k.split(':');
  done[k]=!done[k]; if(!done[k]) delete done[k];
  save();
  const row=document.querySelector('.ex[data-k="'+k+'"]');
  if(row){const on=!!done[k];row.classList.toggle('done',on);row.querySelector('.box').textContent=on?'[x]':'[ ]';}
  updateProg(+di);
}

function bind(){
  document.querySelectorAll('.ex').forEach(el=>{
    const k=el.dataset.k;
    el.addEventListener('click',()=>toggle(k));
    el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggle(k);}});
  });
  document.querySelectorAll('.dayhead').forEach(el=>{
    const sec=el.closest('.day');
    const t=()=>sec.classList.toggle('collapsed');
    el.addEventListener('click',t);
    el.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();t();}});
  });
  document.getElementById('reset').addEventListener('click',()=>{
    done={};save();
    document.querySelectorAll('.ex.done').forEach(r=>{r.classList.remove('done');r.querySelector('.box').textContent='[ ]';});
    PROGRAM.days.forEach((d,di)=>updateProg(di));
  });
  let folded=false;
  document.getElementById('fold').addEventListener('click',()=>{
    folded=!folded;
    document.querySelectorAll('.day').forEach(s=>s.classList.toggle('collapsed',folded));
  });
}

function tick(){
  const d=new Date();
  const p=n=>String(n).padStart(2,'0');
  const el=document.getElementById('clock');
  if(el) el.textContent='[ '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+' ]';
}

render();
tick();
setInterval(tick,1000);
</script>
</body>
</html>
