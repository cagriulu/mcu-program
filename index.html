<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>MCU — Training Program</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#000;--fg:#fff;
  --rim:rgba(255,255,255,0.15);
  --rim2:rgba(255,255,255,0.07);
  --muted:rgba(255,255,255,0.4);
  --muted2:rgba(255,255,255,0.25);
  --safe-top:env(safe-area-inset-top,44px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html[data-theme="light"]{
  --bg:#fff;--fg:#000;
  --rim:rgba(0,0,0,0.15);
  --rim2:rgba(0,0,0,0.06);
  --muted:rgba(0,0,0,0.4);
  --muted2:rgba(0,0,0,0.2);
}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'Inter Tight',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");opacity:.05;pointer-events:none;z-index:9999;}
.app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto;}
.sb{height:var(--safe-top);flex-shrink:0;}

/* HEADER */
.header{flex-shrink:0;padding:0 16px;border-bottom:1px solid var(--rim);}
.header-top{display:grid;grid-template-columns:1fr auto 1fr;border-bottom:1px solid var(--rim);}
.ht-cell{padding:8px 10px;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;line-height:1.2;}
.ht-cell.left{border-right:1px solid var(--rim);}
.ht-cell.center{text-align:center;border-right:1px solid var(--rim);color:var(--muted);font-weight:400;}
.ht-cell.right{text-align:right;color:var(--muted);font-weight:400;display:flex;align-items:center;justify-content:flex-end;gap:8px;}
.theme-toggle{cursor:pointer;font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 6px;border:1px solid var(--rim);color:var(--muted);text-transform:uppercase;}
.header-title{padding:14px 0 10px;font-size:52px;font-weight:900;letter-spacing:-.02em;line-height:1;text-transform:uppercase;}
.header-sub{display:flex;border-top:1px solid var(--rim);}
.hs-cell{padding:7px 10px;font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.hs-cell span{color:var(--fg);font-weight:600;}

/* NAV */
.nav{flex-shrink:0;display:flex;overflow-x:auto;border-bottom:1px solid var(--rim);scrollbar-width:none;}
.nav::-webkit-scrollbar{display:none;}
.nav-tab{flex-shrink:0;padding:11px 14px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;position:relative;white-space:nowrap;}
.nav-tab.on{color:var(--fg);}
.nav-tab.on::after{content:'';position:absolute;bottom:0;left:14px;right:14px;height:1.5px;background:var(--fg);}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.scroll::-webkit-scrollbar{display:none;}

/* DAY VIEW */
.day-view{padding:0 16px 100px;}

/* BLOCK */
.block{margin-top:20px;}
.block-hdr{display:grid;grid-template-columns:1fr auto auto auto;border-top:1px solid var(--rim);border-bottom:1px solid var(--rim);}
.bh-title{padding:7px 0;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;}
.bh-col{padding:7px 0 7px 12px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;min-width:42px;}

/* EX ROW */
.ex-row{display:grid;grid-template-columns:1fr auto auto auto;padding:9px 0;border-bottom:1px solid var(--rim2);align-items:start;}
.ex-row:last-child{border-bottom:none;}
.ex-num{font-size:9px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px;}
.ex-name{font-size:13px;font-weight:700;letter-spacing:-.01em;line-height:1.25;}
.warmup-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;}
.wp{font-size:8px;font-weight:600;letter-spacing:.06em;padding:2px 6px;border:1px solid var(--rim);color:var(--muted2);text-transform:uppercase;}
.ex-val{font-size:12px;font-weight:600;text-align:right;padding-left:12px;min-width:42px;padding-top:14px;}
.ex-val.muted{color:var(--muted);}
.block-sep{height:1px;background:var(--rim2);margin:24px 0 0;}

/* MCU LOGO — fixed bottom */
.mcu-logo{
  position:fixed;
  bottom:calc(var(--safe-bot) + 16px);
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  pointer-events:none;
  z-index:100;
}
.mcu-main{font-size:22px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--fg);line-height:1;opacity:.18;}
.mcu-year{font-size:9px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--fg);opacity:.12;margin-top:2px;}


.lift-block{margin-top:24px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.08);}
[data-theme="light"] .lift-block{border-color:rgba(0,0,0,0.08);}
.lift-name{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;}
.lift-info{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:12px;font-weight:400;}
.lift-targets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;}
.lt{padding:8px;border:1px solid var(--rim);text-align:center;}
.lt-val{font-size:14px;font-weight:800;line-height:1;}
.lt-lbl{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:2px;}
.chart-area{width:100%;height:110px;position:relative;overflow:hidden;}
.chart-svg{width:100%;height:100%;}
.milestone-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.ms{font-size:8px;font-weight:600;letter-spacing:.08em;padding:2px 7px;border:1px solid var(--rim);color:var(--muted);text-transform:uppercase;}
.ms.key{border-color:var(--fg);color:var(--fg);}

/* PHILOSOPHY */
.phil-hero{padding:28px 16px 24px;border-bottom:1px solid var(--rim);}
.phil-hero-tag{font-family:'Inter Tight',sans-serif;font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.phil-hero-title{font-size:38px;font-weight:900;letter-spacing:-.02em;line-height:1.05;text-transform:uppercase;margin-bottom:8px;}
.phil-hero-sub{font-size:12px;color:var(--muted);line-height:1.7;font-weight:400;max-width:340px;}
.phil-section{padding:24px 16px 0;}
.phil-sec-label{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.phil-sec-title{font-size:19px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--rim);}
.phil-body{font-size:12px;color:var(--muted);line-height:1.8;font-weight:400;margin-bottom:16px;}
.phil-body b{color:var(--fg);font-weight:700;}

/* INFOGRAPHIC BLOCKS */
.infog{margin:16px 0;background:var(--fg);color:var(--bg);padding:16px;position:relative;overflow:hidden;}
.infog-title{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px;opacity:.5;}
.infog-grid{display:grid;gap:1px;background:rgba(128,128,128,0.2);}
.infog-cell{background:var(--fg);padding:12px;display:flex;flex-direction:column;gap:4px;}
.infog-val{font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1;}
.infog-lbl{font-size:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.5;}

/* COMPARISON TABLE */
.cmp-table{border:1px solid var(--rim);margin:16px 0;}
.cmp-row{display:grid;border-bottom:1px solid var(--rim);}
.cmp-row:last-child{border-bottom:none;}
.cmp-row.hdr{background:var(--fg);color:var(--bg);}
.cmp-cell{padding:8px 10px;font-size:10px;font-weight:500;letter-spacing:.04em;}
.cmp-row.hdr .cmp-cell{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
.cmp-cell.win{font-weight:700;color:var(--fg);}
.cmp-cell.muted{color:var(--muted);}

/* PYRAMID */
.pyramid{margin:16px 0;display:flex;flex-direction:column;gap:2px;}
.pyr-row{display:flex;align-items:center;gap:10px;}
.pyr-bar{height:36px;background:var(--fg);display:flex;align-items:center;padding:0 12px;flex-shrink:0;}
.pyr-bar-label{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--bg);}
.pyr-text{font-size:10px;color:var(--muted);line-height:1.4;}

/* TIMELINE */
.timeline{margin:16px 0;display:flex;flex-direction:column;gap:0;}
.tl-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--rim);}
.tl-row:last-child{border-bottom:none;}
.tl-num{font-size:28px;font-weight:900;letter-spacing:-.02em;color:var(--muted);opacity:.3;width:36px;flex-shrink:0;line-height:1;}
.tl-content{}
.tl-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.tl-text{font-size:11px;color:var(--muted);line-height:1.6;}

/* FREQUENCY VIZ */
.freq-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0;}
.freq-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--rim);}
.freq-cell.on{background:var(--fg);color:var(--bg);border-color:var(--fg);}
.freq-cell.rest{color:var(--muted);}

/* QUOTE */
.phil-quote{margin:24px 0;padding:20px 16px;border-left:2px solid var(--fg);background:var(--fg);color:var(--bg);}
.pq-text{font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.4;text-transform:uppercase;margin-bottom:6px;}
.pq-source{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.5;}

/* DIVIDER */
.phil-divider{height:1px;background:var(--rim);margin:24px 16px 0;}

/* PHILOSOPHY BAR */
.phil-bar{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;
  border-bottom:1px solid var(--rim);
  cursor:pointer;
  background:var(--fg);
  color:var(--bg);
  transition:opacity .15s;
}
.phil-bar:active{opacity:.8;}
.pb-left{display:flex;align-items:center;gap:12px;}
.pb-tag{font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.45;border-right:1px solid rgba(128,128,128,0.3);padding-right:12px;}
.pb-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.pb-right{font-size:14px;font-weight:300;opacity:.5;}
</style>
</head>

let cur=0,light=false;

function toggleTheme(){
  light=!light;
  document.documentElement.setAttribute('data-theme',light?'light':'');
  document.getElementById('theme-btn').textContent=light?'DARK':'LIGHT';
}







function renderPhilosophy(){
  var lang=window._philLang||'en';
  var T={
    en:{
      tag:'Training Philosophy · M. Çağrı Ulu · 2026',
      heroTitle:'Built for<br>Hypertrophy.<br>Built for Power.',
      heroSub:'A science-based Push/Pull/Hybrid system engineered for simultaneous hypertrophy, functional strength, and athletic performance — for an intermediate-advanced male at 80 kg, 32 years old.',
      btnLang:'Türkçe',
      s1label:'Section 01',s1title:'Why This Program Exists',
      s1a:'Most programs optimize for one goal. This one was built to pursue three simultaneously: <b>hypertrophy, functional strength, and athletic performance.</b> The Push/Pull/Push/Pull/Hybrid architecture solves the classic trade-off — you should not have to choose between being big, strong, and athletic.',
      s1b:'The 5-day split preserves the scientific gold standard of <b>twice-weekly frequency</b> per muscle group, keeps compound performance high by alternating push and pull days, and dedicates an entire session to athletic development that most hypertrophy programs ignore completely.',
      s2label:'Section 02',s2title:'The Science of Frequency',
      s2a:'Schoenfeld et al. (2016) demonstrated that training each muscle group <b>twice per week produces significantly more hypertrophy than once per week</b> with equal volume. Protein synthesis peaks 24–48 hours post-training and returns to baseline shortly after — training once per week leaves enormous anabolic potential unused.',
      s2b:'This program structurally guarantees 2× frequency for every major muscle group: chest, deltoids, triceps, back, biceps, and forearms. Not by coincidence — by architecture.',
      s3label:'Section 03',s3title:'Mechanical Tension: The Primary Driver',
      s3a:'Of the three proposed mechanisms of hypertrophy — mechanical tension, metabolic stress, and muscle damage — <b>mechanical tension is the most potent signal.</b> It is generated when a muscle resists a significant load through a full range of motion, particularly in the lengthened position.',
      s3b:'Every exercise selection reflects this. Incline Dumbbell Curl over standing curl — the lengthened position stimulus is superior. Chest Supported T-Bar Row over standard row — chest support eliminates momentum, forcing pure back work. <b>Every rep, every exercise choice serves mechanical tension.</b>',
      s4label:'Section 04',s4title:'RIR: The Intensity Framework',
      s4a:'Reps In Reserve is the primary intensity metric. <b>Compound movements: RIR 1–2. Isolation movements: Failure (RIR 0).</b> Heavy compounds — Deadlift, Bench, OHP, Squat — carry significant CNS cost. Training these to failure leads to accumulated fatigue and injury risk. Isolations, with lower systemic cost, can and should reach failure for maximum local stimulus.',
      s5label:'Section 05',s5title:'Free Weights: The Athletic Imperative',
      s5a:'The transition from Smith Machine to barbell was functional, not aesthetic. Behm & Anderson (2006): free weight exercises activate <b>30–40% more stabilizer musculature</b> than machine equivalents. Rotator cuff, serratus anterior, spinal erectors — these are not accessories, they are longevity infrastructure.',
      s5b:'This program does not dogmatically reject machines. Pec Deck, Cable Lateral Raise, Cable Row remain — because for isolation movements, cable resistance curves are genuinely superior. <b>Compound movements belong on barbells. Isolation movements belong on cables.</b>',
      s6label:'Section 06',s6title:'The Hybrid Day: Athletic Layer',
      s6a:'The Friday Hybrid session is where the program earns its athletic credibility. Back Squat and Front Squat develop total lower body strength. The Rowing Ergometer delivers the highest aerobic-to-fatigue ratio of any conditioning tool. Toes-to-Bar trains the core in its most functional state. <b>This session does not compromise hypertrophy. It extends it.</b>',
      s7label:'Section 07',s7title:'Warm-Up Protocol: Protecting the Investment',
      s7a:'Warm-up sets are CNS preparation, not optional volume. The 3-phase protocol: <b>40–50% neuromuscular activation → 65–75% movement pattern encoding → 80–88% CNS priming.</b> When a muscle is already active from a prior exercise, warm-up sets are eliminated. Zero wasted sets. Every set earns its place.',
      s8label:'Section 08',s8title:'Why This Is Right for You',
      s8a:'At 32, 80 kg, Deadlift at 150 kg, OHP transitioning to barbell — you are an intermediate-advanced lifter with a high neuromuscular ceiling. You have articulated a clear goal set that few programs address simultaneously: <b>muscular, strong, and athletic.</b> This program does not compromise any of them.',
      s8b:'Every decision — exercise order, warm-up percentages, Hybrid day placement — was made with one question: <b>does this make you better?</b> If not, it was removed.',
      quote:'"No junk volume. No wasted sets. Every rep under maximum mechanical tension — that is the only principle that matters."',
      quoteSource:'The Method — M. Çağrı Ulu Training System · 2026',
      s9label:'Section 09',s9title:'Progressive Overload: The Only Law',
      s9a:'Hypertrophy has one non-negotiable law: <b>the muscle must be challenged beyond what it has previously encountered.</b> Progressive overload does not mean adding weight every session — it means systematically increasing demand over time. More reps at the same weight, better form under the same load, reduced rest with the same output — all are valid expressions of progression.',
      s9b:'This program uses a <b>double progression model</b> for compound movements: stay within the target rep range, add weight only when the upper boundary is hit with RIR 1–2. For isolation movements, the target is failure — progressive overload happens when a higher weight reaches failure in the same rep range.',
      s9c:'The deload every 6 weeks is not a break from progression. It is progression. Fatigue masks fitness — removing accumulated fatigue reveals the strength you actually built. The week after a deload is almost always a PR week.',
      s10label:'Section 10',s10title:'The Nervous System Comes First',
      s10a:'In the first 4–8 weeks of any new movement pattern — especially the transition from machine to free weight — <b>strength gains are primarily neural, not muscular.</b> The brain is learning motor patterns, recruiting motor units more efficiently, and synchronizing inter-muscular coordination. This is why experienced lifters look stronger than beginners at the same muscle size.',
      s10b:'During this phase, chasing weight is the wrong goal. The goal is encoding the movement. A technically perfect set at 70% builds more long-term capacity than a grinding, compromised set at 85%. <b>The nervous system is the foundation. The muscle is the structure built on top of it.</b>',
      s10c:'Neural adaptation timeline: 1–3 weeks for basic motor recruitment, 4–6 weeks for inter-muscular coordination, 8–12 weeks for full movement automaticity. After week 12, the weight can be pushed hard.',
      s11label:'Section 11',s11title:'Volume: How Much Is Enough',
      s11a:'Volume — sets × reps × load — is the primary driver of hypertrophy when intensity is held constant. Schoenfeld & Krieger (2017) demonstrated a clear <b>dose-response relationship</b>: more weekly sets produce more muscle growth, up to a ceiling. That ceiling varies by individual, muscle group, and recovery capacity.',
      s11b:'The scientific landmarks per muscle group per week: <b>Minimum Effective Volume (MEV): ~4–6 sets. Maximum Adaptive Volume (MAV): ~12–20 sets. Maximum Recoverable Volume (MRV): ~20–25+ sets.</b> Training above MRV produces fatigue faster than adaptation — it is the point of diminishing return.',
      s11c:'This program operates in the MAV zone for all major muscle groups, with compound movements contributing significant indirect volume. The 6-week mesocycle allows volume to accumulate toward MRV, after which the deload resets recovery capacity and the next block begins slightly above the previous MAV.',
      s12label:'Section 12',s12title:'Protein Synthesis: The Cellular Mechanism',
      s12a:'Every resistance training session triggers a cascade of molecular events. Mechanical loading activates the <b>mTORC1 signaling pathway</b> — the master regulator of muscle protein synthesis (MPS). mTORC1 activation leads to increased ribosomal activity, translating mRNA into new contractile proteins.',
      s12b:'MPS remains elevated for <b>24–48 hours post-training</b> before returning to baseline. This is the biological rationale for twice-weekly frequency: each training stimulus restarts the synthesis window before the previous one fully closes. Once-per-week training allows MPS to drop to baseline for 5+ days — a significant missed anabolic opportunity.',
      s12c:'Leucine is the primary amino acid trigger for mTORC1 activation. A threshold of approximately <b>2–3g leucine per meal</b> is required to maximally stimulate MPS — roughly equivalent to 30–40g of high-quality protein. This is why protein timing and per-meal protein targets matter alongside total daily intake.',
      s13label:'Section 13',s13title:'Mindset: The Discipline Architecture',
      s13a:'Motivation is unreliable. It peaks and crashes on a schedule no one controls. <b>Discipline is a system, not a feeling.</b> The athletes who build the best physiques over decades are not the ones who feel most motivated — they are the ones who have built the fewest decision points between waking up and training.',
      s13b:'Decision fatigue is real. Every choice depletes willpower. The solution is to reduce choices: same training time, same pre-workout routine, same session structure. When the brain knows exactly what comes next, resistance collapses. The program is not just a training tool — it is a decision removal system.',
      s13c:'On low-motivation days, the goal is not a great session. The goal is a session. Showing up at 70% for 5 years beats showing up at 100% for 6 months. <b>Consistency compounds. Intensity peaks and fades.</b>',
      s14label:'Section 14',s14title:'Sleep: The Anabolic Window You Are Missing',
      s14a:'No supplement, no training variable, no nutrition protocol produces as much anabolic effect as adequate sleep. During slow-wave sleep, <b>growth hormone secretion reaches its daily peak</b> — accounting for approximately 70–75% of total daily GH release. This is when muscle protein synthesis is highest and cortisol is lowest.',
      s14b:'Sleep deprivation (below 7 hours) elevates cortisol, suppresses testosterone, reduces insulin sensitivity, and impairs motor learning — the exact adaptation required during a machine-to-barbell transition. A single night of 5-hour sleep reduces anabolic hormone levels measurably the following day.',
      s14c:'At 6–7 hours of current sleep, there is meaningful performance left on the table. <b>Moving sleep from 6.5 to 7.5 hours is the highest-leverage intervention available</b> — more impactful than any supplement on the current stack, and completely free.',
      s15label:'Section 15',s15title:'The Long Game: What 12 Months Actually Builds',
      s15a:'The fitness industry sells 8-week transformations. Biology operates on a different timeline. <b>Intermediate-advanced lifters gain 1–2 kg of lean muscle per month under optimal conditions</b> — approximately 10–20 kg per year at the upper ceiling of natural development, declining as training age increases.',
      s15b:'At your level, the most accurate expectation is 8–12 kg of lean mass gain over 12 months with consistent training, adequate protein, and a controlled caloric environment. The strength targets in the Progress tab are calibrated to this reality — not to optimism, not to pessimism, but to the data.',
      s15c:'The compound effect of 12 consistent months is not linear — it is exponential at the end. The first 3 months build the neural foundation. Months 4–8 produce the visible physique changes. Months 9–12 are where the program reveals itself. <b>The athlete who reaches month 12 is a fundamentally different lifter than the one who started.</b>',

    tr:{
      tag:'Antrenman Felsefesi · M. Çağrı Ulu · 2026',
      heroTitle:'Hipertrofi için.<br>Güç için.<br>Atletizm için.',
      heroSub:'Bilimsel temelli bir Push/Pull/Hibrit sistemi — eş zamanlı hipertrofi, fonksiyonel güç ve atletik performans için tasarlandı. 80 kg, 32 yaş, orta-ileri seviye.',
      btnLang:'English',
      s1label:'Bölüm 01',s1title:'Bu Program Neden Var',
      s1a:'Çoğu program tek hedef için optimize edilir. Bu program aynı anda üç hedefi birden kovalamak için inşa edildi: <b>hipertrofi, fonksiyonel güç ve atletik performans.</b> Push/Pull/Push/Pull/Hibrit mimarisi klasik ödünleşimi çözer — güçlü, büyük ve atletik olmak arasında seçim yapmak zorunda değilsin.',
      s1b:'5 günlük program bilimsel altın standardı olan <b>haftada 2 frekansı</b> her kas grubu için yapısal olarak garanti eder. Push ve Pull günlerini dönüşümlü yerleştirerek compound performansı yüksek tutar, üstüne çoğu hipertrofi programının görmezden geldiği atletik bir gün ekler.',
      s2label:'Bölüm 02',s2title:'Frekansın Bilimi',
      s2a:'Schoenfeld ve ark. (2016): eşit hacimle, <b>haftada 2 frekans haftada 1 frekansa göre anlamlı olarak daha fazla hipertrofi sağlıyor.</b> Protein sentezi antrenman sonrası 24–48 saatte zirveye çıkıyor ve kısa süre içinde baseline\u2019a dönüyor. Haftada 1 antrenman devasa anabolik potansiyeli kullanılmadan bırakıyor.',
      s2b:'Bu program göğüs, deltoid, triceps, sırt, biceps ve ön kol için haftada 2 frekansı yapısal olarak garantiliyor. Tesadüf değil, mimari tercih.',
      s3label:'Bölüm 03',s3title:'Mekanik Gerilim: Temel Sürücü',
      s3a:'Hipertrofinin üç önerilen mekanizması arasında — mekanik gerilim, metabolik stres ve kas hasarı — <b>mekanik gerilim en güçlü sinyaldir.</b> Kasın tam hareket açıklığında, özellikle uzamış pozisyonda ağır bir yüke direnmesiyle üretilir.',
      s3b:'Her egzersiz seçimi bunu yansıtır. Ayakta curl yerine eğik bank curlü — uzamış pozisyon uyaranı üstündür. Standart sırt hareketi yerine göğüs destekli T-bar row — destek momentumu ortadan kaldırır. <b>Her tekrar, her seçim mekanik gerilimi maximize etmek için vardır.</b>',
      s4label:'Bölüm 04',s4title:'RIR: Yoğunluk Çerçevesi',
      s4a:'Kalan Tekrar Sayısı bu programın temel yoğunluk metriği. <b>Compound hareketler: RIR 1–2. İzolasyon hareketler: Failure (RIR 0).</b> Deadlift, Bench, OHP, Squat gibi ağır compound hareketler yüksek CNS maliyeti taşır. Failure\u2019a kadar gitmek kronik yorgunluk ve sakatlanma riskine yol açar. Düşük sistemik maliyetle izolasyonlar failure\u2019a götürülebilir ve götürülmeli.',
      s5label:'Bölüm 05',s5title:'Serbest Ağırlık: Atletik Zorunluluk',
      s5a:'Smith Machine\u2019den barbele geçiş estetik değil, fonksiyonel bir karardı. Behm & Anderson (2006): serbest ağırlık hareketler makineye kıyasla <b>%30–40 daha fazla stabilizatör kas aktivasyonu</b> sağlıyor. Rotator cuff, serratus anterior, erector spinae — bunlar aksesuar değil, uzun ömrün altyapısı.',
      s5b:'Bu program makineleri dogmatik olarak reddetmiyor. Pec Deck, Kablo Lateral Raise, Kablo Row kalıyor — çünkü izolasyon hareketlerde kablo direnç eğrisi gerçekten üstün. <b>Compound hareketler barbelde. İzolasyon hareketler kabloda.</b>',
      s6label:'Bölüm 06',s6title:'Hibrit Gün: Atletik Katman',
      s6a:'Cuma Hibrit seansı programın atletik güvenilirliğini kazandığı yer. Back Squat ve Front Squat toplam alt vücut gücünü geliştirir. Kürek ergometre en yüksek aerobik-yorgunluk oranını sunar. Toes-to-Bar core\u2019u en fonksiyonel haliyle çalıştırır. <b>Bu seans hipertrofiye taviz vermez. Onu genişletir.</b>',
      s7label:'Bölüm 07',s7title:'Isınma Protokolü: Yatırımı Korumak',
      s7a:'Isınma setleri isteğe bağlı hacim değil — CNS hazırlığı. 3 aşamalı protokol: <b>%40–50 nöromüsküler aktivasyon → %65–75 hareket paterni → %80–88 CNS hazırlığı.</b> Önceki hareketten kas aktifse ısınma setleri kaldırılır. Sıfır çöp set. Her set yerini hak eder.',
      s8label:'Bölüm 08',s8title:'Bu Program Sana Neden Uygun',
      s8a:'32 yaşında, 80 kg, 150 kg Deadlift, barbele geçiş sürecinde OHP — orta-ileri seviye, yüksek nöromüsküler tavan. Birçok programın aynı anda ele almadığı net bir hedef seti belirledin: <b>büyük, güçlü ve atletik olmak.</b> Bu program hiçbirinden taviz vermiyor.',
      s8b:'Her karar — egzersiz sıralaması, ısınma yüzdeleri, Hibrit günün yerleşimi — tek bir soruyla verildi: <b>bu seni daha iyi yapıyor mu?</b> Cevap açıkça evet değilse, çıkarıldı.',
      quote:'"Çöp hacim yok. Boşa giden set yok. Her tekrar maksimum mekanik gerilim altında — tek prensip budur."',
      quoteSource:'The Method — M. Çağrı Ulu Antrenman Sistemi · 2026',
      s9label:'Bölüm 09',s9title:'Progresif Aşırı Yük: Tek Yasa',
      s9a:'Hipertrofinin tek zorunlu yasası: <b>kas daha önce karşılaştığından daha büyük bir zorlukla yüzleşmek zorundadır.</b> Progresif aşırı yük her seansta kilo artırmak demek değildir — zaman içinde talebi sistematik olarak artırmak demektir. Aynı kiloda daha fazla tekrar, aynı yük altında daha iyi form, aynı çıktıyla daha kısa dinlenme — hepsi geçerli ilerleme biçimleridir.',
      s9b:'Bu program compound hareketler için <b>çift progresyon modeli</b> kullanır: hedef tekrar aralığında kal, üst sınıra RIR 1–2 ile ulaşıldığında kilo ekle. İzolasyon hareketlerde hedef failure\'dır — progresif aşırı yük, daha yüksek kilonun aynı tekrar aralığında failure\'a ulaşmasıyla gerçekleşir.',
      s9c:'6 haftada bir yapılan deload, ilerlemeden bir mola değildir. İlerlemenin kendisidir. Yorgunluk fitness\'ı maskeler — birikmiş yorgunluğu kaldırmak gerçekte inşa ettiğin gücü ortaya çıkarır. Deload sonrası haftası neredeyse her zaman PR haftasıdır.',
      s10label:'Bölüm 10',s10title:'Sinir Sistemi Önce Gelir',
      s10a:'Herhangi bir yeni hareket paterninin — özellikle makineden serbest ağırlığa geçişin — ilk 4–8 haftasında <b>güç kazanımları ağırlıklı olarak nöral kökenlidir, kas büyümesi değil.</b> Beyin motor paternleri öğreniyor, motor üniteleri daha verimli aktive ediyor ve kaslar arası koordinasyonu senkronize ediyor. Bu nedenle deneyimli sporcular aynı kas kütlesindeki başlangıç seviyesindekilere göre daha güçlü görünür.',
      s10b:'Bu fazda kilo kovalamak yanlış hedeftir. Hedef hareketi kodlamaktır. %70\'de teknik açıdan mükemmel bir set, %85\'te bozuk formlu bir setten uzun vadede daha fazla kapasite inşa eder. <b>Sinir sistemi temeldır. Kas onun üzerine inşa edilen yapıdır.</b>',
      s10c:'Nöral adaptasyon zaman çizelgesi: temel motor işe alım için 1–3 hafta, kaslar arası koordinasyon için 4–6 hafta, tam hareket otomatikliği için 8–12 hafta. 12. haftadan sonra ağırlık agresif şekilde artırılabilir.',
      s11label:'Bölüm 11',s11title:'Hacim: Ne Kadar Yeterlidir',
      s11a:'Hacim — set × tekrar × yük — yoğunluk sabit tutulduğunda hipertrofinin birincil sürücüsüdür. Schoenfeld & Krieger (2017) net bir <b>doz-yanıt ilişkisi</b> gösterdi: daha fazla haftalık set, belirli bir tavana kadar daha fazla kas büyümesi üretiyor. Bu tavan bireye, kas grubuna ve toparlanma kapasitesine göre değişir.',
      s11b:'Kas grubu başına haftalık bilimsel eşik değerleri: <b>Minimum Etkili Hacim (MEV): ~4–6 set. Maksimum Adaptif Hacim (MAV): ~12–20 set. Maksimum Toparlanabilir Hacim (MRV): ~20–25+ set.</b> MRV\'nin üzerinde antrenman yapmak adaptasyondan daha hızlı yorgunluk üretir — azalan verim noktasıdır.',
      s11b2:'Bu program tüm büyük kas grupları için MAV bölgesinde çalışır. 6 haftalık mesosikl hacmin MRV\'ye doğru birikmesine izin verir; ardından deload toparlanma kapasitesini sıfırlar ve bir sonraki blok önceki MAV\'ın biraz üzerinden başlar.',
      s12label:'Bölüm 12',s12title:'Protein Sentezi: Hücresel Mekanizma',
      s12a:'Her direnç antrenmanı seansı moleküler olaylar zincirini tetikler. Mekanik yükleme <b>mTORC1 sinyal yolağını</b> aktive eder — kas protein sentezinin (MPS) ana düzenleyicisi. mTORC1 aktivasyonu artan ribozomal aktiviteye yol açarak mRNA\'yı yeni kontraktil proteinlere dönüştürür.',
      s12b:'MPS antrenman sonrası <b>24–48 saat boyunca yüksek kalır</b>, ardından baseline\'a döner. Haftada 2 frekansın biyolojik gerekçesi budur: her antrenman uyaranı önceki sentez penceresi tamamen kapanmadan yeniden başlatır. Haftada 1 antrenman, MPS\'nin 5+ gün boyunca baseline\'da kalmasına izin verir — önemli bir kaçırılmış anabolik fırsat.',
      s12c:'Lösin, mTORC1 aktivasyonu için birincil amino asit tetikleyicisidir. MPS\'yi maksimum düzeyde uyarmak için öğün başına yaklaşık <b>2–3g lösin eşiği</b> gereklidir — yüksek kaliteli proteinin yaklaşık 30–40g\'ına eşdeğer. Bu nedenle protein zamanlaması ve öğün başına protein hedefleri, günlük toplam alımın yanında önem taşır.',
      s13label:'Bölüm 13',s13title:'Zihniyet: Disiplin Mimarisi',
      s13a:'Motivasyon güvenilmezdir. Kimsenin kontrol edemediği bir programda zirve yapar ve çöker. <b>Disiplin bir sistem, bir his değil.</b> On yıllar içinde en iyi fiziği inşa eden sporcular en çok motive olanlar değil — uyanmak ile antrenman yapmak arasındaki karar noktalarını en aza indirenlerdir.',
      s13b:'Karar yorgunluğu gerçektir. Her seçim irade gücünü tüketir. Çözüm seçimleri azaltmaktır: aynı antrenman saati, aynı antrenman öncesi rutin, aynı seans yapısı. Beyin sıradakinin ne olduğunu tam olarak bildiğinde direniş çöker. Program sadece bir antrenman aracı değil — bir karar kaldırma sistemidir.',
      s13c:'Düşük motivasyonlu günlerde hedef harika bir seans değildir. Hedef bir seansın olmasıdır. 5 yıl boyunca %70 ile gelmek, 6 ay %100 ile gelmekten daha değerlidir. <b>Tutarlılık bileşik büyür. Yoğunluk zirve yapar ve solar.</b>',
      s14label:'Bölüm 14',s14title:'Uyku: Kaçırdığın Anabolik Pencere',
      s14a:'Hiçbir supplement, hiçbir antrenman değişkeni, hiçbir beslenme protokolü yeterli uyku kadar anabolik etki üretmez. Derin uyku sırasında <b>büyüme hormonu salgısı günlük zirvesine ulaşır</b> — toplam günlük GH salınımının yaklaşık %70–75\'ini oluşturur. Kas protein sentezinin en yüksek, kortizolün en düşük olduğu an budur.',
      s14b:'Uyku yoksunluğu (7 saatin altı) kortizolü yükseltir, testosteronu baskılar, insülin duyarlılığını azaltır ve motor öğrenmeyi bozar — makineden barbele geçiş sırasında tam olarak ihtiyaç duyulan adaptasyon budur. 5 saatlik uykunun tek bir gecesi ertesi gün anabolik hormon seviyelerini ölçülebilir biçimde düşürür.',
      s14c:'Mevcut 6–7 saatlik uyku süresiyle masada anlamlı bir performans bırakılıyor. <b>Uykuyu 6,5\'tan 7,5 saate taşımak mevcut koşullar altındaki en yüksek kaldıraç müdahalesidir</b> — mevcut supplement yığınındaki herhangi bir üründen daha etkili ve tamamen ücretsiz.',
      s15label:'Bölüm 15',s15title:'Uzun Oyun: 12 Ay Gerçekte Ne İnşa Eder',
      s15a:'Fitness endüstrisi 8 haftalık dönüşümler satar. Biyoloji farklı bir zaman çizelgesinde çalışır. <b>Orta-ileri seviye sporcular optimal koşullarda aylık 1–2 kg yağsız kas kütlesi kazanır</b> — doğal gelişimin üst tavanında yılda yaklaşık 10–20 kg, antrenman yaşı arttıkça azalarak.',
      s15b:'Seviyende en doğru beklenti: tutarlı antrenman, yeterli protein ve kontrollü kalori ortamıyla 12 ay içinde 8–12 kg yağsız kütle kazanımı. İlerleme sekmesindeki güç hedefleri bu gerçekliğe kalibre edilmiştir — iyimserliğe değil, kötümserliğe değil, verilere.',
      s15c:'12 tutarlı ayın bileşik etkisi doğrusal değildir — sonunda üsteldir. İlk 3 ay nöral temeli inşa eder. 4–8. aylar görünür fizik değişikliklerini üretir. 9–12. aylar programın kendini ortaya koyduğu dönemdir. <b>12. aya ulaşan sporcu, başladığındakinden temelden farklı bir haltercidir.</b>',

    }
  };
  var t=T[lang];
  var isDark=!document.documentElement.getAttribute('data-theme');
  var lineC=isDark?'#fff':'#000';
  var gridC=isDark?'rgba(255,255,255,0.08)':'rgba(0,0,0,0.08)';
  var muteC=isDark?'rgba(255,255,255,0.35)':'rgba(0,0,0,0.35)';

  function svgBars(data,labels,maxVal){
    var W=300,H=80,barW=32,gap=8;
    var bars=data.map(function(v,i){
      var x=i*(barW+gap);
      var h=(v/maxVal)*H;
      var y=H-h;
      return '<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+h+'" fill="'+lineC+'"/>'
        +'<text x="'+(x+barW/2)+'" y="'+(y-4)+'" font-size="9" fill="'+lineC+'" text-anchor="middle" font-family="Inter Tight,sans-serif" font-weight="700">'+v+'</text>'
        +'<text x="'+(x+barW/2)+'" y="'+(H+12)+'" font-size="7" fill="'+muteC+'" text-anchor="middle" font-family="Inter Tight,sans-serif">'+labels[i]+'</text>';
    }).join('');
    return '<svg viewBox="0 0 '+(data.length*(barW+gap))+' '+(H+20)+'" style="width:100%;height:90px">'+bars+'</svg>';
  }

  function svgLine(data,labels){
    var W=320,H=80,PAD=8;
    var min=Math.min.apply(null,data)*0.95,max=Math.max.apply(null,data)*1.02;
    var pts=data.map(function(v,i){
      var x=PAD+(i/(data.length-1))*(W-PAD*2);
      var y=H-PAD-(v-min)/(max-min)*(H-PAD*2);
      return [x.toFixed(1),y.toFixed(1)];
    });
    var path='M'+pts.map(function(p){return p[0]+','+p[1];}).join('L');
    var dots=pts.map(function(p,i){
      return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.5" fill="'+lineC+'"/>'
        +(labels&&labels[i]?'<text x="'+p[0]+'" y="'+(parseFloat(p[1])-6)+'" font-size="7" fill="'+muteC+'" text-anchor="middle" font-family="Inter Tight,sans-serif">'+labels[i]+'</text>':'');
    }).join('');
    var gridLines=[0,0.5,1].map(function(t){
      var y=H-PAD-t*(H-PAD*2);
      var v=Math.round(min+t*(max-min));
      return '<line x1="'+PAD+'" x2="'+(W-PAD)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="'+gridC+'" stroke-width="1"/>'
        +'<text x="'+PAD+'" y="'+(y-3).toFixed(1)+'" font-size="7" fill="'+muteC+'" font-family="Inter Tight,sans-serif">'+v+'</text>';
    }).join('');

function togglePhilLang(){
  window._philLang=(window._philLang==='tr')?'en':'tr';
  renderPhilosophy();
  document.querySelector('.scroll').scrollTop=0;
}

function renderNav(){
  var tabs=DAYS.map(function(d,i){
    return '<div class="nav-tab'+(i===cur?' on':'')+'" onclick="setDay('+i+')">'+d.label+'</div>';
  }).join('');
  var prog='<div class="nav-tab'+(cur===-2?' on':'')+'" onclick="setDay(-2)">PROGRESS</div>';
  document.getElementById('nav').innerHTML=tabs+prog;
}


function renderDay(){
  const d=DAYS[cur];
  document.getElementById('hdr-title').textContent=d.title;
  document.getElementById('hdr-target').textContent=d.target;
  let html='';
  d.blocks.forEach((b,bi)=>{
    if(bi>0) html+='<div class="block-sep"></div>';
    html+='<div class="block"><div class="block-hdr"><div class="bh-title">'+b.name+'</div><div class="bh-col">SETS</div><div class="bh-col">REPS</div><div class="bh-col">NOTES</div></div>';
    b.exercises.forEach(ex=>{
      const pills=ex.warmup.length>0?'<div class="warmup-pills">'+ex.warmup.map(w=>'<div class="wp">'+w+'</div>').join('')+'</div>':'';
      html+='<div class="ex-row"><div><div class="ex-num">'+ex.num+'</div><div class="ex-name">'+ex.name+'</div>'+pills+'</div><div class="ex-val">'+ex.sets+'</div><div class="ex-val">'+ex.reps+'</div><div class="ex-val muted">'+ex.notes+'</div></div>';
    });
    html+='</div>';
  });
  document.getElementById('day-view').innerHTML=html;
  document.getElementById('day-view').style.display='block';
  document.querySelector('.scroll').scrollTop=0;
}

function setDay(i){
  cur=i;renderNav();
  document.getElementById('day-view').style.display=(i<0)?'none':'block';
  document.getElementById('prog-view').style.display=(i===-2)?'block':'none';
  document.getElementById('phil-view').style.display=(i===-3)?'block':'none';
  if(i===-2){renderProgress();document.getElementById('hdr-title').textContent='PROGRESS';document.getElementById('hdr-target').textContent='12-MONTH STRENGTH ROADMAP';}
  else if(i===-3){renderPhilosophy();document.getElementById('hdr-title').textContent='PHILOSOPHY';document.getElementById('hdr-target').textContent='THE METHOD BEHIND THE PROGRAM';}
  else{renderDay();}
}

function renderProgress(){
  const el=document.getElementById('prog-view');
  el.innerHTML=LIFT_DATA.map((l,li)=>{
    const fg=getComputedStyle(document.documentElement).getPropertyValue('--fg').trim()||'#fff';
    const muted=getComputedStyle(document.documentElement).getPropertyValue('--muted').trim()||'rgba(255,255,255,0.4)';
    const isDark=!document.documentElement.getAttribute('data-theme');
    const lineColor=isDark?'#ffffff':'#000000';
    const gridColor=isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.06)';
    const textColor=isDark?'rgba(255,255,255,0.35)':'rgba(0,0,0,0.35)';
    const dotColor=isDark?'#fff':'#000';
    // SVG line chart
    const vals=l.data;
    const min=Math.min(...vals)*0.95;
    const max=Math.max(...vals)*1.02;
    const W=340,H=90,PAD=4;
    const pts=vals.map((v,i)=>{
      const x=PAD+(i/(vals.length-1))*(W-PAD*2);
      const y=H-PAD-(v-min)/(max-min)*(H-PAD*2);
      return [x,y];
    });
    const path='M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L');
    // Grid lines
    const grids=[0,0.33,0.66,1].map(t=>{
      const y=H-PAD-(t)*(H-PAD*2);
      const val=Math.round((min+t*(max-min))/2.5)*2.5;
      return `<line x1="${PAD}" x2="${W-PAD}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${gridColor}" stroke-width="1"/>
              <text x="${PAD}" y="${(y-3).toFixed(1)}" font-size="8" fill="${textColor}" font-family="Inter Tight,sans-serif">${val}${l.bw?'':' kg'}</text>`;
    }).join('');
    // Month labels
    const mlabels=[0,4,8,12].map(i=>{
      if(i>=vals.length)return '';
      const x=PAD+(i/(vals.length-1))*(W-PAD*2);
      return `<text x="${x.toFixed(1)}" y="${H}" font-size="8" fill="${textColor}" font-family="Inter Tight,sans-serif" text-anchor="middle">${MONTHS[i/4]}</text>`;
    }).join('');
    // Key dots: m3 (wk6), m6 (wk12 after deload recovery ~wk14), m12 (wk24 after deload ~wk26)
    const keyPoints=[[6,l.m3],[14,l.m6],[24,l.m12]].map(([wi,val])=>{
      if(wi>=pts.length)return '';
      const [x,y]=pts[wi];
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${dotColor}"/>`;
    }).join('');
    const svg=`<svg viewBox="0 0 ${W} ${H+10}" xmlns="http://www.w3.org/2000/svg" class="chart-svg">
      ${grids}
      ${mlabels}
      <path d="${path}" fill="none" stroke="${lineColor}" stroke-width="1.5" stroke-linejoin="round"/>
      ${keyPoints}
    </svg>`;
    const unit=l.bw?(l.bwNote||'Added load'):'kg';
    return `<div class="lift-block">
      <div class="lift-name">${l.name}</div>
      <div class="lift-info">${l.info}</div>
      <div class="lift-targets">
        <div class="lt"><div class="lt-val">${l.bw?'+'+l.m3:l.m3} ${l.bw?'kg':'kg'}</div><div class="lt-lbl">3 Months</div></div>
        <div class="lt"><div class="lt-val">${l.bw?'+'+l.m6:l.m6} ${l.bw?'kg':'kg'}</div><div class="lt-lbl">6 Months</div></div>
        <div class="lt"><div class="lt-val">${l.bw?'+'+l.m12:l.m12} ${l.bw?'kg':'kg'}</div><div class="lt-lbl">12 Months</div></div>
      </div>
      <div class="chart-area">${svg}</div>
      <div class="milestone-row">
        <div class="ms">Now: ${l.start}${l.bw?' kg BW':' kg'}</div>
        <div class="ms key">+3M: ${l.bw?l.start+' + '+l.m3:l.m3} kg</div>
        <div class="ms key">+6M: ${l.bw?l.start+' + '+l.m6:l.m6} kg</div>
        <div class="ms key">+12M: ${l.bw?l.start+' + '+l.m12:l.m12} kg</div>
      </div>
    </div>`;
  }).join('');
}

renderNav();renderDay();
</script>
</body>
</html>
