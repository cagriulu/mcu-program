<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>MCU — Training Program</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#000;--fg:#fff;
  --rim:rgba(255,255,255,0.15);
  --rim2:rgba(255,255,255,0.07);
  --muted:rgba(255,255,255,0.4);
  --muted2:rgba(255,255,255,0.25);
  --safe-top:env(safe-area-inset-top,44px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html[data-theme="light"]{
  --bg:#fff;--fg:#000;
  --rim:rgba(0,0,0,0.15);
  --rim2:rgba(0,0,0,0.06);
  --muted:rgba(0,0,0,0.4);
  --muted2:rgba(0,0,0,0.2);
}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'Inter Tight',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");opacity:.05;pointer-events:none;z-index:9999;}
.app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto;}
.sb{height:var(--safe-top);flex-shrink:0;}

/* HEADER */
.header{flex-shrink:0;border-bottom:1px solid var(--rim);}

.header-identity{
  display:flex;align-items:stretch;justify-content:space-between;
  padding:0;border-bottom:1px solid var(--rim);
}
.header-logo{
  padding:14px 16px;
  display:flex;flex-direction:column;gap:3px;
}
.logo-name{
  font-size:20px;font-weight:800;letter-spacing:-.01em;
  text-transform:uppercase;line-height:1;color:var(--fg);
}
.logo-name span{font-weight:400;opacity:.45;}
.logo-sub{
  font-size:7px;font-weight:500;letter-spacing:.35em;
  text-transform:uppercase;color:var(--muted);
}
.header-controls{
  display:flex;align-items:center;gap:0;border-left:1px solid var(--rim);
}
.header-year{
  padding:0 14px;font-size:9px;font-weight:400;
  letter-spacing:.1em;color:var(--muted);border-right:1px solid var(--rim);
}
.theme-toggle{
  cursor:pointer;padding:0 14px;height:100%;
  display:flex;align-items:center;
  font-size:8px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
  border:none;background:none;font-family:'Inter Tight',sans-serif;
  transition:color .15s;
}
.theme-toggle:hover{color:var(--fg);}

.header-session{
  padding:20px 16px 0;
  display:flex;flex-direction:column;gap:0;
}
.session-label{
  font-size:7.5px;font-weight:500;letter-spacing:.35em;
  text-transform:uppercase;color:var(--muted);
  margin-bottom:6px;opacity:.5;
}
.session-title{
  font-size:58px;font-weight:800;letter-spacing:-.03em;
  line-height:.88;text-transform:uppercase;color:var(--fg);
  margin-bottom:14px;
}
.session-title em{
  font-style:normal;font-weight:400;
  letter-spacing:.0em;color:var(--fg);opacity:.35;
}
.session-target{
  display:flex;align-items:center;gap:8px;
  padding:8px 0;border-top:1px solid var(--rim);
}
.target-dot{
  width:3px;height:3px;border-radius:50%;
  background:var(--fg);opacity:.25;flex-shrink:0;
}
.target-text{
  font-size:8px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--fg);opacity:.45;
}

/* NAV */
.nav{
  flex-shrink:0;display:flex;overflow-x:auto;
  border-bottom:1px solid var(--rim);scrollbar-width:none;
  background:var(--bg);
}
.nav::-webkit-scrollbar{display:none;}
.nav-tab{
  flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 10px;gap:3px;
  cursor:pointer;position:relative;
  border-right:1px solid var(--rim);
  transition:background .12s;
}
.nav-tab:last-child{border-right:none;}
.nav-tab-num{
  font-size:7.5px;font-weight:400;
  letter-spacing:.08em;color:var(--muted);opacity:.35;
  line-height:1;font-family:'Inter Tight',sans-serif;
}
.nav-tab-lbl{
  font-size:9px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);
  line-height:1;white-space:nowrap;font-family:'Inter Tight',sans-serif;
}
.nav-tab.on{background:var(--fg);}
.nav-tab.on .nav-tab-num{color:var(--bg);opacity:.35;}
.nav-tab.on .nav-tab-lbl{color:var(--bg);}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.scroll::-webkit-scrollbar{display:none;}

/* DAY VIEW */
.day-view{padding:0 16px 100px;}

/* BLOCK */
.block{margin-top:20px;}
.block-hdr{display:grid;grid-template-columns:1fr auto auto auto;border-top:1px solid var(--rim);border-bottom:1px solid var(--rim);}
.bh-title{padding:7px 0;font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;}
.bh-col{padding:7px 0 7px 12px;font-size:8px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:right;min-width:42px;}

/* EX ROW */
.ex-row{display:grid;grid-template-columns:1fr auto auto auto;padding:10px 0;border-bottom:1px solid var(--rim2);align-items:start;}
.ex-row:last-child{border-bottom:none;}
.ex-num{font-size:8px;font-weight:400;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;opacity:.5;}
.ex-name{font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.2;}
.warmup-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.wp{font-size:7.5px;font-weight:500;letter-spacing:.08em;padding:2px 7px;border:1px solid var(--rim);color:var(--muted2);text-transform:uppercase;}
.ex-val{font-size:12px;font-weight:700;text-align:right;padding-left:12px;min-width:42px;padding-top:14px;}
.ex-val.muted{color:var(--muted);font-weight:400;}
.block-sep{height:1px;background:var(--rim2);margin:24px 0 0;}

/* MCU LOGO */
.mcu-logo{
  position:fixed;
  bottom:calc(var(--safe-bot) + 16px);
  left:50%;
  transform:translateX(-50%);
  text-align:center;
  pointer-events:none;
  z-index:100;
}
.mcu-main{font-size:20px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--fg);line-height:1;opacity:.12;}
.mcu-year{font-size:8px;font-weight:400;letter-spacing:.28em;text-transform:uppercase;color:var(--fg);opacity:.08;margin-top:2px;}


.lift-block{margin-top:24px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.08);}
[data-theme="light"] .lift-block{border-color:rgba(0,0,0,0.08);}
.lift-name{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px;}
.lift-info{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:12px;font-weight:400;}
.lift-targets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;}
.lt{padding:8px;border:1px solid var(--rim);text-align:center;}
.lt-val{font-size:14px;font-weight:800;line-height:1;}
.lt-lbl{font-size:7.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-top:3px;}
.chart-area{width:100%;height:110px;position:relative;overflow:hidden;}
.chart-svg{width:100%;height:100%;}
.milestone-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.ms{font-size:7.5px;font-weight:700;letter-spacing:.1em;padding:2px 7px;border:1px solid var(--rim);color:var(--muted);text-transform:uppercase;}
.ms.key{border-color:var(--fg);color:var(--fg);}

/* PHILOSOPHY */
.phil-hero{padding:28px 16px 24px;border-bottom:1px solid var(--rim);}
.phil-hero-tag{font-family:'Inter Tight',sans-serif;font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.phil-hero-title{font-size:38px;font-weight:900;letter-spacing:-.02em;line-height:1.05;text-transform:uppercase;margin-bottom:8px;}
.phil-hero-sub{font-size:12px;color:var(--muted);line-height:1.7;font-weight:400;max-width:340px;}
.phil-section{padding:24px 16px 0;}
.phil-sec-label{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.phil-sec-title{font-size:19px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--rim);}
.phil-body{font-size:12px;color:var(--muted);line-height:1.8;font-weight:400;margin-bottom:16px;}
.phil-body b{color:var(--fg);font-weight:700;}

/* INFOGRAPHIC BLOCKS */
.infog{margin:16px 0;background:var(--fg);color:var(--bg);padding:16px;position:relative;overflow:hidden;}
.infog-title{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px;opacity:.5;}
.infog-grid{display:grid;gap:1px;background:rgba(128,128,128,0.2);}
.infog-cell{background:var(--fg);padding:12px;display:flex;flex-direction:column;gap:4px;}
.infog-val{font-size:24px;font-weight:900;letter-spacing:-.02em;line-height:1;}
.infog-lbl{font-size:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.5;}

/* COMPARISON TABLE */
.cmp-table{border:1px solid var(--rim);margin:16px 0;}
.cmp-row{display:grid;border-bottom:1px solid var(--rim);}
.cmp-row:last-child{border-bottom:none;}
.cmp-row.hdr{background:var(--fg);color:var(--bg);}
.cmp-cell{padding:8px 10px;font-size:10px;font-weight:500;letter-spacing:.04em;}
.cmp-row.hdr .cmp-cell{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
.cmp-cell.win{font-weight:700;color:var(--fg);}
.cmp-cell.muted{color:var(--muted);}

/* PYRAMID */
.pyramid{margin:16px 0;display:flex;flex-direction:column;gap:2px;}
.pyr-row{display:flex;align-items:center;gap:10px;}
.pyr-bar{height:36px;background:var(--fg);display:flex;align-items:center;padding:0 12px;flex-shrink:0;}
.pyr-bar-label{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--bg);}
.pyr-text{font-size:10px;color:var(--muted);line-height:1.4;}

/* TIMELINE */
.timeline{margin:16px 0;display:flex;flex-direction:column;gap:0;}
.tl-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--rim);}
.tl-row:last-child{border-bottom:none;}
.tl-num{font-size:28px;font-weight:900;letter-spacing:-.02em;color:var(--muted);opacity:.3;width:36px;flex-shrink:0;line-height:1;}
.tl-content{}
.tl-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
.tl-text{font-size:11px;color:var(--muted);line-height:1.6;}

/* FREQUENCY VIZ */
.freq-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0;}
.freq-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--rim);}
.freq-cell.on{background:var(--fg);color:var(--bg);border-color:var(--fg);}
.freq-cell.rest{color:var(--muted);}

/* QUOTE */
.phil-quote{margin:24px 0;padding:20px 16px;border-left:2px solid var(--fg);background:var(--fg);color:var(--bg);}
.pq-text{font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.4;text-transform:uppercase;margin-bottom:6px;}
.pq-source{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;opacity:.5;}

/* DIVIDER */
.phil-divider{height:1px;background:var(--rim);margin:24px 16px 0;}

/* PHILOSOPHY BAR */
.phil-bar{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;
  border-bottom:1px solid var(--rim);
  cursor:pointer;
  background:var(--fg);
  color:var(--bg);
  transition:opacity .15s;
}
.phil-bar:active{opacity:.8;}
.pb-left{display:flex;align-items:center;gap:12px;}
.pb-tag{font-size:8px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.45;border-right:1px solid rgba(128,128,128,0.3);padding-right:12px;}
.pb-title{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.pb-right{font-size:14px;font-weight:300;opacity:.5;}
</style>
</head>
<body>
<div class="app" id="app">
<div class="sb"></div>

<div class="header">
  <div class="header-identity">
    <div class="header-logo">
      <div class="logo-name">M. Çağrı <span>Ulu</span></div>
      <div class="logo-sub">5 · Day · Training · 2026</div>
    </div>
    <div class="header-controls">
      <div class="header-year">MMXXVI</div>
      <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">LIGHT</button>
    </div>
  </div>
  <div class="header-session">
    <div class="session-label">Active Session</div>
    <div class="session-title" id="hdr-title">PUSH <em>A</em></div>
    <div class="session-target">
      <div class="target-dot"></div>
      <div class="target-text" id="hdr-target">CHEST · SHOULDER · TRICEPS</div>
    </div>
  </div>
</div>


<div class="nav" id="nav"></div>

<div class="scroll">
  <div class="day-view" id="day-view"></div>
  </div>

</div>

<div class="mcu-logo">
  <div class="mcu-main">MCU</div>
  <div class="mcu-year">2026</div>
</div>

<script>
const DAYS=[
  {key:'push-a',label:'PUSH A',title:'PUSH A',target:'CHEST · SHOULDER · TRICEPS',
   blocks:[
    {name:'BLOCK #1 — COMPOUND',exercises:[
      {num:'I.',name:'Barbell Bench Press',sets:'2',reps:'4–6',notes:'RIR 1',warmup:['40% × 12','60% × 6','80% × 3']},
      {num:'II.',name:'Barbell Incline Bench Press',sets:'2',reps:'4–6',notes:'RIR 1',warmup:['50% × 8','70% × 4','85% × 2']},
      {num:'III.',name:'Barbell OHP (Standing)',sets:'2',reps:'6–8',notes:'RIR 1',warmup:['40% × 10','60% × 5','80% × 3']},
    ]},
    {name:'BLOCK #2 — ISOLATION',exercises:[
      {num:'I.',name:'Pec Deck',sets:'2',reps:'6–8',notes:'Failure',warmup:[]},
      {num:'II.',name:'Cable Lateral Raise',sets:'3',reps:'8–10',notes:'Failure',warmup:[]},
      {num:'III.',name:'Overhead Cable Triceps Extension',sets:'2',reps:'8–10',notes:'Failure',warmup:[]},
      {num:'IV.',name:'Triceps Pushdown',sets:'2',reps:'6–8',notes:'Failure',warmup:[]},
      {num:'V.',name:'Dips',sets:'3',reps:'Max',notes:'Failure',warmup:[]},
    ]},
  ]},
  {key:'pull-a',label:'PULL A',title:'PULL A',target:'BACK · BICEPS · FOREARMS',
   blocks:[
    {name:'BLOCK #1 — COMPOUND',exercises:[
      {num:'I.',name:'Deadlift',sets:'2',reps:'4–5',notes:'RIR 1',warmup:['40% × 8','65% × 4','85% × 2']},
      {num:'II.',name:'Lat Pulldown',sets:'2',reps:'6–8',notes:'RIR 1 / Failure',warmup:['55% × 8']},
      {num:'III.',name:'Pull-up',sets:'1',reps:'6–8',notes:'BW',warmup:[]},
      {num:'IV.',name:'Chest Supported T-Bar Row',sets:'3',reps:'6–8',notes:'RIR 1 / Failure',warmup:['50% × 8','75% × 4','88% × 2']},
    ]},
    {name:'BLOCK #2 — ISOLATION',exercises:[
      {num:'I.',name:'Cable Row',sets:'1',reps:'8–10',notes:'Failure',warmup:[]},
      {num:'II.',name:'Incline Dumbbell Curl',sets:'2',reps:'6–8',notes:'Failure',warmup:['50% × 8']},
      {num:'III.',name:'Cable Curl',sets:'2',reps:'6–8',notes:'Failure',warmup:[]},
      {num:'IV.',name:'Hammer Curl',sets:'2',reps:'8–10',notes:'Failure',warmup:[]},
      {num:'V.',name:'Reverse Barbell Curl',sets:'2',reps:'8–10',notes:'Failure',warmup:[]},
    ]},
  ]},
  {key:'legs',label:'LEGS',title:'LEGS',target:'QUAD · HAMSTRING · GLUTES · CORE',
   blocks:[
    {name:'BLOCK #1 — STRENGTH',exercises:[
      {num:'I.',name:'Back Squat',sets:'3',reps:'4–5',notes:'RIR 1–2',warmup:['40% × 10','60% × 5','80% × 3']},
    ]},
    {name:'BLOCK #2 — COMPOUND',exercises:[
      {num:'I.',name:'Leg Press',sets:'2',reps:'6–8',notes:'RIR 1–2',warmup:[]},
    ]},
    {name:'BLOCK #3 — ISOLATION',exercises:[
      {num:'I.',name:'Seated Leg Extension',sets:'3',reps:'6–8',notes:'Failure',warmup:[]},
      {num:'II.',name:'Lying Leg Curl',sets:'3',reps:'8–10',notes:'Failure',warmup:[]},
    ]},
    {name:'BLOCK #4 — CORE & CALVES',exercises:[
      {num:'I.',name:'Toes-to-Bar',sets:'3',reps:'8–10',notes:'Failure',warmup:[]},
      {num:'II.',name:'Hanging Leg Raises',sets:'3',reps:'10–12',notes:'Failure',warmup:[]},
      {num:'III.',name:'Standing Calf Raise',sets:'3',reps:'12–15',notes:'Failure',warmup:[]},
    ]},
  ]},
  {key:'push-b',label:'PUSH B',title:'PUSH B',target:'SHOULDER · CHEST · TRICEPS',
   blocks:[
    {name:'BLOCK #1 — COMPOUND',exercises:[
      {num:'I.',name:'Barbell OHP (Standing)',sets:'2',reps:'6–8',notes:'RIR 1',warmup:['40% × 10','60% × 5','82% × 3']},
      {num:'II.',name:'Barbell Incline Bench Press',sets:'2',reps:'5–6',notes:'RIR 1',warmup:['50% × 6']},
    ]},
    {name:'BLOCK #2 — ISOLATION',exercises:[
      {num:'I.',name:'Cable Lateral Raise',sets:'3',reps:'8–10',notes:'Failure',warmup:[]},
      {num:'II.',name:'Pec Deck',sets:'2',reps:'6–8',notes:'Failure',warmup:[]},
      {num:'III.',name:'Cable Rear Delt Fly',sets:'2',reps:'8–10',notes:'Failure',warmup:[]},
      {num:'IV.',name:'Overhead Rope Extension',sets:'2',reps:'8–10',notes:'Failure',warmup:[]},
      {num:'V.',name:'Triceps Pushdown',sets:'2',reps:'6–8',notes:'Failure',warmup:[]},
      {num:'VI.',name:'Dips',sets:'3',reps:'Max',notes:'Failure',warmup:[]},
    ]},
  ]},
  {key:'pull-b',label:'PULL B+LEGS',title:'PULL B+LEGS',target:'BACK · BICEPS · FOREARMS · LEGS',
   blocks:[
    {name:'BLOCK #1 — COMPOUND',exercises:[
      {num:'I.',name:'Chest Supported T-Bar Row',sets:'3',reps:'6–8',notes:'RIR 1 / Failure',warmup:['45% × 10','65% × 5','82% × 3']},
      {num:'II.',name:'Lat Pulldown V-bar',sets:'3',reps:'6–8',notes:'RIR 1 / Failure',warmup:['55% × 8']},
      {num:'III.',name:'Pull-up',sets:'1',reps:'6–8',notes:'BW',warmup:[]},
    ]},
    {name:'BLOCK #2 — ISOLATION',exercises:[
      {num:'I.',name:'Cable Curl',sets:'2',reps:'6–8',notes:'Failure',warmup:[]},
      {num:'II.',name:'Hammer Curl',sets:'2',reps:'8–10',notes:'Failure',warmup:[]},
      {num:'III.',name:'Reverse Barbell Curl',sets:'2',reps:'8–10',notes:'Failure',warmup:[]},
      {num:'IV.',name:'Leg Extension',sets:'2',reps:'6–8',notes:'Failure',warmup:[]},
      {num:'V.',name:'Lying Leg Curl',sets:'1',reps:'8–10',notes:'Failure',warmup:[]},
    ]},
  ]},
];


let cur=0,light=false;

function toggleTheme(){
  light=!light;
  document.documentElement.setAttribute('data-theme',light?'light':'');
  document.getElementById('theme-btn').textContent=light?'DARK':'LIGHT';
}










function renderNav(){
  var tabs=DAYS.map(function(d,i){
    return '<div class="nav-tab'+(i===cur?' on':'')+'" onclick="setDay('+i+')">'+
      '<div class="nav-tab-num">0'+(i+1)+'</div>'+
      '<div class="nav-tab-lbl">'+d.label+'</div>'+
    '</div>';
  }).join('');
  document.getElementById('nav').innerHTML=tabs;
}


function renderDay(){
  const d=DAYS[cur];
  document.getElementById('hdr-title').textContent=d.title;
  document.getElementById('hdr-target').textContent=d.target;
  let html='';
  d.blocks.forEach((b,bi)=>{
    if(bi>0) html+='<div class="block-sep"></div>';
    html+='<div class="block"><div class="block-hdr"><div class="bh-title">'+b.name+'</div><div class="bh-col">SETS</div><div class="bh-col">REPS</div><div class="bh-col">NOTES</div></div>';
    b.exercises.forEach(ex=>{
      const pills=ex.warmup.length>0?'<div class="warmup-pills">'+ex.warmup.map(w=>'<div class="wp">'+w+'</div>').join('')+'</div>':'';
      html+='<div class="ex-row"><div><div class="ex-num">'+ex.num+'</div><div class="ex-name">'+ex.name+'</div>'+pills+'</div><div class="ex-val">'+ex.sets+'</div><div class="ex-val">'+ex.reps+'</div><div class="ex-val muted">'+ex.notes+'</div></div>';
    });
    html+='</div>';
  });
  document.getElementById('day-view').innerHTML=html;
  document.getElementById('day-view').style.display='block';
  document.querySelector('.scroll').scrollTop=0;
}

function setDay(i){
  cur=i;renderNav();
  document.getElementById('day-view').style.display='block';
  renderDay();
}

renderNav();renderDay();
</script>
</body>
</html>
