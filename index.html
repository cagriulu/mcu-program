<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>MCU — Antrenman Programı</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#000;--fg:#fff;
  --rim:rgba(255,255,255,0.15);
  --rim2:rgba(255,255,255,0.07);
  --muted:rgba(255,255,255,0.4);
  --muted2:rgba(255,255,255,0.25);
  --safe-top:env(safe-area-inset-top,44px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html[data-theme="light"]{
  --bg:#fff;--fg:#000;
  --rim:rgba(0,0,0,0.15);
  --rim2:rgba(0,0,0,0.06);
  --muted:rgba(0,0,0,0.4);
  --muted2:rgba(0,0,0,0.2);
}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'Inter Tight',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");opacity:.05;pointer-events:none;z-index:9999;}
.app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto;}
.sb{height:var(--safe-top);flex-shrink:0;}
.header{flex-shrink:0;border-bottom:1px solid var(--rim);}
.header-identity{display:flex;align-items:stretch;justify-content:space-between;padding:0;border-bottom:1px solid var(--rim);}
.header-logo{padding:14px 16px;display:flex;flex-direction:column;gap:3px;}
.logo-name{font-size:20px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;line-height:1;color:var(--fg);}
.logo-name span{font-weight:400;opacity:.45;}
.logo-sub{font-size:7px;font-weight:500;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);}
.header-controls{display:flex;align-items:center;gap:0;border-left:1px solid var(--rim);}
.header-year{padding:0 14px;font-size:9px;font-weight:400;letter-spacing:.1em;color:var(--muted);border-right:1px solid var(--rim);}
.theme-toggle{cursor:pointer;padding:0 14px;height:100%;display:flex;align-items:center;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:none;background:none;font-family:'Inter Tight',sans-serif;transition:color .15s;}
.theme-toggle:hover{color:var(--fg);}
.header-session{padding:20px 16px 0;display:flex;flex-direction:column;gap:0;}
.session-label{font-size:7.5px;font-weight:500;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;opacity:.5;}
.session-title{font-size:58px;font-weight:800;letter-spacing:-.03em;line-height:.88;text-transform:uppercase;color:var(--fg);margin-bottom:14px;}
.session-title em{font-style:normal;font-weight:400;letter-spacing:.0em;color:var(--fg);opacity:.35;}
.session-target{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--rim);}
.target-dot{width:3px;height:3px;border-radius:50%;background:var(--fg);opacity:.25;flex-shrink:0;}
.target-text{font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--fg);opacity:.45;}
.nav{flex-shrink:0;display:flex;overflow-x:auto;border-bottom:1px solid var(--rim);scrollbar-width:none;background:var(--bg);}
.nav::-webkit-scrollbar{display:none;}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 6px;gap:3px;cursor:pointer;position:relative;border-right:1px solid var(--rim);transition:background .12s;}
.nav-tab:last-child{border-right:none;}
.nav-tab-num{font-size:7px;font-weight:400;letter-spacing:.06em;color:var(--muted);opacity:.35;line-height:1;font-family:'Inter Tight',sans-serif;}
.nav-tab-lbl{font-size:7.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1;white-space:nowrap;font-family:'Inter Tight',sans-serif;}
.nav-tab.on{background:var(--fg);}
.nav-tab.on .nav-tab-num{color:var(--bg);opacity:.35;}
.nav-tab.on .nav-tab-lbl{color:var(--bg);}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.scroll::-webkit-scrollbar{display:none;}
.day-view{padding:0 16px 100px;}
.block{margin-top:20px;}
.block-hdr{display:grid;grid-template-columns:1fr auto auto auto;background:var(--fg);padding:0 8px;}
.bh-title{padding:7px 0;font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--bg);}
.bh-col{padding:7px 0 7px 12px;font-size:8px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--bg);opacity:.5;text-align:right;min-width:42px;}
.ex-row{display:grid;grid-template-columns:1fr auto auto auto;padding:10px 0;border-bottom:1px solid var(--rim2);align-items:start;}
.ex-row:last-child{border-bottom:none;}
.ex-num{font-size:8px;font-weight:400;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;opacity:.5;}
.ex-name{font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.2;}
.warmup-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.wp{font-size:7.5px;font-weight:500;letter-spacing:.08em;padding:2px 7px;border:1px solid var(--rim);color:var(--muted2);text-transform:uppercase;}
.ex-val{font-size:12px;font-weight:700;text-align:right;padding-left:12px;min-width:42px;padding-top:14px;}
.ex-val.muted{color:var(--muted);font-weight:400;}
.block-sep{display:none;}
.mcu-logo{position:fixed;bottom:calc(var(--safe-bot) + 16px);left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:100;}
.mcu-main{font-size:20px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--fg);line-height:1;opacity:.12;}
.mcu-year{font-size:8px;font-weight:400;letter-spacing:.28em;text-transform:uppercase;color:var(--fg);opacity:.08;margin-top:2px;}

/* TARİF BARI */
.recipe-bar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--rim);cursor:pointer;transition:background .12s;}
.recipe-bar:hover{background:var(--rim2);}
.recipe-bar.on{background:var(--fg);}
.recipe-bar.on .rb-label{color:var(--bg);}
.recipe-bar.on .rb-count{color:var(--bg);opacity:.45;}
.rb-label{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
.rb-count{font-size:8px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.5;}

/* TARİFLER */
.recipe-view{padding:0 16px 100px;}
.recipe-filter-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:16px 0 12px;}
.recipe-filter-row::-webkit-scrollbar{display:none;}
.rf-btn{flex-shrink:0;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border:1px solid var(--rim);background:transparent;color:var(--muted);font-family:'Inter Tight',sans-serif;cursor:pointer;transition:all .12s;}
.rf-btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg);}
.recipe-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.r-card{background:var(--bg);border:1px solid var(--rim);padding:12px;cursor:pointer;transition:border-color .12s;}
.r-card:hover{border-color:var(--muted);}
.r-card-emoji{font-size:20px;margin-bottom:8px;}
.r-card-name{font-size:12px;font-weight:700;letter-spacing:-.01em;line-height:1.2;margin-bottom:8px;color:var(--fg);}
.r-card-pills{display:flex;flex-wrap:wrap;gap:4px;}
.r-pill{font-size:7px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--rim);color:var(--muted);}
.r-pill.protein{border-color:var(--fg);color:var(--fg);}
.recipe-detail{padding:0 16px 100px;}
.rd-back{display:flex;align-items:center;gap:8px;padding:16px 0 20px;cursor:pointer;border-bottom:1px solid var(--rim);margin-bottom:20px;}
.rd-back-arrow{font-size:14px;font-weight:300;color:var(--muted);}
.rd-back-lbl{font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
.rd-emoji{font-size:40px;margin-bottom:12px;}
.rd-name{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1;margin-bottom:12px;color:var(--fg);}
.rd-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--rim);}
.rd-pill{font-size:7.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--rim);color:var(--muted);}
.rd-pill.protein{border-color:var(--fg);color:var(--fg);}
.rd-section{font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;background:var(--fg);color:var(--bg);padding:5px 8px;margin-bottom:12px;}
.rd-ing-list{list-style:none;padding:0;margin:0 0 20px;}
.rd-ing-list li{font-size:13px;font-weight:400;color:var(--muted);padding:8px 0;border-bottom:1px solid var(--rim2);display:flex;align-items:center;gap:8px;}
.rd-ing-list li::before{content:'';width:3px;height:3px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.rd-steps-list{list-style:none;padding:0;margin:0 0 20px;}
.rd-step{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--rim2);}
.rd-step:last-child{border-bottom:none;}
.rd-step-num{font-size:9px;font-weight:800;color:var(--bg);background:var(--fg);width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.rd-step-text{font-size:13px;font-weight:400;color:var(--muted);line-height:1.6;}

/* TAKVİM */
.takvim-view{padding:0 16px 100px;}
.tk-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;margin-bottom:4px;}
.tk-sum-card{background:var(--rim2);padding:.6rem .5rem;text-align:center;}
.tk-sum-val{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--fg);line-height:1;}
.tk-sum-lbl{font-size:7px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px;line-height:1.3;}
.tk-row{border-top:1px solid var(--rim);padding:16px 0;display:grid;grid-template-columns:72px 1fr;gap:0;}
.tk-rest{opacity:.45;}
.tk-left{padding-right:12px;border-right:1px solid var(--rim2);}
.tk-gun{font-size:7px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.tk-num{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--fg);opacity:.15;line-height:1;}
.tk-right{padding-left:14px;}
.tk-session-hdr{margin-bottom:10px;}
.tk-session-name{font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--fg);margin-bottom:6px;}
.tk-badges{display:flex;gap:5px;flex-wrap:wrap;}
.tk-badge{font-size:7px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--rim);color:var(--muted);}
.tk-badge-yuk{border-color:var(--fg);color:var(--fg);}
.tk-bars{margin-bottom:12px;}
.tk-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.tk-bar-kas{font-size:10px;color:var(--muted);min-width:70px;}
.tk-bar-track{flex:1;height:5px;background:var(--rim2);overflow:hidden;}
.tk-bar-fill{height:100%;background:var(--fg);opacity:.7;}
.tk-bar-val{font-size:10px;font-weight:500;color:var(--fg);min-width:16px;text-align:right;}
.tk-section-lbl{font-size:7px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--bg);background:var(--fg);display:inline-block;padding:2px 6px;margin-bottom:6px;opacity:.7;}
.tk-pills{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;}
.tk-pill{font-size:9px;color:var(--muted);border:1px solid var(--rim2);padding:2px 7px;}
.tk-pill-c{border-color:var(--rim);color:var(--fg);font-weight:500;}
.tk-note{font-size:10px;color:var(--muted);line-height:1.6;padding-top:8px;border-top:1px solid var(--rim2);opacity:.7;}
.tk-rest-lbl{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.tk-rest-note{font-size:10px;color:var(--muted);line-height:1.6;opacity:.7;}

/* BOKS */
.boks-view{padding:0 16px 100px;}
.boks-ay-tabs{display:flex;gap:0;margin-top:16px;margin-bottom:14px;border:1px solid var(--rim);}
.boks-ay-tab{flex:1;padding:8px 4px;font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center;cursor:pointer;background:transparent;border:none;border-right:1px solid var(--rim);color:var(--muted);font-family:'Inter Tight',sans-serif;line-height:1.4;transition:all .12s;}
.boks-ay-tab:last-child{border-right:none;}
.boks-ay-tab.on{background:var(--fg);color:var(--bg);}
.boks-ay-meta{background:var(--rim2);padding:.8rem 1rem;margin-bottom:12px;}
.boks-ay-baslik{font-size:13px;font-weight:700;color:var(--fg);margin-bottom:4px;}
.boks-ay-desc{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:8px;}
.boks-ay-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.boks-stat{background:var(--bg);padding:.5rem .7rem;border:1px solid var(--rim);}
.boks-stat-val{font-size:16px;font-weight:800;color:var(--fg);}
.boks-stat-lbl{font-size:8px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.boks-hafta{border:1px solid var(--rim);margin-bottom:8px;}
.boks-hafta-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;}
.boks-hafta-sol{display:flex;align-items:center;gap:10px;}
.boks-hafta-num{font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:52px;}
.boks-hafta-baslik{font-size:13px;font-weight:700;color:var(--fg);}
.boks-hafta-arrow{font-size:14px;color:var(--muted);transition:transform .2s;}
.boks-hafta-arrow.open{transform:rotate(180deg);}
.boks-ilerleme{padding:0 12px 8px;}
.boks-il-lbl{font-size:8px;font-weight:500;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:3px;}
.boks-il-track{height:3px;background:var(--rim);overflow:hidden;}
.boks-il-fill{height:100%;background:var(--fg);}
.boks-hafta-body{display:none;border-top:1px solid var(--rim);}
.boks-hafta-body.open{display:block;}
.boks-yeni-teknikler{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;border-bottom:1px solid var(--rim2);}
.boks-yt-pill{font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;background:var(--fg);color:var(--bg);}
.boks-seans{padding:10px 12px;}
.boks-seans-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.boks-seans-lbl{font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.boks-seans-sure{font-size:8px;color:var(--muted);border:1px solid var(--rim);padding:2px 6px;}
.boks-bolum{margin-bottom:10px;}
.boks-bolum-ad{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--fg);color:var(--bg);display:inline-block;padding:2px 7px;margin-bottom:6px;}
.boks-adim{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--rim2);}
.boks-adim:last-child{border-bottom:none;}
.boks-adim-num{font-size:9px;font-weight:700;color:var(--muted);min-width:16px;padding-top:1px;}
.boks-adim-ad{font-size:12px;font-weight:700;color:var(--fg);margin-bottom:2px;}
.boks-adim-det{font-size:11px;color:var(--muted);line-height:1.5;}

/* WOD */
.wod-bar{border-top:2px solid var(--fg) !important;}
.wod-view{padding:0 16px 100px;}
.wod-tabs{display:flex;gap:0;margin-top:16px;margin-bottom:12px;border:1px solid var(--rim);}
.wod-tab{flex:1;padding:7px 4px;font-size:7.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center;cursor:pointer;background:transparent;border:none;border-right:1px solid var(--rim);color:var(--muted);font-family:'Inter Tight',sans-serif;transition:all .12s;}
.wod-tab:last-child{border-right:none;}
.wod-tab.on{background:var(--fg);color:var(--bg);}
.wod-random-btn{width:100%;padding:14px;background:var(--fg);color:var(--bg);border:none;font-family:'Inter Tight',sans-serif;font-size:11px;font-weight:900;letter-spacing:.25em;text-transform:uppercase;cursor:pointer;margin-bottom:14px;transition:opacity .12s;}
.wod-random-btn:active{opacity:.7;}
.wod-ai-btn{width:100%;padding:12px;background:transparent;color:var(--fg);border:1px solid var(--rim);font-family:'Inter Tight',sans-serif;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;margin-bottom:14px;transition:all .12s;}
.wod-ai-btn:active{opacity:.7;}
.wod-card{border:1px solid var(--rim);margin-bottom:12px;}
.wod-card-hdr{padding:14px 14px 10px;}
.wod-card-type{font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;background:var(--fg);color:var(--bg);display:inline-block;padding:2px 8px;margin-bottom:8px;}
.wod-card-type.ai-badge{background:var(--muted);color:var(--bg);}
.wod-card-name{font-size:22px;font-weight:900;letter-spacing:-.02em;color:var(--fg);line-height:1;margin-bottom:6px;}
.wod-card-kategori{font-size:8px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);}
.wod-card-body{border-top:1px solid var(--rim);padding:14px;}
.wod-card-format{font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--bg);background:var(--muted);display:inline-block;padding:2px 8px;margin-bottom:10px;}
.wod-card-content{font-size:13px;font-weight:500;color:var(--fg);line-height:1.8;margin-bottom:12px;white-space:pre-line;}
.wod-card-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.wod-meta-item{background:var(--rim2);padding:.5rem .7rem;}
.wod-meta-lbl{font-size:7px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.wod-meta-val{font-size:12px;font-weight:700;color:var(--fg);}
.wod-card-hikaye{font-size:11px;color:var(--muted);line-height:1.7;border-top:1px solid var(--rim2);padding-top:10px;}
.wod-loading{padding:40px 0;text-align:center;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
.wod-liste{display:flex;flex-direction:column;gap:6px;}
.wod-liste-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--rim);cursor:pointer;transition:background .1s;}
.wod-liste-item:active{background:var(--rim2);}
.wod-liste-sol{display:flex;align-items:center;gap:10px;}
.wod-liste-num{font-size:8px;font-weight:400;color:var(--muted);min-width:24px;}
.wod-liste-ad{font-size:13px;font-weight:700;color:var(--fg);}
.wod-liste-tur{font-size:8px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.wod-liste-ok{font-size:12px;color:var(--muted);}
.wod-back{display:flex;align-items:center;gap:8px;padding:14px 0;cursor:pointer;border-bottom:1px solid var(--rim);margin-bottom:14px;}
.wod-back-arrow{font-size:14px;font-weight:300;color:var(--muted);}
.wod-back-lbl{font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
</style>
</head>
<body>
<div class="app" id="app">
<div class="sb"></div>

<div class="header">
  <div class="header-identity">
    <div class="header-logo">
      <div class="logo-name">M. Çağrı <span>Ulu</span></div>
      <div class="logo-sub">5 · Gün · Antrenman · 2026</div>

function renderDay(){
  const d=DAYS[cur];
  document.getElementById('hdr-title').innerHTML=d.title;
  document.getElementById('hdr-target').textContent=d.target;
  hideAll();
  document.getElementById('day-view').style.display='block';
  let html='';
  d.blocks.forEach((b,bi)=>{
    if(bi>0) html+='<div class="block-sep"></div>';
    html+='<div class="block"><div class="block-hdr"><div class="bh-title">'+b.name+'</div><div class="bh-col">SET</div><div class="bh-col">REP</div><div class="bh-col">NOT</div></div>';
    b.exercises.forEach(ex=>{
      const pills=ex.warmup.length>0?'<div class="warmup-pills">'+ex.warmup.map(w=>'<div class="wp">'+w+'</div>').join('')+'</div>':'';
      html+='<div class="ex-row"><div><div class="ex-num">'+ex.num+'</div><div class="ex-name">'+ex.name+'</div>'+pills+'</div><div class="ex-val">'+ex.sets+'</div><div class="ex-val">'+ex.reps+'</div><div class="ex-val muted">'+ex.notes+'</div></div>';
    });
    html+='</div>';
  });
  document.getElementById('day-view').innerHTML=html;
  document.getElementById('main-scroll').scrollTop=0;
}

function setDay(i){
  cur=i;mode='program';
  renderNav();renderDay();
}

function setRecipes(){
  mode='recipes';activeRecipe=null;

  document.getElementById('hdr-target').textContent='YÜKSEK PROTEİNLİ · '+RECIPES.length+' TARİF';
  hideAll();
  document.getElementById('recipe-view').style.display='block';
  renderRecipeGrid();
  renderNav();
  document.getElementById('main-scroll').scrollTop=0;
}

function renderRecipeGrid(){
  const filtered=recipeCat==='Tümü'?RECIPES:RECIPES.filter(r=>r.cat===recipeCat);
  let html='<div class="recipe-filter-row">';
  CATS.forEach(c=>{
    html+='<button class="rf-btn'+(recipeCat===c?' on':'')+'" onclick="setRecipeCat(\''+c+'\')">'+c+'</button>';
  });
  html+='</div>';
  html+='<div class="recipe-grid">';
  filtered.forEach((r,i)=>{
    const idx=RECIPES.indexOf(r);
    html+='<div class="r-card" onclick="showRecipe('+idx+')">'+
      '<div class="r-card-name">'+r.name+'</div>'+
      '<div class="r-card-pills">'+
        '<span class="r-pill protein">'+r.protein+'g</span>'+
        '<span class="r-pill">'+r.time+'</span>'+
        '<span class="r-pill">'+r.tool+'</span>'+
      '</div>'+
    '</div>';
  });
  html+='</div>';
  document.getElementById('recipe-view').innerHTML=html;
}

function setRecipeCat(cat){
  recipeCat=cat;
  renderRecipeGrid();
}

function showRecipe(idx){
  activeRecipe=idx;
  const r=RECIPES[idx];
  document.getElementById('recipe-view').style.display='none';
  const det=document.getElementById('recipe-detail');
  det.style.display='block';
  let html='<div class="rd-back" onclick="backToRecipes()">'+
    '<span class="rd-back-arrow">←</span>'+
    '<span class="rd-back-lbl">Tariflere Dön</span>'+
  '</div>';
  html+='<div class="rd-name">'+r.name+'</div>';
  html+='<div class="rd-meta">'+
    '<span class="rd-pill protein">'+r.protein+'g protein</span>'+
    '<span class="rd-pill">'+r.time+'</span>'+
    '<span class="rd-pill">'+r.tool+'</span>'+
    '<span class="rd-pill">'+r.cat+'</span>'+
  '</div>';
  html+='<div class="rd-section">Malzemeler</div>';
  html+='<ul class="rd-ing-list">'+r.ing.map(i=>'<li>'+i+'</li>').join('')+'</ul>';
  html+='<div class="rd-section">Yapılış</div>';
  html+='<ol class="rd-steps-list">'+r.steps.map((s,i)=>
    '<li class="rd-step"><span class="rd-step-num">'+(i+1)+'</span><span class="rd-step-text">'+s+'</span></li>'
  ).join('')+'</ol>';
  det.innerHTML=html;
  document.getElementById('main-scroll').scrollTop=0;
}

function backToRecipes(){
  document.getElementById('recipe-detail').style.display='none';
  document.getElementById('recipe-view').style.display='block';
  renderRecipeGrid();
  document.getElementById('main-scroll').scrollTop=0;
}

let boksAktifAy=0;
let boksAcikHaftalar={};

function setBoks(){
  mode='boks';
  document.getElementById('hdr-title').textContent='BOKS';
  document.getElementById('hdr-target').textContent='3 AY · 12 HAFTA · TEMEL TEKNİK';
  hideAll();
  document.getElementById('boks-view').style.display='block';
  renderBoks();
  renderNav();
  document.getElementById('main-scroll').scrollTop=0;
}

function renderBoks(){
  const ay=BOKS_PLAN[boksAktifAy];
  let html='<div class="boks-ay-tabs">';
  BOKS_PLAN.forEach((a,i)=>{
    html+=`<button class="boks-ay-tab${i===boksAktifAy?' on':''}" onclick="setBoksAy(${i})">${a.ay}<br><span style="font-size:7px;opacity:.7">${a.subtitle}</span></button>`;
  });
  html+='</div>';
  html+=`<div class="boks-ay-meta"><div class="boks-ay-baslik">${ay.ay} — ${ay.subtitle}</div><div class="boks-ay-desc">${ay.desc}</div><div class="boks-ay-stats"><div class="boks-stat"><div class="boks-stat-val">${ay.seansSayisi}</div><div class="boks-stat-lbl">Planlanan seans</div></div><div class="boks-stat"><div class="boks-stat-val">${ay.teknikSayisi}</div><div class="boks-stat-lbl">Yeni teknik</div></div></div></div>`;
  ay.haftalar.forEach((h,hi)=>{
    const key=boksAktifAy+'_'+hi;
    const acik=boksAcikHaftalar[key];
    const pillsHtml=h.yeniTeknikler.map(t=>`<span class="boks-yt-pill">${t}</span>`).join('');
    let bodyHtml='<div class="boks-yeni-teknikler">'+pillsHtml+'</div>';
    h.seanslar.forEach(s=>{
      bodyHtml+=`<div class="boks-seans"><div class="boks-seans-hdr"><span class="boks-seans-lbl">${s.baslik}</span><span class="boks-seans-sure">${s.sure}</span></div>`;
      s.bolumler.forEach(b=>{
        bodyHtml+=`<div class="boks-bolum"><div class="boks-bolum-ad">${b.ad}</div>`;
        b.adimlar.forEach((a,ai)=>{
          bodyHtml+=`<div class="boks-adim"><span class="boks-adim-num">${ai+1}.</span><div><div class="boks-adim-ad">${a.ad}</div><div class="boks-adim-det">${a.det}</div></div></div>`;
        });
        bodyHtml+=`</div>`;
      });
      bodyHtml+=`</div>`;
    });
    html+=`<div class="boks-hafta"><div class="boks-hafta-hdr" onclick="toggleBoksHafta('${key}')"><div class="boks-hafta-sol"><span class="boks-hafta-num">${h.num}</span><span class="boks-hafta-baslik">${h.baslik}</span></div><span class="boks-hafta-arrow${acik?' open':''}">↓</span></div><div class="boks-ilerleme"><div class="boks-il-lbl"><span>3 aylık ilerleme</span><span>${h.ilerleme}%</span></div><div class="boks-il-track"><div class="boks-il-fill" style="width:${h.ilerleme}%"></div></div></div><div class="boks-hafta-body${acik?' open':''}">${bodyHtml}</div></div>`;
  });
  document.getElementById('boks-view').innerHTML=html;
}

function setBoksAy(i){boksAktifAy=i;renderBoks();}
function toggleBoksHafta(key){boksAcikHaftalar[key]=!boksAcikHaftalar[key];renderBoks();}

   hikaye:'10 hareket × 21 tekrar. CrossFit\'in tüm enerji sistemlerini bir WOD\'da test eder.'},
];

let wodMode='ana',wodAktif=null;

function setWod(){
  mode='wod';
  document.getElementById('hdr-title').textContent='CROSSFIT WOD';
  document.getElementById('hdr-target').textContent='200+ İKONİK WOD · YAPAY ZEKA ÜRETİMİ';
  hideAll();
  document.getElementById('wod-view').style.display='block';
  wodMode='ana';wodAktif=null;
  renderWodAna();
  renderNav();
  document.getElementById('main-scroll').scrollTop=0;
}

function renderWodAna(){
  const kategoriler=['Tümü','Benchmark Girl','Hero WOD','Classic','CrossFit Open','CrossFit Games','Conditioning','Skill WOD','Functional','Strength','Gymnastics'];
  let html='<div class="wod-tabs" id="wod-kat-tabs">';
  kategoriler.forEach((k,i)=>{
    html+=`<button class="wod-tab${i===0?' on':''}" onclick="filterWod('${k}',this)">${k==='Tümü'?'TÜMÜ':k.toUpperCase()}</button>`;
  });
  html+='</div>';
  html+=`<button class="wod-random-btn" onclick="randomWod()">⚡ RANDOM WOD</button>`;
  html+=`<button class="wod-ai-btn" onclick="aiWod()">✦ YAPAY ZEKA WOD ÜRET</button>`;
  html+='<div class="wod-liste" id="wod-liste">';
  WODS.forEach(w=>{
    html+=`<div class="wod-liste-item" onclick="showWod(${w.id})"><div class="wod-liste-sol"><span class="wod-liste-num">#${String(w.id).padStart(3,'0')}</span><div><div class="wod-liste-ad">${w.isim}</div><div class="wod-liste-tur">${w.tur} · ${w.format} · ${w.zorluk}</div></div></div><span class="wod-liste-ok">→</span></div>`;
  });
  html+='</div>';
  document.getElementById('wod-view').innerHTML=html;
}

function filterWod(kat,btn){
  document.querySelectorAll('.wod-tab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  const filtered=kat==='Tümü'?WODS:WODS.filter(w=>w.tur===kat);
  const liste=document.getElementById('wod-liste');
  liste.innerHTML=filtered.map(w=>
    `<div class="wod-liste-item" onclick="showWod(${w.id})"><div class="wod-liste-sol"><span class="wod-liste-num">#${String(w.id).padStart(3,'0')}</span><div><div class="wod-liste-ad">${w.isim}</div><div class="wod-liste-tur">${w.tur} · ${w.format} · ${w.zorluk}</div></div></div><span class="wod-liste-ok">→</span></div>`
  ).join('');
}

function randomWod(){
  const w=WODS[Math.floor(Math.random()*WODS.length)];
  showWod(w.id);
}

function showWod(id){
  wodAktif=id;
  const w=WODS.find(x=>x.id===id);
  document.getElementById('wod-view').innerHTML=
    `<div class="wod-back" onclick="setWod()"><span class="wod-back-arrow">←</span><span class="wod-back-lbl">WOD Listesine Dön</span></div>`+
    `<div class="wod-card">`+
    `<div class="wod-card-hdr"><div class="wod-card-type">${w.tur}</div><div class="wod-card-name">${w.isim}</div><div class="wod-card-kategori">#${String(w.id).padStart(3,'0')} · ${w.zorluk}</div></div>`+
    `<div class="wod-card-body">`+
    `<div class="wod-card-format">${w.format}</div>`+
    `<div class="wod-card-content">${w.icerik}</div>`+
    `<div class="wod-card-meta"><div class="wod-meta-item"><div class="wod-meta-lbl">Tahmini Süre</div><div class="wod-meta-val">${w.sure}</div></div><div class="wod-meta-item"><div class="wod-meta-lbl">Zorluk</div><div class="wod-meta-val">${w.zorluk}</div></div></div>`+
    `<div class="wod-card-hikaye">${w.hikaye}</div>`+
    `</div></div>`+
    `<button class="wod-random-btn" style="margin-top:14px;" onclick="randomWod()">⚡ BAŞKA RANDOM WOD</button>`+
    `<button class="wod-ai-btn" onclick="aiWod()">✦ YAPAY ZEKA WOD ÜRET</button>`;
  document.getElementById('main-scroll').scrollTop=0;
}

async function aiWod(){
  document.getElementById('wod-view').innerHTML=
    `<div class="wod-back" onclick="setWod()"><span class="wod-back-arrow">←</span><span class="wod-back-lbl">WOD Listesine Dön</span></div>`+
    `<div class="wod-loading">⚡ WOD üretiliyor...</div>`;
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        messages:[{role:'user',content:`Sen deneyimli bir CrossFit programcısısın. M. Çağrı Ulu için kişiselleştirilmiş bir CrossFit WOD üret.

Profil: 28-35 yaş erkek, ~75kg, 1-2 yıl kuvvet antrenmanı deneyimi, Deadlift ~135kg, Squat ~110kg, Bench ~90kg. Ekipman: barbell, kum torbası (torba odası), pull-up bar, dips bar. Süre: 30-45 dk.

KURALLAR:
- Gerçek CrossFit metodolojisi: AMRAP, EMOM, For Time, Chipper, Rounds formatlarından biri
- Fizyolojik olarak mantıklı iş/dinlenme oranları
- Jumping jack, machine, rope, kürek, bisiklet gibi ekipman yok
- Aynı hareketi iki kez koyma
- Ağırlıklar profiline uygun
- Kum torbası hareketleri ekleyebilirsin

SADECE JSON döndür, başka hiçbir şey yazma:
{
  "isim": "WOD ismi",
  "format": "AMRAP 20 dk",
  "icerik": "Hareketler ve tekrarlar (\\n ile ayır)",
  "sure": "Tahmini süre",
  "zorluk": "Orta/Ağır/Çok Ağır",
  "hikaye": "Bu WOD hakkında 1-2 cümle açıklama"
}`}]
      })
    });
    const data=await resp.json();
    const text=data.content[0].text.replace(/```json|```/g,'').trim();
    const w=JSON.parse(text);
    document.getElementById('wod-view').innerHTML=
      `<div class="wod-back" onclick="setWod()"><span class="wod-back-arrow">←</span><span class="wod-back-lbl">WOD Listesine Dön</span></div>`+
      `<div class="wod-card">`+
      `<div class="wod-card-hdr"><div class="wod-card-type ai-badge">✦ YAPAY ZEKA WOD</div><div class="wod-card-name">${w.isim}</div><div class="wod-card-kategori">Kişiselleştirilmiş · ${w.zorluk}</div></div>`+
      `<div class="wod-card-body">`+
      `<div class="wod-card-format">${w.format}</div>`+
      `<div class="wod-card-content">${w.icerik}</div>`+
      `<div class="wod-card-meta"><div class="wod-meta-item"><div class="wod-meta-lbl">Tahmini Süre</div><div class="wod-meta-val">${w.sure}</div></div><div class="wod-meta-item"><div class="wod-meta-lbl">Zorluk</div><div class="wod-meta-val">${w.zorluk}</div></div></div>`+
      `<div class="wod-card-hikaye">${w.hikaye}</div>`+
      `</div></div>`+
      `<button class="wod-random-btn" style="margin-top:14px;" onclick="randomWod()">⚡ RANDOM WOD</button>`+
      `<button class="wod-ai-btn" onclick="aiWod()">✦ YENİ WOD ÜRET</button>`;
  }catch(e){
    document.getElementById('wod-view').innerHTML+=`<div style="padding:16px;font-size:12px;color:var(--muted);">WOD üretilemedi. Tekrar dene.</div>`+
      `<button class="wod-ai-btn" onclick="aiWod()">↺ Tekrar Dene</button>`;
  }
  document.getElementById('main-scroll').scrollTop=0;
}

renderNav();renderDay();
</script>
</body>
</html>
