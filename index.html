<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>MCU — Antrenman Programı</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#000;--fg:#fff;
  --rim:rgba(255,255,255,0.18);
  --rim2:rgba(255,255,255,0.08);
  --muted:rgba(255,255,255,0.42);
  --muted2:rgba(255,255,255,0.26);
  --safe-top:env(safe-area-inset-top,44px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  /* Spacing sistemi — 4px bazlı */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;
  /* Tipografi */
  --text-xs:7.5px;--text-sm:10px;--text-md:13px;--text-lg:15px;--text-xl:22px;--text-2xl:28px;--text-hero:58px;
  /* Geçiş */
  --ease:.15s cubic-bezier(.4,0,.2,1);
}
html[data-theme="light"]{
  --bg:#fafafa;--fg:#0a0a0a;
  --rim:rgba(0,0,0,0.14);
  --rim2:rgba(0,0,0,0.06);
  --muted:rgba(0,0,0,0.42);
  --muted2:rgba(0,0,0,0.22);
}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'Inter Tight',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .2s,color .2s;}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");opacity:.04;pointer-events:none;z-index:9999;}

/* ODAK HALKASI — accessibility */
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;}
button:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:2px;}

/* AKTİF DURUM — fiziksel geri bildirim */
button:active,
.nav-tab:active,
.r-card:active,
.emom-item:active,
.wod100-item:active,
.rakip-wod-item:active,
.gen-opt:active,
.murph-day:active{
  transform:scale(0.98);
  transition:transform .08s cubic-bezier(.4,0,.2,1);
}

.app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto;}
.sb{height:var(--safe-top);flex-shrink:0;}
.header{flex-shrink:0;border-bottom:1px solid var(--rim);}
.header-identity{display:flex;align-items:stretch;justify-content:space-between;padding:0;border-bottom:1px solid var(--rim);}
.header-logo{padding:var(--sp-3) var(--sp-4);display:flex;flex-direction:column;gap:4px;}
.logo-name{font-size:20px;font-weight:800;letter-spacing:-.01em;text-transform:uppercase;line-height:1;color:var(--fg);}
.logo-name span{font-weight:400;opacity:.45;}
.logo-sub{font-size:var(--text-xs);font-weight:500;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);}
.header-controls{display:flex;align-items:center;gap:0;border-left:1px solid var(--rim);}
.header-year{padding:0 var(--sp-4);font-size:9px;font-weight:400;letter-spacing:.1em;color:var(--muted);border-right:1px solid var(--rim);}
/* Dokunma hedefi: minimum 44px */
.theme-toggle{cursor:pointer;padding:0 var(--sp-4);height:44px;min-width:44px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:none;background:none;font-family:'Inter Tight',sans-serif;transition:color var(--ease);}
.theme-toggle:hover{color:var(--fg);}
.header-session{padding:var(--sp-5) var(--sp-4) 0;display:flex;flex-direction:column;gap:0;transition:padding .25s ease,opacity .25s ease;}
.session-label{font-size:var(--text-xs);font-weight:500;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);margin-bottom:var(--sp-2);opacity:.5;transition:all .25s ease;}
.session-title{font-size:var(--text-hero);font-weight:800;letter-spacing:-.03em;line-height:.88;text-transform:uppercase;color:var(--fg);margin-bottom:var(--sp-4);transition:font-size .25s ease,margin .25s ease,line-height .25s ease;white-space:nowrap;}
.session-title.long{font-size:32px;letter-spacing:-.02em;}
.session-title em{font-style:normal;font-weight:400;letter-spacing:.0em;color:var(--fg);opacity:.35;}
.session-target{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) 0;border-top:1px solid var(--rim);transition:all .25s ease;overflow:hidden;}
.target-dot{width:3px;height:3px;border-radius:50%;background:var(--fg);opacity:.25;flex-shrink:0;}
.target-text{font-size:var(--text-xs);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--fg);opacity:.45;}

/* COLLAPSED HEADER STATE */
.header.collapsed .header-session{padding:6px var(--sp-4) 0;}
.header.collapsed .session-label{display:none;}
.header.collapsed .session-title{font-size:18px;margin-bottom:4px;line-height:1;}
.header.collapsed .session-target{padding:4px 0;max-height:20px;}
.header.collapsed .target-text{font-size:7px;}

/* NAV SEKMELER — min 44px dokunma hedefi */
.nav{flex-shrink:0;display:flex;overflow-x:auto;border-bottom:1px solid var(--rim);scrollbar-width:none;background:var(--bg);position:relative;height:48px;}
.nav::-webkit-scrollbar{display:none;}
.nav::after{content:'';position:absolute;right:0;top:0;bottom:0;width:24px;background:linear-gradient(to right,transparent,var(--bg));pointer-events:none;}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--sp-2) var(--sp-2);height:48px;gap:2px;cursor:pointer;position:relative;border-right:1px solid var(--rim);transition:background var(--ease);}
.nav-tab:last-child{border-right:none;}
.nav-tab-num{font-size:7px;font-weight:400;letter-spacing:.06em;color:var(--muted);opacity:.35;line-height:1;font-family:'Inter Tight',sans-serif;}
.nav-tab-lbl{font-size:var(--text-xs);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);line-height:1;white-space:nowrap;font-family:'Inter Tight',sans-serif;}
.nav-tab.on{background:var(--fg);}
.nav-tab.on .nav-tab-num{color:var(--bg);opacity:.35;}
.nav-tab.on .nav-tab-lbl{color:var(--bg);}

/* ANA NAV — ikon + etiket, sabit 8 buton */
.main-nav{flex-shrink:0;display:flex;border-bottom:1px solid var(--rim);background:var(--bg);}
.main-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 2px;min-height:52px;font-size:6px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:none;border-right:1px solid var(--rim);color:var(--muted);font-family:'Inter Tight',sans-serif;cursor:pointer;transition:all var(--ease);}
.main-nav-btn:last-child{border-right:none;}
.main-nav-btn.on{background:var(--fg);color:var(--bg);}
.main-nav-btn svg{opacity:.45;transition:opacity var(--ease);flex-shrink:0;}
.main-nav-btn.on svg{opacity:1;}
.main-nav-btn:not(.on):hover svg{opacity:.7;}

/* WORKOUT OLUŞTUR — özel şerit */
.wo-strip{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:#1c1c1c;border-bottom:1px solid var(--rim);cursor:pointer;transition:opacity var(--ease);}
.wo-strip:active{opacity:.7;}
.wo-strip-left{display:flex;align-items:center;gap:10px;}
.wo-strip-icon{width:28px;height:28px;border:1.5px solid #555;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;}
.wo-strip-icon svg{opacity:1;}
.wo-strip-text{display:flex;flex-direction:column;gap:2px;}
.wo-strip-title{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#fff;}
.wo-strip-sub{font-size:8px;color:#999;letter-spacing:.04em;}
.wo-strip-arrow{font-size:14px;color:#999;}
.wo-strip.on{background:#1c1c1c;}
.wo-strip-divider{height:8px;background:var(--rim2);border-bottom:1px solid var(--rim);flex-shrink:0;}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.scroll::-webkit-scrollbar{display:none;}

/* PR ŞERİDİ */



/* PR BÖLÜMÜ — gün sonu */
.pr-section{margin-top:24px;margin-bottom:0;}
.pr-section-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--rim);border-bottom:1px solid var(--rim);margin-bottom:0;}
.pr-section-title{font-size:8px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
.pr-row-list{display:flex;flex-direction:column;}
.pr-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--rim2);}
.pr-row:last-child{border-bottom:none;}
.pr-row-name{font-size:13px;font-weight:600;color:var(--fg);}
.pr-row-right{display:flex;align-items:baseline;gap:6px;}
.pr-row-val{font-size:20px;font-weight:900;letter-spacing:-.02em;color:var(--fg);}
.pr-row-unit{font-size:9px;font-weight:500;color:var(--muted);letter-spacing:.06em;}


.day-view{padding:0 var(--sp-4) 100px;}
.block{margin-top:var(--sp-5);}
.block-hdr{display:grid;grid-template-columns:1fr auto auto auto;background:var(--fg);padding:0 var(--sp-2);}
.bh-title{padding:var(--sp-2) 0;font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--bg);}
.bh-col{padding:var(--sp-2) 0 var(--sp-2) var(--sp-3);font-size:8px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--bg);opacity:.5;text-align:right;min-width:42px;}
.ex-row{display:grid;grid-template-columns:1fr auto auto auto;padding:var(--sp-3) 0;border-bottom:1px solid var(--rim2);align-items:start;}
.ex-row:last-child{border-bottom:none;}
.ex-num{font-size:8px;font-weight:400;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px;opacity:.5;}
.ex-name{font-size:var(--text-lg);font-weight:700;letter-spacing:-.01em;line-height:1.2;}
.warmup-pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;}
.wp{font-size:var(--text-xs);font-weight:500;letter-spacing:.08em;padding:3px 8px;border:1px solid var(--rim);color:var(--muted2);text-transform:uppercase;}
.ex-val{font-size:var(--text-md);font-weight:700;text-align:right;padding-left:var(--sp-3);min-width:42px;padding-top:14px;}
.ex-val.muted{color:var(--muted);font-weight:400;}
.block-sep{display:none;}

.mcu-logo{position:fixed;bottom:calc(var(--safe-bot) + 16px);left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:100;}
.mcu-main{font-size:20px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--fg);line-height:1;opacity:.12;}
.mcu-year{font-size:8px;font-weight:400;letter-spacing:.28em;text-transform:uppercase;color:var(--fg);opacity:.08;margin-top:2px;}
.arsiv-btn{display:block;margin-top:6px;font-size:8px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--fg);opacity:.25;background:transparent;border:1px solid var(--rim);cursor:pointer;font-family:'Inter Tight',sans-serif;pointer-events:all;transition:opacity var(--ease);padding:4px var(--sp-3);}
.arsiv-btn:active{opacity:.7;}

/* TARİF BARI */
.recipe-bar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:var(--sp-3) var(--sp-4);min-height:44px;border-bottom:1px solid var(--rim);cursor:pointer;transition:background var(--ease);}
.recipe-bar:hover{background:var(--rim2);}
.recipe-bar.on{background:var(--fg);}
.recipe-bar.on .rb-label{color:var(--bg);}
.recipe-bar.on .rb-count{color:var(--bg);opacity:.45;}
.rb-label{font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
.rb-count{font-size:8px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.5;}

/* TARİFLER */
.recipe-view{padding:0 var(--sp-4) 100px;}
.recipe-filter-row{display:flex;gap:var(--sp-2);overflow-x:auto;scrollbar-width:none;padding:var(--sp-4) 0 var(--sp-3);position:relative;}
.recipe-filter-row::-webkit-scrollbar{display:none;}
.recipe-filter-row::after{content:'';position:absolute;right:0;top:0;bottom:0;width:20px;background:linear-gradient(to right,transparent,var(--bg));pointer-events:none;}
.rf-btn{flex-shrink:0;font-size:8px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:var(--sp-2) var(--sp-3);min-height:32px;border:1px solid var(--rim);background:transparent;color:var(--muted);font-family:'Inter Tight',sans-serif;cursor:pointer;transition:all var(--ease);}
.rf-btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg);}
.recipe-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);}
.r-card{background:var(--bg);border:1px solid var(--rim);padding:var(--sp-3);cursor:pointer;transition:border-color var(--ease),transform var(--ease);}
.r-card:hover{border-color:var(--muted);}
.r-card-emoji{font-size:20px;margin-bottom:var(--sp-2);}
.r-card-name{font-size:var(--text-md);font-weight:700;letter-spacing:-.01em;line-height:1.3;margin-bottom:var(--sp-2);color:var(--fg);}
.r-card-pills{display:flex;flex-wrap:wrap;gap:4px;}
.r-pill{font-size:7px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;border:1px solid var(--rim);color:var(--muted);}
.r-pill.protein{border-color:var(--fg);color:var(--fg);}
.recipe-detail{padding:0 var(--sp-4) 100px;}
.rd-back{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-4) 0 var(--sp-5);min-height:44px;cursor:pointer;border-bottom:1px solid var(--rim);margin-bottom:var(--sp-5);}
.rd-back-arrow{font-size:14px;font-weight:300;color:var(--muted);}
.rd-back-lbl{font-size:var(--text-xs);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
.rd-emoji{font-size:40px;margin-bottom:var(--sp-3);}
.rd-name{font-size:var(--text-2xl);font-weight:800;letter-spacing:-.02em;line-height:1;margin-bottom:var(--sp-3);color:var(--fg);}
.rd-meta{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-5);padding-bottom:var(--sp-5);border-bottom:1px solid var(--rim);}
.rd-pill{font-size:var(--text-xs);font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:4px var(--sp-3);border:1px solid var(--rim);color:var(--muted);}
.rd-pill.protein{border-color:var(--fg);color:var(--fg);}
.rd-section{font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;background:var(--fg);color:var(--bg);padding:5px var(--sp-2);margin-bottom:var(--sp-3);}
.rd-ing-list{list-style:none;padding:0;margin:0 0 var(--sp-5);}
.rd-ing-list li{font-size:var(--text-md);font-weight:400;color:var(--muted);padding:var(--sp-2) 0;border-bottom:1px solid var(--rim2);display:flex;align-items:center;gap:var(--sp-2);}
.rd-ing-list li::before{content:'';width:3px;height:3px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.rd-steps-list{list-style:none;padding:0;margin:0 0 var(--sp-5);}
.rd-step{display:flex;gap:var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid var(--rim2);}
.rd-step:last-child{border-bottom:none;}
.rd-step-num{font-size:9px;font-weight:800;color:var(--bg);background:var(--fg);width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.rd-step-text{font-size:var(--text-md);font-weight:400;color:var(--muted);line-height:1.65;}

/* TAKVİM */
.takvim-view{padding:0 16px 100px;}
.tk-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px;margin-bottom:4px;}
.tk-sum-card{background:var(--rim2);padding:.6rem .5rem;text-align:center;}
.tk-sum-val{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--fg);line-height:1;}
.tk-sum-lbl{font-size:7px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px;line-height:1.3;}
.tk-row{border-top:1px solid var(--rim);padding:16px 0;display:grid;grid-template-columns:72px 1fr;gap:0;}
.tk-rest{opacity:.45;}
.tk-left{padding-right:12px;border-right:1px solid var(--rim2);}
.tk-gun{font-size:7px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.tk-num{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--fg);opacity:.15;line-height:1;}
.tk-right{padding-left:14px;}
.tk-session-hdr{margin-bottom:10px;}
.tk-session-name{font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--fg);margin-bottom:6px;}
.tk-badges{display:flex;gap:5px;flex-wrap:wrap;}
.tk-badge{font-size:7px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--rim);color:var(--muted);}
.tk-badge-yuk{border-color:var(--fg);color:var(--fg);}
.tk-bars{margin-bottom:12px;}
.tk-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.tk-bar-kas{font-size:10px;color:var(--muted);min-width:70px;}
.tk-bar-track{flex:1;height:5px;background:var(--rim2);overflow:hidden;}
.tk-bar-fill{height:100%;background:var(--fg);opacity:.7;}
.tk-bar-val{font-size:10px;font-weight:500;color:var(--fg);min-width:16px;text-align:right;}
.tk-section-lbl{font-size:7px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--bg);background:var(--fg);display:inline-block;padding:2px 6px;margin-bottom:6px;opacity:.7;}
.tk-pills{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;}
.tk-pill{font-size:9px;color:var(--muted);border:1px solid var(--rim2);padding:2px 7px;}
.tk-pill-c{border-color:var(--rim);color:var(--fg);font-weight:500;}
.tk-note{font-size:10px;color:var(--muted);line-height:1.6;padding-top:8px;border-top:1px solid var(--rim2);opacity:.7;}
.tk-rest-lbl{font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.tk-rest-note{font-size:10px;color:var(--muted);line-height:1.6;opacity:.7;}

/* BOKS */
.boks-view{padding:0 16px 100px;}
.boks-ay-tabs{display:flex;gap:0;margin-top:16px;margin-bottom:14px;border:1px solid var(--rim);}
.boks-ay-tab{flex:1;padding:8px 4px;font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center;cursor:pointer;background:transparent;border:none;border-right:1px solid var(--rim);color:var(--muted);font-family:'Inter Tight',sans-serif;line-height:1.4;transition:all .12s;}
.boks-ay-tab:last-child{border-right:none;}
.boks-ay-tab.on{background:var(--fg);color:var(--bg);}
.boks-ay-meta{background:var(--rim2);padding:.8rem 1rem;margin-bottom:12px;}
.boks-ay-baslik{font-size:13px;font-weight:700;color:var(--fg);margin-bottom:4px;}
.boks-ay-desc{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:8px;}
.boks-ay-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.boks-stat{background:var(--bg);padding:10px 12px;border:1px solid var(--rim);}
.boks-stat-val{font-size:16px;font-weight:800;color:var(--fg);}
.boks-stat-lbl{font-size:8px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.boks-hafta{border:1px solid var(--rim);margin-bottom:8px;}
.boks-hafta-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;}
.boks-hafta-sol{display:flex;align-items:center;gap:10px;}
.boks-hafta-num{font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:52px;}
.boks-hafta-baslik{font-size:13px;font-weight:700;color:var(--fg);}
.boks-hafta-arrow{font-size:14px;color:var(--muted);transition:transform .2s;}
.boks-hafta-arrow.open{transform:rotate(180deg);}
.boks-ilerleme{padding:0 12px 8px;}

function mainNavSwitch(tab){
  const isProgram=tab==='program';
  const isWod100=tab==='wod100';
  const isEmom=tab==='emom';
  const isRecipes=tab==='recipes';
  const isBoks=tab==='boks';
  const isRakip=tab==='rakip';
  const isGen=tab==='gen';
  const isBeslenme=tab==='beslenme';
  const isOlimpik=tab==='olimpik';
  document.getElementById('mnav-program').classList.toggle('on',isProgram);
  document.getElementById('mnav-wod100').classList.toggle('on',isWod100);
  document.getElementById('mnav-emom').classList.toggle('on',isEmom);
  document.getElementById('mnav-rakip').classList.toggle('on',isRakip);
  document.getElementById('mnav-gen').classList.toggle('on',isGen);
  document.getElementById('mnav-beslenme').classList.toggle('on',isBeslenme);
  document.getElementById('mnav-olimpik').classList.toggle('on',isOlimpik);
  document.getElementById('mnav-boks').classList.toggle('on',isBoks);
  document.getElementById('mnav-recipes').classList.toggle('on',isRecipes);
  document.getElementById('nav').style.display=isProgram?'flex':'none';
  document.getElementById('araclar-menu').style.display='none';
  if(isProgram){if(!PROGRAM_MODES.includes(mode)) setPPL();else renderNav();}
  else if(isWod100){setWod100();}
  else if(isEmom){setEmom();}
  else if(isRakip){setRakip();}
  else if(isGen){setGen();}
  else if(isBeslenme){setBeslenme();}
  else if(isOlimpik){setOlimpik();}
  else if(isBoks){setBoks();}
  else if(isRecipes){setRecipes();}
}

function renderNav(){
  const isHibrit=mode==='hibrit';
  const isPPL=mode==='ppl'||mode==='program';
  let tabs='';
  if(isHibrit){
    HIBRIT_DAYS.forEach((d,i)=>{
      tabs+=`<div class="nav-tab${i===hibritActiveDay?' on':''}" onclick="hibritSetDay(${i})">
        <div class="nav-tab-num">0${i+1}</div>
        <div class="nav-tab-lbl">${d.label.replace('GÜN ','G')}</div>
      </div>`;
    });
  } else if(isPPL){
    DAYS.forEach((d,i)=>{
      var shortLabel=d.label.replace('PULL B+LEGS','PB+LEG').replace('PUSH B','PUSH B');
      tabs+=`<div class="nav-tab${i===cur?' on':''}" onclick="setDay(${i})">
        <div class="nav-tab-num">0${i+1}</div>
        <div class="nav-tab-lbl">${shortLabel}</div>
      </div>`;
    });
  }
  document.getElementById('nav').innerHTML=tabs;
  document.getElementById('nav').style.display=(isHibrit||isPPL)?'flex':'none';
  document.getElementById('araclar-menu').style.display=(mode==='araclar')?'block':'none';

  // ana nav aktiflik
  document.getElementById('mnav-program').classList.toggle('on',isHibrit||isPPL);
  document.getElementById('mnav-wod100').classList.toggle('on',mode==='wod100');
  document.getElementById('mnav-emom').classList.toggle('on',mode==='emom');
  document.getElementById('mnav-rakip').classList.toggle('on',mode==='rakip');
  document.getElementById('mnav-gen').classList.toggle('on',mode==='gen');
  document.getElementById('mnav-beslenme').classList.toggle('on',mode==='beslenme');
  document.getElementById('mnav-olimpik').classList.toggle('on',mode==='olimpik');
  document.getElementById('mnav-boks').classList.toggle('on',mode==='boks');
  document.getElementById('mnav-recipes').classList.toggle('on',mode==='recipes');
  document.getElementById('araclar-menu').style.display='none';
}

const INT_LABELS=['BASİT','ORTA','AĞIR','ÇOK AĞIR'];
const INT_KEYS=['basit','orta','agir','cokAgir'];
var dayWodState={};

function dayWodInit(dayKey){
  if(!dayWodState[dayKey]) dayWodState[dayKey]={int:1,idx:null,history:[[],[],[],[]]};
}

function dayWodRoll(dayKey){
  dayWodInit(dayKey);
  var st=dayWodState[dayKey];
  var pool=DAY_WODS[dayKey][INT_KEYS[st.int]];
  if(!pool||!pool.length) return;
  var hist=st.history[st.int];
  var avail=pool.map(function(_,i){return i;}).filter(function(i){return !hist.includes(i);});
  if(!avail.length){st.history[st.int]=[];avail=pool.map(function(_,i){return i;});}
  var pick=avail[Math.floor(Math.random()*avail.length)];
  st.history[st.int].push(pick);
  st.idx=pick;
  renderDayWodResult(dayKey);
  var icon=document.getElementById('wod-roll-icon-'+dayKey);
  if(icon){icon.classList.add('spin');setTimeout(function(){icon.classList.remove('spin');},350);}
}

function dayWodSetInt(dayKey,intIdx){
  dayWodInit(dayKey);
  dayWodState[dayKey].int=intIdx;
  dayWodState[dayKey].idx=null;
  document.querySelectorAll('.wod-int-btn[data-day="'+dayKey+'"]').forEach(function(b,j){b.classList.toggle('on',j===intIdx);});
  renderDayWodResult(dayKey);
}

function renderDayWodResult(dayKey){
  var cont=document.getElementById('wod-result-'+dayKey);
  if(!cont) return;
  var st=dayWodState[dayKey];
  var pool=DAY_WODS[dayKey][INT_KEYS[st.int]];
  if(st.idx===null||!pool||!pool[st.idx]){
    cont.innerHTML='<div class="wod-empty">⟳ YENİLE\'ye bas</div>';
    return;
  }
  var w=pool[st.idx];
  cont.innerHTML=
    '<div class="wod-result"><div class="wod-result-name">'+w.name+'</div>'+
    '<div class="wod-result-type">'+w.type+'</div>'+
    '<div class="wod-result-content">'+w.content+'</div>'+
    '<div class="wod-result-meta">'+
      '<div class="wod-meta-item"><div class="wod-meta-lbl">Süre</div><div class="wod-meta-val">'+w.sure+'</div></div>'+
      '<div class="wod-meta-item"><div class="wod-meta-lbl">Yoğunluk</div><div class="wod-meta-val">'+w.yogunluk+'</div></div>'+
    '</div>'+
    '<div class="wod-result-note">'+w.note+'</div></div>';
}

// Her günün her hareketi için aktif alternatif indeksi
var coreAktifIdx={};

function coreGetHareket(dayKey, hareketKey){
  var pool=CORE_ALTERNATIFLER[hareketKey];
  if(!pool) return null;
  var idx=coreAktifIdx[dayKey+'_'+hareketKey]||0;
  return pool[idx%pool.length];
}

function coreDegistir(dayKey, hareketKey){
  var key=dayKey+'_'+hareketKey;
  var pool=CORE_ALTERNATIFLER[hareketKey];
  if(!pool) return;
  var current=(coreAktifIdx[key]||0);
  coreAktifIdx[key]=(current+1)%pool.length;
  renderCoreHareket(dayKey, hareketKey);
}

function renderCoreHareket(dayKey, hareketKey){
  var cont=document.getElementById('core-h-'+dayKey+'_'+hareketKey.replace(/[^a-zA-Z0-9]/g,'_'));
  if(!cont) return;
  var h=coreGetHareket(dayKey, hareketKey);
  if(!h) return;
  cont.innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">'+
      '<div style="flex:1;">'+
        '<div style="font-size:13px;font-weight:700;color:var(--fg);margin-bottom:3px;">'+h.name+'</div>'+
        '<div style="font-size:10px;font-weight:700;color:var(--muted);margin-bottom:6px;">'+h.sets+'</div>'+
        '<div style="font-size:11px;color:var(--muted);line-height:1.7;margin-bottom:6px;">'+h.aciklama+'</div>'+
        '<div style="font-size:8px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);opacity:.5;">'+h.kaslar+'</div>'+
      '</div>'+
      '<button onclick="coreDegistir(\''+dayKey+'\',\''+hareketKey+'\')" style="flex-shrink:0;width:32px;height:32px;background:transparent;border:1px solid var(--rim);color:var(--muted);font-size:14px;cursor:pointer;font-family:inherit;transition:all var(--ease);">⟳</button>'+
    '</div>';
}

var blokCTab={};

function blokCSetTab(dayKey,tab){
  blokCTab[dayKey]=tab;
  ['wod','hyrox','core'].forEach(function(t){
    var pane=document.getElementById('blokc-'+t+'-'+dayKey);

    if(pane) pane.classList.toggle('on',t===tab);

  });
}

function rakipToggle(catIdx,wodIdx){
  var key=catIdx+'-'+wodIdx;
  rakipOpenItems[key]=!rakipOpenItems[key];
  var detail=document.getElementById('rakip-detail-'+key);
  var arrow=document.getElementById('rakip-arrow-'+key);
  if(detail) detail.classList.toggle('open',!!rakipOpenItems[key]);
  if(arrow) arrow.classList.toggle('open',!!rakipOpenItems[key]);
}

function rakipSetCat(i){
  rakipActiveCat=i;
  document.querySelectorAll('.rakip-cat-tab').forEach(function(t,j){t.classList.toggle('on',j===i);});
  renderRakipContent();
  document.getElementById('main-scroll').scrollTop=0;resetHeader();
}

function renderRakipContent(){
  var cont=document.getElementById('rakip-content');
  if(!cont) return;
  var cat=RAKIP_CATS[rakipActiveCat];
  var html='<div class="rakip-wod-list">';
  cat.wods.forEach(function(w,wi){
    var key=rakipActiveCat+'-'+wi;
    var open=!!rakipOpenItems[key];
    html+='<div class="rakip-wod-item">'+
      '<div class="rakip-wod-hdr" onclick="rakipToggle('+rakipActiveCat+','+wi+')">'+
        '<div class="rakip-wod-hdr-left">'+
          '<div class="rakip-wod-name">'+w.name+'</div>'+
          '<div class="rakip-wod-format">'+w.format+'</div>'+
        '</div>'+
        '<div class="rakip-wod-arrow'+(open?' open':'')+'" id="rakip-arrow-'+key+'">↓</div>'+
      '</div>'+
      '<div class="rakip-wod-detail'+(open?' open':'')+'" id="rakip-detail-'+key+'">'+
        '<div class="rakip-wod-rx">'+w.rx+'</div>'+
        '<div class="rakip-levels">'+
          '<div class="rakip-level level-elite"><div class="rakip-level-lbl">Elite</div><div class="rakip-level-val">'+w.levels.elite+'</div></div>'+
          '<div class="rakip-level level-advanced"><div class="rakip-level-lbl">Advanced</div><div class="rakip-level-val">'+w.levels.advanced+'</div></div>'+
          '<div class="rakip-level level-intermediate"><div class="rakip-level-lbl">Intermediate</div><div class="rakip-level-val">'+w.levels.intermediate+'</div></div>'+
          '<div class="rakip-level level-beginner"><div class="rakip-level-lbl">Beginner</div><div class="rakip-level-val">'+w.levels.beginner+'</div></div>'+
        '</div>'+
        '<div class="rakip-board">'+
          '<div class="rakip-board-title">DÜNYA LİDERBOARDU</div>';
    w.board.forEach(function(a){
      var rankClass=a.rank===1?'gold':a.rank===2?'silver':a.rank===3?'bronze':'';
      html+='<div class="rakip-row">'+
        '<div class="rakip-rank '+rankClass+'">'+(a.rank===1?'◆':a.rank===2?'◇':a.rank===3?'▲':a.rank)+'</div>'+
        '<div class="rakip-athlete">'+
          '<div class="rakip-athlete-name">'+a.name+'</div>'+
          '<div class="rakip-athlete-sub">'+a.sub+' · '+a.year+'</div>'+
        '</div>'+
        '<div class="rakip-score">'+a.score+'<span class="rakip-score-unit">'+w.unit+'</span></div>'+
      '</div>';
    });
    html+='</div></div></div>';
  });
  html+='</div>';
  cont.innerHTML=html;
}

function renderRakipView(){
  var v=document.getElementById('rakip-view');
  var totalWods=RAKIP_CATS.reduce(function(s,c){return s+c.wods.length;},0);
  var totalAthletes=8;
  var html='<div class="rakip-hero">'+
    '<div class="rakip-hero-title">RAKİP MODU</div>'+
    '<div class="rakip-hero-sub">CrossFit\'in en iyi sporcularının gerçek benchmark skorları. Neredesin?</div>'+
    '<div class="rakip-hero-stats">'+
      '<div class="rakip-stat"><div class="rakip-stat-val">'+totalWods+'</div><div class="rakip-stat-lbl">WOD</div></div>'+
      '<div class="rakip-stat"><div class="rakip-stat-val">'+totalAthletes+'</div><div class="rakip-stat-lbl">Sporcu</div></div>'+
      '<div class="rakip-stat"><div class="rakip-stat-val">4</div><div class="rakip-stat-lbl">Seviye</div></div>'+
    '</div>'+
  '</div>'+
  '<div class="rakip-cat-tabs">';
  RAKIP_CATS.forEach(function(c,i){
    html+='<button class="rakip-cat-tab'+(i===rakipActiveCat?' on':'')+'" onclick="rakipSetCat('+i+')">'+c.label+'</button>';
  });
  html+='</div><div id="rakip-content"></div>';
  v.innerHTML=html;
  renderRakipContent();
}

var beslenmeActiveCat='sabah';

function beslenmeGetArr(ogün){
  if(ogün==='sabah') return BESLENME_SABAH;
  if(ogün==='ogle') return BESLENME_OGLE;
  if(ogün==='aksam') return BESLENME_AKSAM;
  return BESLENME_ARA;
}

function beslenmeGetMeal(ogün){
  var arr=beslenmeGetArr(ogün);
  return arr[beslenmeActiveSlots[ogün]%arr.length];
}

function beslenmeRoll(ogün){
  var arr=beslenmeGetArr(ogün);
  var hist=beslenmeHistory[ogün];
  var avail=arr.map((_,i)=>i).filter(i=>!hist.includes(i));
  if(!avail.length){beslenmeHistory[ogün]=[];avail=arr.map((_,i)=>i);}
  var pick=avail[Math.floor(Math.random()*avail.length)];
  beslenmeHistory[ogün].push(pick);
  beslenmeActiveSlots[ogün]=pick;
  renderBeslenmeCard(ogün);
  updateBeslenmeTotals();
  var icon=document.getElementById('beslenme-icon-'+ogün);
  if(icon){icon.classList.add('spin');setTimeout(()=>icon.classList.remove('spin'),350);}
}

function beslenmeSetCat(cat){
  beslenmeActiveCat=cat;
  document.querySelectorAll('.beslenme-cat-tab').forEach(t=>t.classList.remove('on'));
  var btn=document.getElementById('beslenme-tab-'+cat);
  if(btn) btn.classList.add('on');
  renderBeslenmeContent();
}

function renderBeslenmeCard(ogün){
  var cont=document.getElementById('beslenme-card-'+ogün);
  if(!cont) return;
  var m=beslenmeGetMeal(ogün);
  var steps=m.steps.map((s,i)=>'<div class="beslenme-step"><div class="beslenme-step-num">'+(i+1)+'</div><div class="beslenme-step-text">'+s+'</div></div>').join('');
  cont.innerHTML=
    '<div class="beslenme-card">'+
      '<div class="beslenme-card-name">'+m.name+'</div>'+
      '<div class="beslenme-card-tags">'+
        '<span class="beslenme-tag protein">'+m.protein+'g protein</span>'+
        '<span class="beslenme-tag">'+m.kcal+' kcal</span>'+
        '<span class="beslenme-tag">'+m.sure+'</span>'+
      '</div>'+
      '<div class="beslenme-ing">'+m.ing.join(' · ')+'</div>'+
      '<div class="beslenme-steps">'+steps+'</div>'+
    '</div>';
}

function renderBeslenmeContent(){
  var ogün=beslenmeActiveCat;
  var cont=document.getElementById('beslenme-main-content');

function updateBeslenmeTotals(){
  var s=beslenmeGetMeal('sabah');
  var o=beslenmeGetMeal('ogle');
  var a=beslenmeGetMeal('aksam');
  var ar=beslenmeGetMeal('ara');
  var totalP=s.protein+o.protein+a.protein+ar.protein;
  var totalK=s.kcal+o.kcal+a.kcal+ar.kcal;
  var tp=document.getElementById('beslenme-total-protein');
  var tk=document.getElementById('beslenme-total-kcal');
  if(tp) tp.textContent=totalP+'g';
  if(tk) tk.textContent=totalK;
}

function renderBeslenmeView(){
  var v=document.getElementById('beslenme-view');
  var cats=[
    {id:'sabah',label:'SABAH'},
    {id:'ogle',label:'ÖĞLE'},
    {id:'aksam',label:'AKŞAM'},
    {id:'ara',label:'ARA ÖĞÜN'},
  ];

  var tabsHtml=cats.map(c=>
    '<button class="beslenme-cat-tab'+(c.id===beslenmeActiveCat?' on':'')+'" '+
    'id="beslenme-tab-'+c.id+'" onclick="beslenmeSetCat(\''+c.id+'\')">'+c.label+'</button>'
  ).join('');

  v.innerHTML=
    '<div class="beslenme-hero">'+
      '<div class="beslenme-hero-title">GÜNLÜK BESLENME</div>'+
      '<div class="beslenme-hero-sub">180g protein hedefi · Yağ yak, kas koru · 4 öğün · Ekonomik</div>'+
      '<div class="beslenme-hero-stats">'+
        '<div class="beslenme-hero-stat"><div class="beslenme-hero-stat-val" id="beslenme-total-protein">-</div><div class="beslenme-hero-stat-lbl">Toplam Protein</div></div>'+
        '<div class="beslenme-hero-stat"><div class="beslenme-hero-stat-val" id="beslenme-total-kcal">-</div><div class="beslenme-hero-stat-lbl">Toplam kcal</div></div>'+
        '<div class="beslenme-hero-stat"><div class="beslenme-hero-stat-val">180g</div><div class="beslenme-hero-stat-lbl">Hedef Protein</div></div>'+
      '</div>'+
    '</div>'+
    '<div class="beslenme-cat-tabs">'+tabsHtml+'</div>'+
    '<div id="beslenme-main-content"></div>';

  renderBeslenmeContent();
  updateBeslenmeTotals();
}

function setBeslenme(){
  mode='beslenme';
  setHdrTitle('BESLENME');
  document.getElementById('hdr-target').textContent='GÜNLÜK PLAN · 180G PROTEİN · KAS KORUMA';
  hideAll();
  document.getElementById('beslenme-view').style.display='block';
  renderBeslenmeView();
  renderNav();
  document.getElementById('main-scroll').scrollTop=0;resetHeader();
}

// ─── KATEGORİ → EGZERSİZ HAVUZU & MATRİS ANAHTARI ───
function woGetMatrisKey(){
  if(woKategori==='ppl'){
    if(woPplAlt==='push') return 'ppl_push';
    if(woPplAlt==='pull') return 'ppl_pull';
    if(woPplAlt==='legs') return 'ppl_legs';
    return null;
  }
  return woKategori;
}

function woGetHavuz(){
  var key=woGetMatrisKey();
  return WO_EGZERSIZLER[key]||{};
}

function woGetHacim(){
  var key=woGetMatrisKey();
  if(!key||!woHedef) return {};
  return WO_HACIM_MATRIS[key][woHedef]||{};
}

// ─── TOGGLE / AÇMA-KAPAMA ───
function toggleWorkoutBuilder(){
  woOpen=!woOpen;
  var strip=document.getElementById('wo-strip');
  var view=document.getElementById('workout-builder-view');
  var arrow=document.getElementById('wo-strip-arrow');
  if(woOpen){
    strip.classList.add('on');
    arrow.textContent='✕';
    // Diğer ana görünümleri gizle
    hideAll();
    view.style.display='block';
    document.getElementById('main-nav').style.display='none';
    document.getElementById('nav').style.display='none';
    woReset();
    renderWorkoutBuilder();
  }else{
    strip.classList.remove('on');
    arrow.textContent='→';
    document.getElementById('main-nav').style.display='flex';
    hideAll();
    // Önceki görünüme dön — mode değerine göre doğru view ve nav
    if(mode==='ppl'||mode==='hibrit'||mode==='program'){
      document.getElementById('day-view').style.display='block';
      mainNavSwitch('program');
    }else{
      var tabMap={'wod100':'wod100','emom':'emom','rakip':'rakip','gen':'gen','beslenme':'beslenme','olimpik':'olimpik','boks':'boks','recipes':'recipes'};
      var targetTab=tabMap[mode]||'program';
      mainNavSwitch(targetTab);
    }
  }
}

function woReset(){
  woStep='kategori';
  woKategori=null;
  woHedef=null;
  woPplAlt=null;
  woSecimler={};
  woAktifKasGrubu=null;
  woDetayAcik={};
}

// ─── ANA RENDER ROUTER ───
function renderWorkoutBuilder(){
  var v=document.getElementById('workout-builder-view');
  if(woStep==='kategori') v.innerHTML=woRenderKategori();
  else if(woStep==='hedef') v.innerHTML=woRenderHedef();
  else if(woStep==='ppl-alt') v.innerHTML=woRenderPplAlt();
  else if(woStep==='egzersiz') v.innerHTML=woRenderEgzersiz();
  else if(woStep==='ozet') v.innerHTML=woRenderOzet();
  document.getElementById('main-scroll').scrollTop=0;
}

// ─── ADIM 3: EGZERSİZ SEÇİMİ ───
function woRenderEgzersiz(){
  var hacim=woGetHacim();
  var havuz=woGetHavuz();
  var kasGruplari=Object.keys(hacim);
  var catName=woKategori==='ppl'?('PUSH/PULL/LEGS — '+woPplAlt.toUpperCase()):WO_KATEGORILER.find(c=>c.id===woKategori).name;
  var hedefName=WO_HEDEFLER.find(h=>h.id===woHedef).name;

  var html='<div class="wo-view">'+
    '<div class="wo-back" onclick="woBack(\'hedef\')">← HEDEFİ DEĞİŞTİR</div>'+
    '<div class="wo-hero">'+
      '<div class="wo-hero-title">'+catName+'</div>'+
      '<div class="wo-hero-sub">Hedef: <strong style="color:var(--fg);">'+hedefName+'</strong> — Her bölgeden gerekli sayıda hareket seç.</div>'+
    '</div>';

  // Sayaç paneli — özet bilgi, tıklanabilir değil artık (sadece ilerleme göstergesi)
  html+='<div class="wo-progress">';
  kasGruplari.forEach(function(kas){
    var ihtiyac=hacim[kas];
    var secilen=(woSecimler[kas]||[]).length;
    var kalan=ihtiyac-secilen;
    var done=kalan<=0;
    html+='<div class="wo-progress-item'+(done?' done':'')+'">'+
      '<span class="wo-progress-name">'+kas+'</span>'+
      '<span class="wo-progress-count">'+(done?'✓':kalan)+'</span>'+
    '</div>';
  });
  html+='</div>';

  // TÜM kas grupları tek sayfada, sırayla
  kasGruplari.forEach(function(kas){
    var ihtiyac=hacim[kas]||0;
    var secilenler=woSecimler[kas]||[];
    var kalan=ihtiyac-secilenler.length;
    var pool=havuz[kas]||[];

    html+='<div class="wo-pool-section">'+
      '<div class="wo-pool-hdr">'+
        '<div class="wo-pool-title">'+kas+'</div>'+
        '<div class="wo-pool-need">'+(kalan>0?(kalan+' SEÇ'):'TAMAMLANDI ✓')+'</div>'+
      '</div>'+
      '<div class="wo-pool-list">';
    pool.forEach(function(ex,i){
      var isSelected=secilenler.some(function(s){return s.name===ex.name;});
      html+='<div class="wo-ex-row'+(isSelected?' selected':'')+'" onclick="woToggleEgzersiz(\''+kas+'\','+i+')">'+
        '<div class="wo-ex-name">'+ex.name+'</div>'+
        '<div class="wo-ex-check">✓</div>'+
      '</div>';
    });
    html+='</div></div>';
  });

  // Tüm kas grupları tamamlandıysa oluştur butonu
  var hepsiTamam=kasGruplari.every(function(kas){
    return (woSecimler[kas]||[]).length>=hacim[kas];
  });
  if(hepsiTamam && kasGruplari.length>0){
    html+='<button class="wo-complete-btn" onclick="woStep=\'ozet\';renderWorkoutBuilder()">PROGRAMI OLUŞTUR</button>';
  }else{
    var toplamKalan=kasGruplari.reduce(function(s,kas){return s+Math.max(0,hacim[kas]-(woSecimler[kas]||[]).length);},0);
    html+='<button class="wo-complete-btn" disabled>'+toplamKalan+' HAREKET DAHA SEÇ</button>';
  }

  html+='</div>';
  return html;
}

function woToggleEgzersiz(kas, idx){
  var havuz=woGetHavuz();
  var hacim=woGetHacim();
  var ex=havuz[kas][idx];
  if(!woSecimler[kas]) woSecimler[kas]=[];

  var existingIdx=woSecimler[kas].findIndex(function(s){return s.name===ex.name;});
  if(existingIdx>=0){
    // Zaten seçili — kaldır
    woSecimler[kas].splice(existingIdx,1);
  }else{
    // Limit kontrolü
    if(woSecimler[kas].length>=hacim[kas]){
      // Limit dolu — en eskiyi çıkar, yenisini ekle
      woSecimler[kas].shift();
    }
    woSecimler[kas].push(ex);
  }
  renderWorkoutBuilder();
}

// ─── ADIM 4: ÖZET / FİNAL ───
function woRenderOzet(){
  var hedefObj=WO_HEDEFLER.find(h=>h.id===woHedef);
  var catName=woKategori==='ppl'?('PUSH/PULL/LEGS — '+woPplAlt.toUpperCase()):WO_KATEGORILER.find(c=>c.id===woKategori).name;

  var html='<div class="wo-view">'+
    '<div class="wo-back" onclick="woStep=\'egzersiz\';renderWorkoutBuilder()">← DÜZENLE</div>'+
    '<div class="wo-hero">'+
      '<div class="wo-hero-title">PROGRAMIN HAZIR</div>'+
      '<div class="wo-hero-sub">'+catName+' · '+hedefObj.name+' · '+hedefObj.sets+' · '+hedefObj.reps+' · '+hedefObj.rest+'</div>'+
    '</div>'+
    '<div class="wo-summary">';

  Object.keys(woSecimler).forEach(function(kas){
    html+='<div class="wo-summary-title">'+kas.toUpperCase()+'</div>';
    woSecimler[kas].forEach(function(ex,i){
      var detailKey=kas+'_'+i;
      var isOpen=!!woDetayAcik[detailKey];
      html+='<div class="wo-summary-item" style="flex-direction:column;align-items:stretch;gap:6px;">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">'+
          '<div class="wo-summary-ex">'+ex.name+'</div>'+
          '<div style="display:flex;gap:6px;flex-shrink:0;">'+
            '<span class="wo-detail-tag">'+hedefObj.sets+'</span>'+
            '<span class="wo-detail-tag">'+hedefObj.reps+'</span>'+
          '</div>'+
        '</div>'+
        '<div style="display:flex;justify-content:space-between;align-items:center;">'+
          '<div style="font-size:10px;color:var(--muted);">'+ex.ekip+' · '+hedefObj.rest+'</div>'+
          '<button class="wo-summary-detail-btn" onclick="woToggleDetay(\''+detailKey+'\')">'+(isOpen?'GİZLE':'AÇIKLAMA')+'</button>'+
        '</div>'+
        '<div class="wo-detail-card'+(isOpen?' open':'')+'" id="wo-detail-'+detailKey+'">'+
          '<div>'+ex.aciklama+'</div>'+
          '<div style="margin-top:6px;font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);opacity:.6;">'+ex.kaslar+'</div>'+
        '</div>'+
      '</div>';
    });
  });

  html+='</div>'+
    '<button class="wo-reset-btn" onclick="woReset();renderWorkoutBuilder()">YENİ WORKOUT OLUŞTUR</button>'+
  '</div>';
  return html;
}

function woToggleDetay(key){
  woDetayAcik[key]=!woDetayAcik[key];
  var card=document.getElementById('wo-detail-'+key);
  var btn=card.nextElementSibling||card.parentElement.querySelector('.wo-summary-detail-btn');
  card.classList.toggle('open',!!woDetayAcik[key]);
  // Buton metnini güncelle
  var row=card.closest('.wo-summary-item');
  var b=row.querySelector('.wo-summary-detail-btn');
  b.textContent=woDetayAcik[key]?'GİZLE':'DETAY';
}

var olimpikOpenGuns={};

function olimpikToggleGun(fazIdx,gunIdx){
  var key=fazIdx+'-'+gunIdx;
  olimpikOpenGuns[key]=!olimpikOpenGuns[key];
  var body=document.getElementById('olimpik-gun-body-'+key);
  var arrow=document.getElementById('olimpik-gun-arrow-'+key);
  if(body) body.classList.toggle('open',!!olimpikOpenGuns[key]);
  if(arrow) arrow.classList.toggle('open',!!olimpikOpenGuns[key]);
}

function olimpikSetFaz(i){
  olimpikActiveFaz=i;
  document.querySelectorAll('.olimpik-faz-tab').forEach((t,j)=>t.classList.toggle('on',j===i));
  document.querySelectorAll('.olimpik-content').forEach((c,j)=>c.classList.toggle('on',j===i));
  document.getElementById('main-scroll').scrollTop=0;
}

var genLastWod=null;

  },
};

const GEN_AGIRLIK={
  barbell:{basit:'40–50 kg',orta:'60–70 kg',agir:'80–90 kg',cokAgir:'%80+ 1RM'},
  db:{basit:'2×8–10 kg',orta:'2×12–15 kg',agir:'2×17.5–22 kg',cokAgir:'2×25+ kg'},
  kb:{basit:'16 kg',orta:'20–24 kg',agir:'28–32 kg',cokAgir:'32+ kg'},
  bw:{basit:'Hafif tempo',orta:'Normal tempo',agir:'Ağırlıklı / yavaş',cokAgir:'Max effort'},
};

const GEN_ISIM_PARÇALAR={
  harfler:['A','B','C','D','X','Z'],
  sayilar:['7','9','12','15','21'],
  sozcukler:['IRON','DARK','HEAVY','RAPID','BRUTAL','GRIND','FORGE','FIRE','STORM','BLAZE'],
};

function genRandom(arr){return arr[Math.floor(Math.random()*arr.length)];}
function genShuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function genIsimUret(format,kas){
  var r=Math.random();
  if(r<0.3) return genRandom(GEN_ISIM_PARÇALAR.sozcukler)+' '+genRandom(GEN_ISIM_PARÇALAR.harfler);
  if(r<0.6) return genRandom(GEN_ISIM_PARÇALAR.sozcukler)+' '+genRandom(GEN_ISIM_PARÇALAR.sayilar);
  return genRandom(GEN_ISIM_PARÇALAR.sozcukler)+' '+format.toUpperCase().split(' ')[0];
}

function genWodUret(){
  var p=genParams;
  var hareketHavuzu=GEN_HAREKETLER[p.kas][p.ekipman]||GEN_HAREKETLER[p.kas]['bw'];
  var coreHavuzu=GEN_HAREKETLER.core[p.ekipman]||GEN_HAREKETLER.core.bw;
  var karisik=(GEN_HAREKETLER.fullbody[p.ekipman]||GEN_HAREKETLER.fullbody.bw);
  var agirlik=GEN_AGIRLIK[p.ekipman][p.yogunluk.replace('-','_')]||GEN_AGIRLIK[p.ekipman].orta;
  var sure=parseInt(p.sure);
  var hareket1=genRandom(hareketHavuzu);
  var hareket2=genRandom(hareketHavuzu.filter(function(h){return h!==hareket1;})||hareketHavuzu);
  var hareket3=genRandom(coreHavuzu);
  var hareket4=genRandom(karisik);

  var repMap={basit:{main:'15',sec:'12',core:'20'},orta:{main:'10',sec:'8',core:'15'},agir:{main:'6',sec:'5',core:'12'},cokAgir:{main:'3',sec:'3',core:'10'}};
  var repKey=p.yogunluk.replace('-','_');
  var reps=repMap[repKey]||repMap.orta;

  var wod={isim:genIsimUret(p.format,p.kas),tur:'',icerik:'',sure:p.sure+' dk',yogunluk:'',tip:''};

  if(p.format==='amrap'){
    wod.tur='AMRAP · '+sure+' dk';
    wod.icerik=reps.main+' × '+hareket1+' ('+agirlik+')\n'+reps.sec+' × '+hareket2+'\n'+reps.core+' × '+hareket3;
    wod.yogunluk=p.yogunluk==='basit'?'Orta':p.yogunluk==='cokAgir'?'Çok Ağır':p.yogunluk.charAt(0).toUpperCase()+p.yogunluk.slice(1);
    wod.tip='Her roundu say. Amacın son dakikada aynı tempoyu korumak. Bölünürsen roundu kaybediyorsun.';
  } else if(p.format==='emom'){
    var dkSayisi=sure;
    var dkTipi=dkSayisi<=10?2:3;
    if(dkTipi===2){
      wod.tur='EMOM · '+dkSayisi+' dk (2 hareket)';
      wod.icerik='Tek dk → '+reps.main+' × '+hareket1+' ('+agirlik+')\nÇift dk → '+reps.sec+' × '+hareket2;
    } else {
      wod.tur='EMOM · '+dkSayisi+' dk (3 hareket)';
      wod.icerik='Dk 1 → '+reps.main+' × '+hareket1+' ('+agirlik+')\nDk 2 → '+reps.sec+' × '+hareket2+'\nDk 3 → '+reps.core+' × '+hareket3;
    }
    wod.yogunluk=p.yogunluk==='basit'?'Orta':p.yogunluk==='cokAgir'?'Çok Ağır':p.yogunluk.charAt(0).toUpperCase()+p.yogunluk.slice(1);
    wod.tip='Dakika bitmeden hareketi bitir. Kalan süre dinlenmen. İlk dakikalar kolay gelirse ağırlık çok düşük.';
  } else if(p.format==='fortime'){
    var roundSayisi=p.yogunluk==='basit'?3:p.yogunluk==='orta'?4:p.yogunluk==='agir'?5:6;
    wod.tur=roundSayisi+' Round For Time';
    wod.icerik=reps.main+' × '+hareket1+' ('+agirlik+')\n'+reps.sec+' × '+hareket2+'\n'+reps.core+' × '+hareket3;
    wod.yogunluk=p.yogunluk==='basit'?'Orta':p.yogunluk==='cokAgir'?'Çok Ağır':p.yogunluk.charAt(0).toUpperCase()+p.yogunluk.slice(1);
    wod.tip='Süreyi kaydet. Hedefin her round\'u aynı tempoyla bitirmek. Son round ilk rounddan fazla sürmemeli.';
  } else if(p.format==='interval'){
    var calisma=p.yogunluk==='basit'?'30':p.yogunluk==='orta'?'40':p.yogunluk==='agir'?'45':'50';
    var dinlenme=p.yogunluk==='basit'?'30':p.yogunluk==='orta'?'20':p.yogunluk==='agir'?'15':'10';
    var turSayisi=Math.ceil(sure*60/(parseInt(calisma)+parseInt(dinlenme)));
    wod.tur=turSayisi+' × '+calisma+'sn/'+dinlenme+'sn Interval';
    wod.icerik=hareket1+' ('+agirlik+') — '+calisma+' sn max\n'+dinlenme+' sn dinlen\n× '+turSayisi+' tekrar\n\nArdından:\n'+reps.core+' × '+hareket3;
    wod.yogunluk=p.yogunluk==='basit'?'Orta':p.yogunluk==='cokAgir'?'Çok Ağır':p.yogunluk.charAt(0).toUpperCase()+p.yogunluk.slice(1);
    wod.tip='Her interval\'da aynı ağırlık kalır. Dinlenme süresinde tamamen dur, hareket etme. Son turlarda form bozulursa ağırlığı düşür.';
  } else if(p.format==='chipper'){
    var toplamHar=p.yogunluk==='basit'?3:p.yogunluk==='orta'?4:5;
    var extraHareketler=genShuffle(karisik.filter(function(h){return h!==hareket4;})).slice(0,toplamHar-2);
    var satirlar=[parseInt(reps.main)*3+' × '+hareket1+' ('+agirlik+')'];
    extraHareketler.forEach(function(h){satirlar.push(parseInt(reps.main)*2+' × '+h);});
    satirlar.push(parseInt(reps.core)*2+' × '+hareket3);
    wod.tur='Chipper · For Time';
    wod.icerik=satirlar.join('\n');
    wod.yogunluk=p.yogunluk==='basit'?'Orta-Ağır':p.yogunluk==='cokAgir'?'Çok Ağır':'Ağır';
    wod.tip='Chipper\'da her hareketten sadece bir kez geçiyorsun. Sırayı atlama. Zor gelen harekete yaklaştığında tempo düşürebilirsin ama durma.';
  }
  genLastWod=wod;
  return wod;
}

}

var legsWodState={wod:null};

function legsRollWod(){
  var avail=LEGS_WODS.filter((_,i)=>!legsWodHistory.includes(i));
  if(!avail.length){legsWodHistory=[];avail=LEGS_WODS.slice();}
  var pickIdx=Math.floor(Math.random()*avail.length);
  var realIdx=LEGS_WODS.indexOf(avail[pickIdx]);
  legsWodHistory.push(realIdx);
  legsWodState.wod=LEGS_WODS[realIdx];
  renderLegsWodCard();
  var icon=document.getElementById('legs-wod-icon');
  if(icon){icon.classList.add('spin');setTimeout(()=>icon.classList.remove('spin'),350);}
}

function renderLegsWodCard(){
  var cont=document.getElementById('legs-wod-card');
  if(!cont) return;
  var w=legsWodState.wod;
  if(!w){
    cont.innerHTML='<div class="wod-empty" style="padding:20px 16px;text-align:center;font-size:10px;color:var(--muted);">RANDOM WOD\'a bas</div>';
    return;
  }
  cont.innerHTML=
    '<div style="background:var(--fg);padding:14px 16px;">'+
      '<div style="font-size:7px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--bg);opacity:.5;margin-bottom:4px;">LEG WOD</div>'+
      '<div style="font-size:22px;font-weight:900;letter-spacing:-.02em;color:var(--bg);line-height:1;margin-bottom:4px;">'+w.name+'</div>'+
      '<div style="font-size:8px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--bg);opacity:.45;">'+w.format+'</div>'+
    '</div>'+
    '<div style="padding:14px 16px;background:var(--bg);">'+
      '<div style="font-size:14px;font-weight:600;color:var(--fg);line-height:1.9;white-space:pre-line;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--rim2);">'+w.icerik+'</div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">'+
        '<span style="font-size:7px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--rim);color:var(--muted);">'+w.sure+'</span>'+
        '<span style="font-size:7px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--rim);color:var(--muted);">'+w.zorluk+'</span>'+
      '</div>'+
      (w.note?'<div style="font-size:10px;color:var(--muted);border-left:2px solid var(--rim);padding-left:10px;line-height:1.7;">'+w.note+'</div>':'')+
    '</div>';
}

function setLegsTab(tab){
  legsTab=tab;
  var standart=document.getElementById('legs-standart');
  var wod=document.getElementById('legs-wod');
  var tabS=document.getElementById('legs-tab-standart');
  var tabW=document.getElementById('legs-tab-wod');
  if(!standart) return;
  standart.style.display=tab==='standart'?'block':'none';
  wod.style.display=tab==='wod'?'block':'none';
  tabS.classList.toggle('on',tab==='standart');
  tabW.classList.toggle('on',tab==='wod');
}

function buildLegsHTML(blocks){
  var blocksHtml='';
  blocks.forEach((b,bi)=>{
    if(bi>0) blocksHtml+='<div class="block-sep"></div>';
    blocksHtml+='<div class="block"><div class="block-hdr"><div class="bh-title">'+b.name+'</div><div class="bh-col">SET</div><div class="bh-col">REP</div><div class="bh-col">NOT</div></div>';
    b.exercises.forEach(ex=>{
      const pills=ex.warmup&&ex.warmup.length>0?'<div class="warmup-pills">'+ex.warmup.map(w=>'<div class="wp">'+w+'</div>').join('')+'</div>':'';
      blocksHtml+='<div class="ex-row"><div><div class="ex-num">'+ex.num+'</div><div class="ex-name">'+ex.name+'</div>'+pills+'</div><div class="ex-val">'+ex.sets+'</div><div class="ex-val">'+ex.reps+'</div><div class="ex-val muted">'+ex.notes+'</div></div>';
    });
    blocksHtml+='</div>';
  });
  return blocksHtml;
}

  const d=DAYS[cur];
  let html='';

  // Legs günü için özel sekme sistemi
  if(d.key==='legs'){

    html+=

        buildPRSectionHTML()+
      '</div>'+
      // LEG WOD: WOD kütüphanesi + Hyrox eki
      '<div id="legs-wod" style="display:none;">'+
        '<div id="legs-wod-card"></div>'+
        '<button class="wod-roll-btn" onclick="legsRollWod()">'+
          '<span class="wod-roll-icon" id="legs-wod-icon">⟳</span> RANDOM WOD'+
        '</button>'+
        hyroxHtml+
      '</div>';

    document.getElementById('day-view').innerHTML=html;
    renderLegsWodCard();
    return;
  }

  d.blocks.forEach((b,bi)=>{
    if(bi>0) html+='<div class="block-sep"></div>';
    html+='<div class="block"><div class="block-hdr"><div class="bh-title">'+b.name+'</div><div class="bh-col">SET</div><div class="bh-col">REP</div><div class="bh-col">NOT</div></div>';
    b.exercises.forEach(ex=>{
      const pills=ex.warmup&&ex.warmup.length>0?'<div class="warmup-pills">'+ex.warmup.map(w=>'<div class="wp">'+w+'</div>').join('')+'</div>':'';
      html+='<div class="ex-row"><div><div class="ex-num">'+ex.num+'</div><div class="ex-name">'+ex.name+'</div>'+pills+'</div><div class="ex-val">'+ex.sets+'</div><div class="ex-val">'+ex.reps+'</div><div class="ex-val muted">'+ex.notes+'</div></div>';
    });
    html+='</div>';
  });
  if(DAY_WODS[d.key]) html+=buildDayWodHTML(d.key);
  html+=buildPRSectionHTML();
  document.getElementById('day-view').innerHTML=html;
}

  mode='recipes';activeRecipe=null;
  setHdrTitle('TARİFLER');

}

function renderRecipeGrid(){
  const filtered=recipeCat==='Tümü'?RECIPES:RECIPES.filter(r=>r.cat===recipeCat);
  let html='<div class="recipe-filter-row">';
  CATS.forEach(c=>{
    html+='<button class="rf-btn'+(recipeCat===c?' on':'')+'" onclick="setRecipeCat(\''+c+'\')">'+c+'</button>';
  });
  html+='</div>';
  html+='<div class="recipe-grid">';
  filtered.forEach((r,i)=>{
    const idx=RECIPES.indexOf(r);
    html+='<div class="r-card" onclick="showRecipe('+idx+')">'+
      '<div class="r-card-name">'+r.name+'</div>'+
      '<div class="r-card-pills">'+
        '<span class="r-pill protein">'+r.protein+'g</span>'+
        '<span class="r-pill">'+r.time+'</span>'+
        '<span class="r-pill">'+r.tool+'</span>'+
      '</div>'+
    '</div>';
  });
  html+='</div>';
  document.getElementById('recipe-view').innerHTML=html;
}

function setRecipeCat(cat){
  recipeCat=cat;
  renderRecipeGrid();
}

function showRecipe(idx){
  activeRecipe=idx;
  const r=RECIPES[idx];
  document.getElementById('recipe-view').style.display='none';
  const det=document.getElementById('recipe-detail');
  det.style.display='block';
  let html='<div class="rd-back" onclick="backToRecipes()">'+
    '<span class="rd-back-arrow">←</span>'+
    '<span class="rd-back-lbl">Tariflere Dön</span>'+
  '</div>';
  html+='<div class="rd-name">'+r.name+'</div>';
  html+='<div class="rd-meta">'+
    '<span class="rd-pill protein">'+r.protein+'g protein</span>'+
    '<span class="rd-pill">'+r.time+'</span>'+
    '<span class="rd-pill">'+r.tool+'</span>'+
    '<span class="rd-pill">'+r.cat+'</span>'+
  '</div>';
  html+='<div class="rd-section">Malzemeler</div>';
  html+='<ul class="rd-ing-list">'+r.ing.map(i=>'<li>'+i+'</li>').join('')+'</ul>';
  html+='<div class="rd-section">Yapılış</div>';
  html+='<ol class="rd-steps-list">'+r.steps.map((s,i)=>
    '<li class="rd-step"><span class="rd-step-num">'+(i+1)+'</span><span class="rd-step-text">'+s+'</span></li>'
  ).join('')+'</ol>';
  det.innerHTML=html;
  document.getElementById('main-scroll').scrollTop=0;resetHeader();
}

function backToRecipes(){
  document.getElementById('recipe-detail').style.display='none';
  document.getElementById('recipe-view').style.display='block';
  renderRecipeGrid();
  document.getElementById('main-scroll').scrollTop=0;resetHeader();
}

let boksAktifAy=0;
let boksAcikHaftalar={};

function setBoks(){
  mode='boks';
  setHdrTitle('BOKS');
  document.getElementById('hdr-target').textContent='3 AY · 12 HAFTA · TEMEL TEKNİK';
  hideAll();
  document.getElementById('boks-view').style.display='block';
  renderBoks();
  renderNav();
  document.getElementById('main-scroll').scrollTop=0;resetHeader();
}

function renderBoks(){
  const ay=BOKS_PLAN[boksAktifAy];
  let html='<div class="boks-ay-tabs">';
  BOKS_PLAN.forEach((a,i)=>{
    html+=`<button class="boks-ay-tab${i===boksAktifAy?' on':''}" onclick="setBoksAy(${i})">${a.ay}<br><span style="font-size:7px;opacity:.7">${a.subtitle}</span></button>`;
  });
  html+='</div>';
  html+=`<div class="boks-ay-meta"><div class="boks-ay-baslik">${ay.ay} — ${ay.subtitle}</div><div class="boks-ay-desc">${ay.desc}</div><div class="boks-ay-stats"><div class="boks-stat"><div class="boks-stat-val">${ay.seansSayisi}</div><div class="boks-stat-lbl">Planlanan seans</div></div><div class="boks-stat"><div class="boks-stat-val">${ay.teknikSayisi}</div><div class="boks-stat-lbl">Yeni teknik</div></div></div></div>`;
  ay.haftalar.forEach((h,hi)=>{
    const key=boksAktifAy+'_'+hi;
    const acik=boksAcikHaftalar[key];
    const pillsHtml=h.yeniTeknikler.map(t=>`<span class="boks-yt-pill">${t}</span>`).join('');
    let bodyHtml='<div class="boks-yeni-teknikler">'+pillsHtml+'</div>';
    h.seanslar.forEach(s=>{
      bodyHtml+=`<div class="boks-seans"><div class="boks-seans-hdr"><span class="boks-seans-lbl">${s.baslik}</span><span class="boks-seans-sure">${s.sure}</span></div>`;
      s.bolumler.forEach(b=>{
        bodyHtml+=`<div class="boks-bolum"><div class="boks-bolum-ad">${b.ad}</div>`;
        b.adimlar.forEach((a,ai)=>{
          bodyHtml+=`<div class="boks-adim"><span class="boks-adim-num">${ai+1}.</span><div><div class="boks-adim-ad">${a.ad}</div><div class="boks-adim-det">${a.det}</div></div></div>`;
        });
        bodyHtml+=`</div>`;
      });
      bodyHtml+=`</div>`;
    });
    html+=`<div class="boks-hafta"><div class="boks-hafta-hdr" onclick="toggleBoksHafta('${key}')"><div class="boks-hafta-sol"><span class="boks-hafta-num">${h.num}</span><span class="boks-hafta-baslik">${h.baslik}</span></div><span class="boks-hafta-arrow${acik?' open':''}">↓</span></div><div class="boks-ilerleme"><div class="boks-il-lbl"><span>3 aylık ilerleme</span><span>${h.ilerleme}%</span></div><div class="boks-il-track"><div class="boks-il-fill" style="width:${h.ilerleme}%"></div></div></div><div class="boks-hafta-body${acik?' open':''}">${bodyHtml}</div></div>`;
  });
  document.getElementById('boks-view').innerHTML=html;
}

function setBoksAy(i){boksAktifAy=i;renderBoks();}
function toggleBoksHafta(key){boksAcikHaftalar[key]=!boksAcikHaftalar[key];renderBoks();}

let wodMode='ana',wodAktif=null;

function setWod(){
  mode='wod';
  setHdrTitle('CROSSFIT WOD');
  document.getElementById('hdr-target').textContent='200+ İKONİK WOD · YAPAY ZEKA ÜRETİMİ';
  hideAll();
  document.getElementById('wod-view').style.display='block';
  wodMode='ana';wodAktif=null;
  renderWodAna();
  renderNav();
  document.getElementById('main-scroll').scrollTop=0;resetHeader();
}

function renderWodAna(){
  const kategoriler=['Tümü','Benchmark Girl','Hero WOD','Classic','CrossFit Open','CrossFit Games','Conditioning','Skill WOD','Functional','Strength','Gymnastics'];
  let html='<div class="wod-tabs" id="wod-kat-tabs">';
  kategoriler.forEach((k,i)=>{
    html+=`<button class="wod-tab${i===0?' on':''}" onclick="filterWod('${k}',this)">${k==='Tümü'?'TÜMÜ':k.toUpperCase()}</button>`;
  });
  html+='</div>';
  html+=`<button class="wod-random-btn" onclick="randomWod()">⚡ RANDOM WOD</button>`;
  html+='<div class="wod-liste" id="wod-liste">';
  WODS.forEach(w=>{
    html+=`<div class="wod-liste-item" onclick="showWod(${w.id})"><div class="wod-liste-sol"><span class="wod-liste-num">#${String(w.id).padStart(3,'0')}</span><div><div class="wod-liste-ad">${w.isim}</div><div class="wod-liste-tur">${w.tur} · ${w.format} · ${w.zorluk}</div></div></div><span class="wod-liste-ok">→</span></div>`;
  });
  html+='</div>';
  document.getElementById('wod-view').innerHTML=html;
}

function filterWod(kat,btn){
  document.querySelectorAll('.wod-tab').forEach(t=>t.classList.remove('on'));
  btn.classList.add('on');
  const filtered=kat==='Tümü'?WODS:WODS.filter(w=>w.tur===kat);
  const liste=document.getElementById('wod-liste');
  liste.innerHTML=filtered.map(w=>
    `<div class="wod-liste-item" onclick="showWod(${w.id})"><div class="wod-liste-sol"><span class="wod-liste-num">#${String(w.id).padStart(3,'0')}</span><div><div class="wod-liste-ad">${w.isim}</div><div class="wod-liste-tur">${w.tur} · ${w.format} · ${w.zorluk}</div></div></div><span class="wod-liste-ok">→</span></div>`
  ).join('');
}

function randomWod(){
  const w=WODS[Math.floor(Math.random()*WODS.length)];
  showWod(w.id);
}

function showWod(id){
  wodAktif=id;
  const w=WODS.find(x=>x.id===id);
  document.getElementById('wod-view').innerHTML=
    `<div class="wod-back" onclick="setWod()"><span class="wod-back-arrow">←</span><span class="wod-back-lbl">WOD Listesine Dön</span></div>`+
    `<div class="wod-card">`+
    `<div class="wod-card-hdr"><div class="wod-card-type">${w.tur}</div><div class="wod-card-name">${w.isim}</div><div class="wod-card-kategori">#${String(w.id).padStart(3,'0')} · ${w.zorluk}</div></div>`+
    `<div class="wod-card-body">`+
    `<div class="wod-card-format">${w.format}</div>`+
    `<div class="wod-card-content">${w.icerik}</div>`+
    `<div class="wod-card-meta"><div class="wod-meta-item"><div class="wod-meta-lbl">Tahmini Süre</div><div class="wod-meta-val">${w.sure}</div></div><div class="wod-meta-item"><div class="wod-meta-lbl">Zorluk</div><div class="wod-meta-val">${w.zorluk}</div></div></div>`+
    `<div class="wod-card-hikaye">${w.hikaye}</div>`+
    `</div></div>`+
    `<button class="wod-random-btn" style="margin-top:14px;" onclick="randomWod()">⚡ BAŞKA RANDOM WOD</button>`;
  document.getElementById('main-scroll').scrollTop=0;resetHeader();
}

function wod100Toggle(catIdx,wodIdx){
  var key=catIdx+'-'+wodIdx;
  wod100OpenItems[key]=!wod100OpenItems[key];
  var detail=document.getElementById('wod100-detail-'+key);
  var arrow=document.getElementById('wod100-arrow-'+key);
  if(detail) detail.classList.toggle('open',!!wod100OpenItems[key]);
  if(arrow) arrow.classList.toggle('open',!!wod100OpenItems[key]);
}

function wod100SetCat(i){
  wod100ActiveCat=i;
  document.querySelectorAll('.wod100-cat-tab').forEach(function(t,j){t.classList.toggle('on',j===i);});
  renderWod100Content();
  document.getElementById('main-scroll').scrollTop=0;resetHeader();
}

function renderWod100Content(){
  var cont=document.getElementById('wod100-content');
  if(!cont) return;
  var cat=WOD100_CATS[wod100ActiveCat];
  var html='<div class="wod100-cat-hero">'+
    '<div class="wod100-cat-hero-title">'+cat.label+'</div>'+
    '<div class="wod100-cat-hero-desc">'+cat.desc+'</div>'+
    '<div class="wod100-cat-hero-count">'+cat.wods.length+' WOD</div>'+
  '</div><div class="wod100-list">';
  cat.wods.forEach(function(w,wi){
    var key=wod100ActiveCat+'-'+wi;
    var open=!!wod100OpenItems[key];
    html+='<div class="wod100-item">'+
      '<div class="wod100-item-hdr" onclick="wod100Toggle('+wod100ActiveCat+','+wi+')">'+
        '<div class="wod100-item-left">'+
          '<div class="wod100-item-num">#'+w.n+'</div>'+
          '<div>'+
            '<div class="wod100-item-name">'+w.name+'</div>'+
            '<div class="wod100-item-type">'+w.format+'</div>'+
          '</div>'+
        '</div>'+
        '<div class="wod100-item-arrow'+(open?' open':'')+'" id="wod100-arrow-'+key+'">↓</div>'+
      '</div>'+

        '</div>'+
      '</div>'+
    '</div>';
  });
  html+='</div>';
  cont.innerHTML=html;
}

function renderWod100View(){
  var v=document.getElementById('wod100-view');
  var html='<div class="wod100-cat-tabs">';
  WOD100_CATS.forEach(function(c,i){
    html+='<button class="wod100-cat-tab'+(i===wod100ActiveCat?' on':'')+'" onclick="wod100SetCat('+i+')">'+c.label+'</button>';
  });
  html+='</div><div id="wod100-content"></div>';
  v.innerHTML=html;
  renderWod100Content();
}

function setWod100(){
  mode='wod100';
  document.getElementById('hdr-title').textContent='WOD\'LAR';
  document.getElementById('hdr-target').textContent='EN İYİ 100 WOD · KATEGORİLERE GÖRE';
  hideAll();
  document.getElementById('wod100-view').style.display='block';
  document.getElementById('nav').style.display='none';
  renderWod100View();
  renderNav();
  document.getElementById('main-scroll').scrollTop=0;resetHeader();
}

function emomToggle(catIdx,emomIdx){
  var key=catIdx+'-'+emomIdx;
  emomOpenItems[key]=!emomOpenItems[key];
  var detail=document.getElementById('emom-detail-'+key);
  var arrow=document.getElementById('emom-arrow-'+key);
  if(detail) detail.classList.toggle('open',!!emomOpenItems[key]);
  if(arrow) arrow.classList.toggle('open',!!emomOpenItems[key]);
}

function emomSetCat(i){
  emomActiveCat=i;
  renderEmomView();
  document.getElementById('main-scroll').scrollTop=0;resetHeader();
}

function renderEmomContent(){
  var cont=document.getElementById('emom-content');
  if(!cont) return;
  var cat=EMOM_CATS[emomActiveCat];
  var html='<div class="emom-hero">'+
    '<div class="emom-hero-title">'+cat.label+'</div>'+
    '<div class="emom-hero-desc">'+cat.desc+'</div>'+
    '<div class="emom-hero-tag">'+cat.tag+' · '+cat.emoms.length+' '+cat.format+'</div>'+
  '</div><div class="emom-list">';
  cat.emoms.forEach(function(e,ei){
    var key=emomActiveCat+'-'+ei;
    var open=!!emomOpenItems[key];
    html+='<div class="emom-item">'+
      '<div class="emom-item-hdr" onclick="emomToggle('+emomActiveCat+','+ei+')">'+
        '<div class="emom-item-left">'+
          '<div><div class="emom-item-dur">'+e.dur+'<div class="emom-item-dur-lbl">'+e.durLbl+'</div></div></div>'+
          '<div><div class="emom-item-name">'+e.name+'</div><div class="emom-item-type">'+e.type+'</div></div>'+
        '</div>'+
        '<div class="emom-item-arrow'+(open?' open':'')+'" id="emom-arrow-'+key+'">↓</div>'+
      '</div>'+
      '<div class="emom-detail'+(open?' open':'')+'" id="emom-detail-'+key+'">'+
        '<div class="emom-detail-inner">'+
          '<div class="emom-minute-list">';
    e.minutes.forEach(function(m){
      html+='<div class="emom-minute"><div class="emom-minute-lbl">'+m.lbl+'</div><div class="emom-minute-content">'+m.content+'</div></div>';
    });
    html+='</div>'+
      '<div class="emom-meta">'+
        '<div class="emom-meta-item"><div class="emom-meta-lbl">Süre</div><div class="emom-meta-val">'+e.sure+'</div></div>'+
        '<div class="emom-meta-item"><div class="emom-meta-lbl">Zorluk</div><div class="emom-meta-val">'+e.zorluk+'</div></div>'+
        '<div class="emom-meta-item"><div class="emom-meta-lbl">Kaslar</div><div class="emom-meta-val" style="font-size:9px;">'+e.kaslar+'</div></div>'+
      '</div>'+
      '<div class="emom-note">'+e.note+'</div>'+
    '</div></div></div>';
  });
  html+='</div>';
  cont.innerHTML=html;
}

function renderEmomView(){
  var v=document.getElementById('emom-view');

  // Format grupları
  var formats=[
    {key:'EMOM', label:'EMOM', desc:'Every Minute on the Minute'},
    {key:'AMRAP', label:'AMRAP', desc:'As Many Rounds As Possible'},
    {key:'INTERVAL', label:'INTERVAL', desc:'Zamanlı çalışma / dinlenme'},
    {key:'MURPH', label:'MURPH', desc:'8 haftalık hazırlık programı'},
  ];

  // Aktif format
  var activeCat=EMOM_CATS[emomActiveCat];
  var activeFormat=activeCat?activeCat.format:'EMOM';

  // Format seçim barı
  var html='<div class="emom-format-bar">';
  formats.forEach(function(f){
    var isActive=f.key===activeFormat;
    html+='<button class="emom-format-btn'+(isActive?' on':'')+'" onclick="emomSetFormat(\''+f.key+'\')">'+
      '<div class="emom-format-lbl">'+f.label+'</div>'+
      '<div class="emom-format-desc">'+f.desc+'</div>'+
    '</button>';
  });
  html+='</div>';

  // O formata ait kategori tabları
  var catsOfFormat=EMOM_CATS.filter(function(c){return c.format===activeFormat;});
  html+='<div class="emom-cat-tabs">';
  catsOfFormat.forEach(function(c){
    var globalIdx=EMOM_CATS.indexOf(c);
    var isOn=globalIdx===emomActiveCat;
    // Kısa etiket — format prefix'i kaldır
    var shortLabel=c.label.replace('AMRAP · ','').replace('INTERVAL · ','');
    html+='<button class="emom-cat-tab'+(isOn?' on':'')+'" onclick="emomSetCat('+globalIdx+')">'+shortLabel+'</button>';
  });
  html+='</div><div id="emom-content"></div>';

  v.innerHTML=html;
  // Aktif kategori bu formatta değilse ilk kategoriye geç
  if(!activeCat||activeCat.format!==activeFormat){
    var firstIdx=EMOM_CATS.findIndex(function(c){return c.format===activeFormat;});
    if(firstIdx>=0) emomActiveCat=firstIdx;
  }
  renderEmomContent();
}

function emomSetFormat(formatKey){
  if(formatKey==='MURPH'){
    // MURPH formatını seç ama içerik olarak murph view'ı göster
    var firstIdx=EMOM_CATS.findIndex(function(c){return c.format==='EMOM';});
    // murph aktif format olarak işaretle
    document.getElementById('emom-view').innerHTML='';
    hideAll();
    document.getElementById('emom-view').style.display='block';
    mode='emom';
    // Format barını yeniden çiz MURPH aktif olarak
    var v=document.getElementById('emom-view');
    var formats=[
      {key:'EMOM', label:'EMOM', desc:'Every Minute on the Minute'},
      {key:'AMRAP', label:'AMRAP', desc:'As Many Rounds As Possible'},
      {key:'INTERVAL', label:'INTERVAL', desc:'Zamanlı çalışma / dinlenme'},
      {key:'MURPH', label:'MURPH', desc:'8 haftalık hazırlık programı'},
    ];
    var html='<div class="emom-format-bar">';
    formats.forEach(function(f){
      html+='<button class="emom-format-btn'+(f.key==='MURPH'?' on':'')+'" onclick="emomSetFormat(\''+f.key+'\')">'+
        '<div class="emom-format-lbl">'+f.label+'</div>'+
        '<div class="emom-format-desc">'+f.desc+'</div>'+
      '</button>';
    });
    html+='</div><div id="emom-content"></div>';
    v.innerHTML=html;
    // Murph içeriğini emom-content'e render et
    renderMurphInEmom();
    document.getElementById('main-scroll').scrollTop=0;resetHeader();
    return;
  }
  var firstIdx=EMOM_CATS.findIndex(function(c){return c.format===formatKey;});
  if(firstIdx>=0){
    emomActiveCat=firstIdx;
    renderEmomView();
    document.getElementById('main-scroll').scrollTop=0;resetHeader();
  }
}

function renderMurphInEmom(){
  var cont=document.getElementById('emom-content');
  if(!cont) return;
  // Murph week tab bar + content
  var html='<div class="murph-week-tabs">';
  MURPH_WEEKS.forEach(function(w,i){
    html+='<button class="murph-week-tab'+(i===murphActiveWeek?' on':'')+'" onclick="murphSetWeekInEmom('+i+')">'+w.label+'</button>';
  });
  html+='</div><div class="murph-content" id="murph-emom-content"></div>';
  cont.innerHTML=html;
  renderMurphContentInEmom();
}

function murphSetWeekInEmom(i){
  murphActiveWeek=i;
  document.querySelectorAll('.murph-week-tab').forEach(function(t,j){t.classList.toggle('on',j===i);});
  renderMurphContentInEmom();
  document.getElementById('main-scroll').scrollTop=0;resetHeader();
}

function renderMurphContentInEmom(){
  var cont=document.getElementById('murph-emom-content');
  if(!cont) return;
  var w=MURPH_WEEKS[murphActiveWeek];
  var html='<div class="murph-week-hdr">'+
    '<div class="murph-week-title">'+w.title+'</div>'+
    '<div class="murph-week-focus">'+w.focus+'</div>'+
    '<div class="murph-week-desc">'+w.desc+'</div>'+
  '</div>';
  w.gunler.forEach(function(g){
    html+='<div class="murph-day">'+
      '<div class="murph-day-hdr">'+
        '<div class="murph-day-lbl">'+g.gun+'</div>'+
        '<div class="murph-day-name">'+g.name+'</div>'+
        '<div class="murph-day-badge '+g.badge+'">'+g.badge.replace('badge-','').toUpperCase()+'</div>'+
      '</div>'+
      '<div class="murph-day-body"><div class="murph-ex-list">';
    g.exs.forEach(function(ex){
      html+='<div class="murph-ex">'+
        '<div><div class="murph-ex-name">'+ex.name+'</div>'+(ex.note?'<div class="murph-ex-note">'+ex.note+'</div>':'')+'</div>'+
        '<div class="murph-ex-val">'+ex.val+'</div>'+
      '</div>';
    });
    html+='</div>';
    if(g.tip) html+='<div class="murph-tip"><div class="murph-tip-text">'+g.tip+'</div></div>';
    html+='</div></div>';
  });
  cont.innerHTML=html;
}

function setEmom(){
  mode='emom';
  setHdrTitle('EMOM');
  document.getElementById('hdr-target').textContent='KÜTÜPHANESİ · 100+ ŞABLON · KAS GRUBUNA GÖRE';
  hideAll();
  document.getElementById('emom-view').style.display='block';
  renderEmomView();
  renderNav();
  document.getElementById('main-scroll').scrollTop=0;resetHeader();
}

// SCROLL-AWARE HEADER COLLAPSE
(function(){
  var header=document.getElementById('header');
  var scroll=document.getElementById('main-scroll');
  if(!scroll||!header) return;
  scroll.addEventListener('scroll',function(){
    header.classList.toggle('collapsed', scroll.scrollTop > 60);
  },{passive:true});
})();

function resetHeader(){
  var h=document.getElementById('header');
  if(h) h.classList.remove('collapsed');
}
